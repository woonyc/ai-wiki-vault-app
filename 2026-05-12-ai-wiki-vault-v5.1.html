/* ----- v5.1 Capture modal — paste raw input + send to Temp Inbox ----- */
function openCaptureModal(){
  const m = $('#captureModalBg');
  if (!m){
    document.body.insertAdjacentHTML('beforeend', `
      <div class="modal-bg" id="captureModalBg">
        <div class="modal" style="width:640px">
          <h3>⊕ Capture to Temp Inbox</h3>
          <div class="modal-body">
            <label>Paste raw input (URL, multiple URLs, or text)</label>
            <textarea id="capInput" placeholder="https://example.com/article\nhttps://twitter.com/handle/status/123\nor just paste any text"></textarea>
            <label>Hint (optional)</label>
            <input id="capHint" placeholder="finance-trading | ai-research | hermes-ops | ..." />
            <label>User note (optional)</label>
            <input id="capNote" placeholder="why are you saving this?" />
            <div class="form-callout">Capture is reversible. Items sit in Temp Inbox until you click <b>Prepare</b>. Nothing touches the vault yet.</div>
          </div>
          <div class="modal-foot">
            <button id="capCancel">Cancel</button>
            <button id="capSave" class="primary">Capture</button>
          </div>
        </div>
      </div>
    `);
  }
  $('#captureModalBg').classList.add('show');
  setTimeout(() => $('#capInput').focus(), 50);
  $('#capCancel').onclick = closeCaptureModal;
  $('#capSave').onclick = () => {
    const txt = $('#capInput').value.trim();
    if (!txt){ toast('Empty input'); return; }
    const t = IngestPipeline.capture(txt, { hint: $('#capHint').value.trim(), note: $('#capNote').value.trim() });
    closeCaptureModal();
    Vault.state.ui.activeView = 'inbox'; Vault.persist(); render();
    toast(`Captured to Temp Inbox (${Vault.listTempItems().filter(x=>x.status==='captured').length} pending)`);
  };
}
function closeCaptureModal(){
  const m = $('#captureModalBg'); if (!m) return;
  m.classList.remove('show');
  $('#capInput').value = ''; $('#capHint').value = ''; $('#capNote').value = '';
}

/* ----- v5.1 Temp Inbox view ----- */
function renderInboxView(){
  const items = Vault.listTempItems();
  const captured = items.filter(t => t.status === 'captured');
  const archived = items.filter(t => t.status === 'archived' || t.status === 'discarded');
  $('#crumb').innerHTML = `vault / <b>inbox</b>`;
  $('#mainActions').innerHTML = `
    <button id="aCapture">⊕ Capture</button>
    <button id="aPrepAll" ${captured.length?'':'disabled'}>Prepare all (${captured.length})</button>
    <button id="aClearArchived" ${archived.length?'':'disabled'}>Clear archived (${archived.length})</button>
  `;

  const main = $('#mainContent');
  let warnHtml = '';
  if (captured.length > 25) warnHtml = `<div class="inbox-warn critical">Stale inbox: ${captured.length} captured items. Prepare or archive in batches.</div>`;
  else if (captured.length > 10) warnHtml = `<div class="inbox-warn">Inbox getting full: ${captured.length} captured items. Consider preparing.</div>`;

  if (!items.length){
    main.innerHTML = warnHtml + `
      <div class="inbox-bar"><h2>Temp Inbox · 0 items</h2></div>
      <div class="empty-hint">Empty. Click <b>⊕ Capture</b> to dump a URL, multiple URLs, or pasted text. Capture is reversible — nothing touches the vault until you Prepare + Commit.</div>
    `;
  } else {
    main.innerHTML = warnHtml + `
      <div class="inbox-bar"><h2>Temp Inbox · ${captured.length} pending · ${archived.length} archived</h2></div>
      ${[...items].reverse().map(t => `
        <div class="item-card">
          <div class="head">
            <span><span class="status ${t.status}">${escapeHtml(t.status)}</span> &nbsp; ${escapeHtml(t.captured_at.slice(0,16).replace('T',' '))} ${t.source_hint?'· hint: '+escapeHtml(t.source_hint):''}</span>
            <span>${(t.warnings||[]).length ? '⚠ ' + (t.warnings||[]).length + ' warning(s)' : ''}</span>
          </div>
          ${t.user_note ? `<div style="font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-bottom:6px">note: ${escapeHtml(t.user_note)}</div>` : ''}
          <div class="raw">${escapeHtml(t.raw_input.slice(0,400))}${t.raw_input.length>400?'\n…':''}</div>
          <div class="row-actions">
            ${t.status === 'captured' ? `<button class="primary" data-prep="${t.id}">Prepare</button>` : ''}
            <button data-arch="${t.id}">Archive</button>
            <button data-del="${t.id}">Delete</button>
          </div>
        </div>
      `).join('')}
    `;
  }

  $('#aCapture').onclick = openCaptureModal;
  if ($('#aPrepAll')) $('#aPrepAll').onclick = () => {
    let n = 0;
    captured.forEach(t => { const r = IngestPipeline.normalize(t.id); if (r.ok) n += r.drafts.length; });
    Vault.state.ui.activeView = 'review'; Vault.persist(); render();
    toast(`Prepared ${captured.length} item(s) → ${n} draft(s)`);
  };
  if ($('#aClearArchived')) $('#aClearArchived').onclick = () => {
    if (!confirm(`Permanently delete ${archived.length} archived item(s)?`)) return;
    Vault.state.tempItems = Vault.state.tempItems.filter(t => !(t.status === 'archived' || t.status === 'discarded'));
    Vault.persist(); render();
  };
  $$('[data-prep]').forEach(b => b.onclick = () => {
    const r = IngestPipeline.normalize(b.dataset.prep);
    if (r.ok){ Vault.state.ui.activeView = 'review'; Vault.persist(); render(); toast(`Prepared → ${r.drafts.length} draft(s)`); }
    else toast(`Prepare failed: ${r.reason}`);
  });
  $$('[data-arch]').forEach(b => b.onclick = () => { Vault.updateTempItem(b.dataset.arch, { status:'archived' }); render(); });
  $$('[data-del]').forEach(b => b.onclick = () => { Vault.removeTempItem(b.dataset.del); render(); });
}

/* ----- v5.1 Review view — ingestDrafts in draft_ready / needs_review ----- */
function renderReviewView(){
  const drafts = Vault.listIngestDrafts().filter(d => ['draft_ready','needs_review'].includes(d.status));
  $('#crumb').innerHTML = `vault / <b>review</b>`;
  $('#mainActions').innerHTML = drafts.length ? `<button id="aCommitAll">Commit non-review (${drafts.filter(d=>!d.review_required).length})</button>` : '';
  const main = $('#mainContent');

  if (!drafts.length){
    main.innerHTML = `
      <div class="inbox-bar"><h2>Review · 0 drafts</h2></div>
      <div class="empty-hint">No drafts pending review. Capture items in <b>⊞ Inbox</b>, then click <b>Prepare</b> to generate drafts.</div>
    `;
    return;
  }

  main.innerHTML = `
    <div class="inbox-bar"><h2>Review · ${drafts.length} draft${drafts.length===1?'':'s'} pending</h2></div>
    ${drafts.map(d => renderReviewCard(d)).join('')}
  `;

  // Bind action buttons
  $$('[data-commit]').forEach(b => b.onclick = async () => {
    const action = b.dataset.action || 'commit';
    b.disabled = true; b.textContent = '…';
    const r = await IngestPipeline.commit(b.dataset.commit, action);
    if (r.ok){ toast(`✓ Committed (action: ${action})`); render(); }
    else { toast(`Commit failed: ${r.reason}`); b.disabled = false; render(); }
  });
  $$('[data-archive]').forEach(b => b.onclick = () => { IngestPipeline.archiveDraft(b.dataset.archive); render(); toast('Archived'); });

function renderPageView(){
  const id = Vault.state.ui.selectedPageId;

    return;
  }

  crumb.innerHTML = `vault / <b>${escapeHtml(page.title)}</b>`;

  const isAnchor = Anchors.isAnchor(page.id);
  actions.innerHTML = isAnchor
    ? `<button id="aRefresh">Refresh</button>`
    : `<button id="aEdit">${Vault.state.ui.editing ? 'Done' : 'Edit'}</button><button id="aDelete">Delete</button>`;

  const editing = !isAnchor && Vault.state.ui.editing;
  const tagPills = page.tags.map(t => `<span class="pill tag" data-tag="${escapeHtml(t)}">#${escapeHtml(t)}</span>`).join('');

  }).join('');
  const statusPill = page.status==='draft' ? `<span class="pill draft">DRAFT</span>` : '';
  // v5 — review-state, specialist, review-required pills
  const rs = page.review_state || (Anchors.isAnchor(page.id) ? null : Page.defaultReviewState(page.type));
  const reviewPill = rs ? `<span class="pill rs rs-${escapeHtml(rs)}" title="Review state (Brief §9)">${escapeHtml(rs.toUpperCase())}</span>` : '';
  const specialistPill = page.specialist ? `<span class="pill specialist" title="Specialist domain">${escapeHtml(page.specialist)}</span>` : '';
  const reviewReqPill = page.review_required ? `<span class="pill review-required" title="Review required before promotion (finance quarantine)">REVIEW REQUIRED</span>` : '';
  const layerLabel = PAGE_TYPES[page.type]?.layer;
  const layerPill = layerLabel ? `<span class="pill" title="Layer">${escapeHtml(layerLabel)}</span>` : '';

  main.innerHTML = `
    <div class="md">
      <div class="meta">
        <span><b>type</b> ${escapeHtml(page.type)}</span>
        ${layerPill}
        <span><b>updated</b> ${escapeHtml(page.updated)}</span>
        ${statusPill}
        ${reviewPill}
        ${specialistPill}
        ${reviewReqPill}
        ${tagPills}
        ${sourcePills}
      </div>
      ${editing
        ? `<textarea class="editor" id="editorArea">${escapeHtml(page.md)}</textarea>
           <div style="margin-top:10px;display:flex;gap:8px"><button class="op" id="aSave">Save</button><button class="op" id="aCancel">Cancel</button></div>`
        : renderMarkdown(page.md)}
    </div>
  `;

  if (isAnchor){
    $('#aRefresh').onclick = () => render();
  } else if (editing){
    $('#aSave').onclick = () => {
      page.md = $('#editorArea').value;
      Vault.putPage(page);
      Vault.appendLog(LogEntry.create({ op:'edit', summary:`Edited [[${page.title}]]` }));
      Vault.state.ui.editing = false; Vault.persist(); render();
      toast('Saved');
    };
    $('#aCancel').onclick = () => { Vault.state.ui.editing = false; Vault.persist(); render(); };
  } else {
    $('#aEdit').onclick = () => { Vault.state.ui.editing = true; Vault.persist(); render(); };
    $('#aDelete').onclick = () => {
      // Preview cascade scope before confirm
      const titleRe = page.title.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const stubFromMe = new RegExp(`(Created from|First mention via)\\s*\\[\\[${titleRe}\\]\\]`);
      const cascadeStubs = Vault.listPages().filter(p => p.id !== page.id && p.status === 'draft' && stubFromMe.test(p.md||''));
      const cascadeNames = cascadeStubs.map(p => p.title);
      const msg = cascadeStubs.length
        ? `Delete "${page.title}"?\n\nThis will also delete ${cascadeStubs.length} draft stub${cascadeStubs.length===1?'':'s'} that were created from it:\n\n• ${cascadeNames.slice(0,8).join('\n• ')}${cascadeNames.length>8?`\n• …+${cascadeNames.length-8} more`:''}\n\nMentions in other pages will be cleaned up.`
        : `Delete "${page.title}"?`;
      if (!confirm(msg)) return;
      const result = Vault.deletePage(page.id);
      const parts = [`Deleted "${page.title}"`];
      if (result.cascadedStubs) parts.push(`+${result.cascadedStubs} stub${result.cascadedStubs===1?'':'s'}`);

      Vault.appendLog(LogEntry.create({ op:'delete', summary: parts.join(' · ') }));
      render(); toast(parts.join(' · '));
    };
  }

  // wikilink + tag clicks
  $$('.wikilink').forEach(a => {
    a.onclick = (e) => {
      e.preventDefault();
      if (a.dataset.anchor){ Vault.state.ui.selectedPageId = a.dataset.anchor; Vault.persist(); render(); }
      else if (a.dataset.pageid){ Vault.state.ui.selectedPageId = a.dataset.pageid; Vault.state.ui.editing = false; Vault.persist(); render(); }
      else if (a.dataset.create){ openCreatePageModal(a.dataset.create); }
    };
  });
  $$('.pill.tag').forEach(p => p.onclick = () => { Vault.state.ui.activeView='tag'; Vault.state.ui.activeTag = p.dataset.tag; Vault.persist(); render(); });
}

/* Color palette by page type — readable, type-distinct, lime reserved for hubs.
   v5: atoms layer gets warm-orange family (close to wiki rust),
   contexts layer gets cool teal family (visually distinct: "agent memory"). */
const TYPE_COLORS = {
  // wiki layer (warm)
  concept:     '#d97757', // rust — primary ideas
  person:      '#9b8cf2', // soft violet — entities
  source:      '#5fb8c9', // teal — long-form content
  clip:        '#7a7770', // dim ink — ephemera
  synthesis:   '#e6b450', // amber — derived
  note:        '#5a5a5a', // gray — generic
  anchor:      '#ece9e2', // ink — meta
  // atoms layer (warm orange/red family)
  claim:       '#ff8c5a', // orange — extracted claim
  fact:        '#ffb347', // gold-orange — verified
  decision:    '#e74c3c', // red — operating choice
  hypothesis:  '#ffc870', // pale orange — tentative
  question:    '#ff6b9d', // pink — unresolved
  playbook:    '#a78bfa', // purple — reusable workflow
  entity:      '#5fb8c9', // teal — same as source (named object)
  // contexts layer (cool green = "agent working memory")
  'context-pack': '#7ee787' // mint green — generated specialist memory
};
function pageNodeColor(p){ return TYPE_COLORS[p.type] || '#d97757'; }

/* Per-tag color groups (Obsidian-style "Groups" feature).
   Stored on Settings.data.graphGroups as [{name, query, color}].
   query: "tag:foo" | "type:concept" | "path:atoms" | regex on title
   color: hex
   Applied at render time — overrides pageNodeColor when a node matches. */
function nodeGroupColor(p, groups){
  if (!groups || !groups.length) return null;
  for (const g of groups){
    if (matchesGroupQuery(p, g.query)) return g.color;
  }
  return null;
}
function matchesGroupQuery(p, q){
  if (!q) return false;
  q = q.trim();
  if (q.startsWith('tag:'))   return p.tags && p.tags.includes(q.slice(4));
  if (q.startsWith('type:'))  return p.type === q.slice(5);
  if (q.startsWith('layer:')){
    const layer = q.slice(6);
    return PAGE_TYPES[p.type] && PAGE_TYPES[p.type].layer === layer;
  }
  if (q.startsWith('path:'))  return (PAGE_TYPES[p.type]?.folder || '').startsWith(q.slice(5));
  if (q.startsWith('status:')) return p.status === q.slice(7);
  if (q.startsWith('review:')) return p.review_state === q.slice(7);
  // bare token = title regex
  try { return new RegExp(q, 'i').test(p.title); } catch(_){ return false; }
}

/* ============================================================
   GRAPH SETTINGS — persisted control panel state.
   Stored on Settings.data.graphCfg (Settings.persist syncs to localStorage).
   Defaults match Obsidian's graph view feel.
============================================================ */
const GRAPH_DEFAULTS = {
  groups: [],                // [{ name, query, color }]
  filters: {
    showWiki: true,
    showAtoms: true,
    showContexts: true,
    showRaw: true,
    showOrphans: true,
    showDrafts: true,
    minDegree: 0,
    tagFilter: ''            // substring on tag list
  },
  colors: {
    background: '#000000',
    link:       '#6b3a2a',   // rust-brown — matches screenshot
    linkHover:  '#d97757',
    text:       '#a8a59c',
    hub:        '#CCFF00'
  },
  display: {
    showLabels: true,
    showArrows: false,
    nodeScale: 1.0,
    linkOpacity: 0.5,
    labelThreshold: 0       // hide labels for nodes with degree < n
  },
  forces: {
    repel:      380,
    linkLength: 110,
    centerStrength: 0.02,
    cluster:    0.025,
    flow:       0.022       // murmuration intensity
  },
  open: { groups:true, filters:false, colors:false, display:false, forces:false }
};
function getGraphCfg(){
  if (!Settings.data.graphCfg){
    Settings.data.graphCfg = JSON.parse(JSON.stringify(GRAPH_DEFAULTS));
    Settings.save();
  }
  // Defensive: backfill any missing keys after upgrade
  const cfg = Settings.data.graphCfg;
  for (const k of Object.keys(GRAPH_DEFAULTS)){
    if (cfg[k] === undefined) cfg[k] = JSON.parse(JSON.stringify(GRAPH_DEFAULTS[k]));
    else if (typeof GRAPH_DEFAULTS[k] === 'object' && !Array.isArray(GRAPH_DEFAULTS[k])){
      for (const k2 of Object.keys(GRAPH_DEFAULTS[k])){
        if (cfg[k][k2] === undefined) cfg[k][k2] = GRAPH_DEFAULTS[k][k2];
      }
    }
  }
  return cfg;
}
function saveGraphCfg(){ Settings.save(); }

/* Filter pages set per graph cfg.filters before passing to graph build. */
function filterPagesForGraph(pages, cfg){
  const f = cfg.filters;
  return pages.filter(p => {
    const layer = PAGE_TYPES[p.type]?.layer;
    if (layer === 'wiki' && !f.showWiki) return false;
    if (layer === 'atoms' && !f.showAtoms) return false;
    if (layer === 'contexts' && !f.showContexts) return false;
    if (layer === 'raw' && !f.showRaw) return false;
    if (p.status === 'draft' && !f.showDrafts) return false;
    // Orphan filter (skip if no edges); only test if filter is OFF, otherwise keep all.
    if (!f.showOrphans){
      const hasLinks = LinkResolver.explicit(p).length || LinkResolver.backlinks(p).length || LinkResolver.tagPeers(p).length;
      if (!hasLinks) return false;
    }
    if (f.tagFilter){
      const needle = f.tagFilter.toLowerCase();
      if (!p.tags.some(t => t.toLowerCase().includes(needle))) return false;
    }
    return true;
  });
}

      <input type="range" data-disp="${key}" min="${min}" max="${max}" step="${step}" value="${cfg.display[key]}">
      <span class="num">${cfg.display[key]}</span>
    </div>`;
  const displayBody = `
    <div class="row"><label><input type="checkbox" data-disp="showLabels" ${cfg.display.showLabels?'checked':''}>Show labels</label></div>
    ${dispRow('nodeScale','Node scale',0.5,2.0,0.1)}
    ${dispRow('linkOpacity','Link opacity',0.1,1.0,0.05)}
    ${dispRow('labelThreshold','Label min degree',0,10,1)}
  `;
  const forceRow = (key, label, min, max, step) => `
    <div class="row"><label>${label}</label>
      <input type="range" data-force="${key}" min="${min}" max="${max}" step="${step}" value="${cfg.forces[key]}">
      <span class="num">${cfg.forces[key]}</span>
    </div>`;
  const forcesBody = `
    ${forceRow('repel','Repel',100,800,10)}
    ${forceRow('linkLength','Link length',40,300,5)}
    ${forceRow('centerStrength','Center pull',0.0,0.2,0.005)}
    ${forceRow('cluster','Type cluster',0.0,0.1,0.005)}
    ${forceRow('flow','Murmuration flow',0.0,0.05,0.001)}
  `;

  $('#gPanel').innerHTML = `
    <div class="gpanel-head">
      <span><span class="glyph">⎔</span> Graph view</span>
      <div class="ctrls">
        <button id="gPanelReset" title="Reset to defaults">↺</button>
        <button id="gPanelClose" title="Hide panel">×</button>
      </div>
    </div>
    ${sec('groups','Groups', groupsBody)}
    ${sec('filters','Filters', filtersBody)}
    ${sec('colors','Colors', colorsBody)}
    ${sec('display','Display', displayBody)}
    ${sec('forces','Forces', forcesBody)}
  `;

  // Section toggle
  $$('#gPanel .gsec-head').forEach(h => h.onclick = () => {
    const sec = h.parentElement;
    const key = sec.dataset.sec;
    cfg.open[key] = !cfg.open[key];
    sec.classList.toggle('open');
    saveGraphCfg();
  });

  // Filter binds
  $$('#gPanel [data-flt]').forEach(el => {
    el.onchange = el.oninput = () => {
      const k = el.dataset.flt;
      cfg.filters[k] = el.type === 'checkbox' ? el.checked : el.value;
      saveGraphCfg();
      renderGraphView();   // rebuild — filters change node set
    };
  });
  // Color binds
  $$('#gPanel [data-color]').forEach(el => {
    el.oninput = () => { cfg.colors[el.dataset.color] = el.value; saveGraphCfg(); renderGraphView(); };
  });
  // Display binds
  $$('#gPanel [data-disp]').forEach(el => {
    el.oninput = el.onchange = () => {
      const k = el.dataset.disp;
      cfg.display[k] = el.type === 'checkbox' ? el.checked : (+el.value);
      const num = el.parentElement.querySelector('.num'); if (num) num.textContent = cfg.display[k];
      saveGraphCfg(); renderGraphView();
    };
  });
  // Force binds
  $$('#gPanel [data-force]').forEach(el => {
    el.oninput = () => {
      const k = el.dataset.force;
      cfg.forces[k] = +el.value;
      el.parentElement.querySelector('.num').textContent = cfg.forces[k];
      saveGraphCfg(); renderGraphView();
    };
  });
  // Group add
  $('#gAddGroup').onclick = () => {
    const q = $('#gNewQuery').value.trim();
    const c = $('#gNewColor').value || '#ff8c5a';
    if (!q) return;
    cfg.groups.push({ name: q, query: q, color: c });
    saveGraphCfg(); renderGraphView();
  };
  $$('#gPanel [data-gdel]').forEach(el => el.onclick = () => {
    cfg.groups.splice(+el.dataset.gdel, 1); saveGraphCfg(); renderGraphView();
  });
  $$('#gPanel [data-gcolor]').forEach(el => el.oninput = () => {
    cfg.groups[+el.dataset.gcolor].color = el.value; saveGraphCfg(); renderGraphView();
  });
  // Reset
  $('#gPanelReset').onclick = () => {
    if (!confirm('Reset graph view settings to defaults?')) return;
    Settings.data.graphCfg = JSON.parse(JSON.stringify(GRAPH_DEFAULTS));
    saveGraphCfg(); renderGraphView();
  };
  $('#gPanelClose').onclick = () => { $('#gPanel').style.display = 'none'; };
}

function renderGraphView(){
  clearBigGraph();
  $('#crumb').innerHTML = `vault / <b>graph</b>`;
  $('#mainActions').innerHTML = '';
  const main = $('#mainContent');
  const cfg = getGraphCfg();

  main.innerHTML = `
    <div class="graph-wrap" style="height:calc(100vh - 152px)">
      <div class="graph-grid"></div>
      <div class="gpanel" id="gPanel"></div>
      <div class="graph-overlay">
        <h2>// SECOND BRAIN</h2>
        <p>Murmuration of ideas. Drag to rearrange. Scroll to zoom. Hover to isolate. Click to inspect.</p>
      </div>
      <div class="graph-controls">
        <button class="gctl" id="gZoomIn" title="Zoom in">+</button>
        <button class="gctl" id="gZoomOut" title="Zoom out">−</button>
        <button class="gctl" id="gRecenter" title="Recenter">◎</button>
      </div>
      <div class="graph-stats">
        <div class="gstat"><b id="statN">0</b>nodes</div>
        <div class="gstat"><b id="statE">0</b>edges</div>
        <div class="gstat"><b id="statT">0</b>types</div>
      </div>
      <svg id="bigGraph"></svg>
    </div>
  `;

  // Mount the Obsidian-style control panel and bind it; rebind redraws graph in place.
  renderGraphPanel(cfg);

  // Apply filter set BEFORE graph build
  const allPages = Vault.listPages();
  const pages = filterPagesForGraph(allPages, cfg);
  const idSet = new Set(pages.map(p=>p.id));
  const edgeMap = new Map();
  const addEdge = (a, b, soft) => {
    if (a===b || !idSet.has(a) || !idSet.has(b)) return;
    const key = [a,b].sort().join('::');
    if (edgeMap.has(key)){
      const e = edgeMap.get(key);
      if (e.soft && !soft) e.soft = false;
      return;
    }
    const ap = Vault.getPage(a), bp = Vault.getPage(b);
    const cross = ap && bp && (ap.tags[0] || '') !== (bp.tags[0] || '');
    edgeMap.set(key, { source:a, target:b, cross, soft:!!soft });
  };
  pages.forEach(p => {
    LinkResolver.explicit(p).forEach(t => addEdge(p.id, t, false));
    LinkResolver.tagPeers(p).forEach(t => addEdge(p.id, t, true));
  });
  const links = [...edgeMap.values()];

  const degree = {};
  pages.forEach(p => degree[p.id] = 0);
  links.forEach(l => { degree[l.source]++; degree[l.target]++; });
  const maxDeg = Math.max(1, ...Object.values(degree));
  const R_MIN = 5, R_MAX = 15; // 1:3 ratio
  // Hub detection — top 3 by degree (must have degree > 1)
  const sortedDegrees = Object.values(degree).sort((a,b)=>b-a);
  const hubThreshold = Math.max(2, sortedDegrees[2] || 2);
  const nodes = pages.map(p => ({
    id: p.id, label: p.title, type: p.type,
    firstTag: p.tags[0] || '',
    // Group color overrides type color when a Group query matches (Obsidian behavior)
    color: nodeGroupColor(p, cfg.groups) || pageNodeColor(p),
    degree: degree[p.id],
    isHub: degree[p.id] >= hubThreshold,
    r: (R_MIN + (degree[p.id] / maxDeg) * (R_MAX - R_MIN)) * (cfg.display.nodeScale || 1.0)
  }));

  // Stats only — type legend now lives inside the panel.
  const types = [...new Set(nodes.map(n=>n.type))].filter(Boolean);
  $('#statN').textContent = nodes.length;
  $('#statE').textContent = links.length;
  $('#statT').textContent = types.length;

  const svg = d3.select('#bigGraph');
  const wrap = $('.graph-wrap');
  wrap.style.background = cfg.colors.background || '#000';
  const w = wrap.clientWidth, h = wrap.clientHeight;

  svg.selectAll('*').remove();

  // Glow filter
  const defs = svg.append('defs');
  const glow = defs.append('filter').attr('id','nodeGlow').attr('x','-50%').attr('y','-50%').attr('width','200%').attr('height','200%');
  glow.append('feGaussianBlur').attr('stdDeviation','3').attr('result','coloredBlur');

  const g = svg.append('g');

  _bigZoom = d3.zoom().scaleExtent([0.3, 4]).on('zoom', ev => g.attr('transform', ev.transform));
  svg.call(_bigZoom);

  // Cluster centers per page TYPE (concepts cluster, people cluster, etc.)
  const typeOrder = Object.keys(PAGE_TYPES).filter(t => t !== 'anchor' && nodes.some(n=>n.type===t));
  const centers = {};
  typeOrder.forEach((t, i) => {
    const angle = (Math.PI*2*i)/Math.max(typeOrder.length,1) - Math.PI/2;
    const radius = Math.min(w,h) * 0.30;
    centers[t] = { x: w/2 + Math.cos(angle)*radius, y: h/2 + Math.sin(angle)*radius };
  });

  // Obsidian-style links: rust-brown filaments, slightly translucent.
  // Hard wikilinks = solid linkColor, soft tag-peer = lower opacity, cross-cluster = lime accent.
  const baseLink = cfg.colors.link || '#6b3a2a';
  const linkColor = d => d.cross ? cfg.colors.linkHover : baseLink;
  const linkWidth = d => d.soft ? 0.5 : (d.cross ? 1.1 : 0.8);
  const linkDash  = d => d.cross ? '4 4' : (d.soft ? '2 5' : null);
  const linkOpacity = d => (d.soft ? 0.35 : 0.7) * (cfg.display.linkOpacity ?? 0.5) * 2;

  const link = g.append('g').attr('class','links').selectAll('line')
    .data(links).enter().append('line')
    .attr('stroke', linkColor)
    .attr('stroke-width', linkWidth)
    .attr('stroke-dasharray', linkDash)
    .attr('opacity', linkOpacity);

  const node = g.append('g').attr('class','nodes').selectAll('g')
    .data(nodes).enter().append('g')
    .attr('class','node-g')
    .style('cursor','pointer');

  // Outer halo — hubs get bigger + lime
  node.append('circle')
    .attr('class','halo')
    .attr('r', d => d.r + (d.isHub ? 14 : 8))
    .attr('fill','none')
    .attr('stroke', d => d.isHub ? '#CCFF00' : d.color)
    .attr('stroke-width', d => d.isHub ? 1.4 : 1)
    .attr('opacity', d => d.isHub ? 0.5 : 0.2);

  // Inner ring on hubs — extra emphasis
  node.filter(d => d.isHub).append('circle')
    .attr('class','hub-ring')
    .attr('r', d => d.r + 5)
    .attr('fill','none')
    .attr('stroke','#CCFF00')
    .attr('stroke-width', 0.8)
    .attr('opacity', 0.3);

  node.append('circle')
    .attr('class','core')
    .attr('r', d => d.r)
    .attr('fill', d => d.color)
    .attr('stroke', '#0a0a0a')
    .attr('stroke-width', 2)
    .attr('filter','url(#nodeGlow)');

  node.append('text')
    .attr('y', d => d.r + 16)
    .attr('text-anchor','middle')
    .attr('font-family','IBM Plex Mono, monospace')
    .attr('font-size', d => Math.max(9, Math.min(11, 8 + d.degree*0.4)))
    .attr('fill', cfg.colors.text || '#a8a59c')
    .attr('letter-spacing','0.04em')
    .attr('opacity', d => (cfg.display.showLabels && d.degree >= (cfg.display.labelThreshold||0)) ? 1 : 0)
    .text(d => d.label.length > 22 ? d.label.slice(0,20)+'…' : d.label);

  _bigSim = d3.forceSimulation(nodes)
    .alphaDecay(0.003)
    .velocityDecay(0.72)
    .force('link', d3.forceLink(links).id(d=>d.id).distance(d => d.cross ? cfg.forces.linkLength*1.55 : cfg.forces.linkLength).strength(0.32))
    .force('charge', d3.forceManyBody().strength(-cfg.forces.repel).distanceMax(420))
    .force('collide', d3.forceCollide().radius(d => d.r + 38).strength(0.9))
    .force('center', d3.forceCenter(w/2, h/2))
    .force('x', d3.forceX(w/2).strength(cfg.forces.centerStrength))
    .force('y', d3.forceY(h/2).strength(cfg.forces.centerStrength))
    .force('cluster', alpha => {
      nodes.forEach(n => {
        const c = centers[n.type]; if (!c) return;
        n.vx += (c.x - n.x) * cfg.forces.cluster * alpha;
        n.vy += (c.y - n.y) * cfg.forces.cluster * alpha;
      });
    })
    .force('flow', () => {
      // murmuration: phased per-node sin/cos perturb + drift toward swarm avg velocity
      const t = performance.now() * 0.00018;
      let avx = 0, avy = 0, count = 0;
      nodes.forEach(d => { if (d.fx == null) { avx += d.vx; avy += d.vy; count++; } });
      if (count){ avx /= count; avy /= count; }
      const intensity = cfg.forces.flow;
      nodes.forEach((d, i) => {
        if (d.fx != null) return;
        const phase = i * 0.42;
        const fx = (Math.cos(t + phase) + 0.4 * Math.cos(t * 1.7 + phase * 2.1)) * intensity;
        const fy = (Math.sin(t * 1.2 + phase) + 0.4 * Math.sin(t * 0.8 + phase * 1.5)) * intensity;
        d.vx += fx; d.vy += fy;
        d.vx += (avx - d.vx) * 0.006;
        d.vy += (avy - d.vy) * 0.006;
      });
    })
    .on('tick', () => {
      link.attr('x1', d=>d.source.x).attr('y1', d=>d.source.y)
          .attr('x2', d=>d.target.x).attr('y2', d=>d.target.y);
      node.attr('transform', d => `translate(${d.x},${d.y})`);
    });

  _bigSim.alphaTarget(0.025).restart();  // perpetual drift = swarm

  const drag = d3.drag()
    .on('start', (ev, d) => { if (!ev.active) _bigSim.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
    .on('drag',  (ev, d) => { d.fx=ev.x; d.fy=ev.y; })
    .on('end',   (ev, d) => { if (!ev.active) _bigSim.alphaTarget(0.025); d.fx=null; d.fy=null; });
  node.call(drag);

  const linkedById = {};
  links.forEach(l => {
    const a = typeof l.source==='object' ? l.source.id : l.source;
    const b = typeof l.target==='object' ? l.target.id : l.target;
    (linkedById[a] ??= new Set()).add(b);
    (linkedById[b] ??= new Set()).add(a);
  });
  node.on('mouseenter', (ev,d) => {
      node.style('opacity', n => (n.id===d.id || linkedById[d.id]?.has(n.id)) ? 1 : 0.18);
      link.style('opacity', l => (l.source.id===d.id || l.target.id===d.id) ? 0.95 : 0.05);
      link.style('stroke', l => (l.source.id===d.id || l.target.id===d.id) ? '#d97757' : linkColor(l));
    })
    .on('mouseleave', () => {
      node.style('opacity', 1);
      link.style('opacity', linkOpacity);
      link.style('stroke', linkColor);
    })
    .on('click', (ev, d) => {
      Vault.state.ui.selectedPageId = d.id;
      Vault.state.ui.activeView = 'page';
      Vault.persist(); render();
    });

  // Neuron pulse — random node fires, halo expands, neighbors flash via links
  function firePulse(){
    if (!nodes.length) return;
    const n = nodes[Math.floor(Math.random() * nodes.length)];
    const sel = node.filter(d => d.id === n.id);
    const baseR = n.r;
    const color = n.color;
    sel.select('.halo').interrupt()
      .transition().duration(260).ease(d3.easeQuadOut)
      .attr('r', baseR + 28).attr('opacity', 0.55).attr('stroke-width', 1.4)
      .transition().duration(900).ease(d3.easeQuadIn)
      .attr('r', baseR + 8).attr('opacity', 0.2).attr('stroke-width', 1);
    sel.select('.core').interrupt()
      .transition().duration(180).ease(d3.easeQuadOut)
      .attr('r', baseR + 1.8).attr('fill', '#CCFF00')
      .transition().duration(700).ease(d3.easeQuadIn)
      .attr('r', baseR).attr('fill', color);
    const neighbors = links.filter(l => (l.source.id===n.id || l.target.id===n.id));
    neighbors.forEach(l => {
      const otherId = l.source.id === n.id ? l.target.id : l.source.id;
      link.filter(x => (x.source.id===l.source.id && x.target.id===l.target.id))
        .interrupt()
        .transition().duration(220)
        .attr('stroke', '#CCFF00').attr('opacity', 0.95).attr('stroke-width', 1.6)
        .transition().duration(700)
        .attr('stroke', linkColor(l))
        .attr('opacity', linkOpacity(l)).attr('stroke-width', linkWidth(l));
      setTimeout(() => {
        const ns = node.filter(d => d.id === otherId);
        const nd = nodes.find(d => d.id === otherId);
        if (!nd) return;
        ns.select('.core').interrupt()
          .transition().duration(160).attr('r', nd.r + 0.8)
          .transition().duration(500).attr('r', nd.r);
      }, 240);
    });
  }
  _pulseTimer = setInterval(() => {
    firePulse();
    if (Math.random() < 0.35) setTimeout(firePulse, 320 + Math.random()*400);
  }, 1400);

  $('#gZoomIn').onclick  = () => svg.transition().duration(250).call(_bigZoom.scaleBy, 1.4);
  $('#gZoomOut').onclick = () => svg.transition().duration(250).call(_bigZoom.scaleBy, 1/1.4);
  $('#gRecenter').onclick = () => {
    svg.transition().duration(400).call(_bigZoom.transform, d3.zoomIdentity);
    _bigSim.alpha(0.6).restart();
  };
}

function renderSearchView(){
  const q = Vault.state.ui.searchQuery || '';
  $('#crumb').innerHTML = `vault / <b>search · "${escapeHtml(q)}"</b>`;
  $('#mainActions').innerHTML = '';
  const results = Vault.search(q);
  $('#mainContent').innerHTML = `
    <h2 class="mono" style="font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);margin-bottom:16px">${results.length} result${results.length===1?'':'s'} for "${escapeHtml(q)}"</h2>
    ${results.length ? results.map(r => `
      <div class="palette-result" data-result-kind="${r.kind}" data-result-id="${escapeHtml(r.id)}">
        <span class="kind">${r.kind}</span>${escapeHtml(r.label)} <span style="color:var(--ink-3);margin-left:8px">${r.hint}</span>
      </div>`).join('') : '<p class="rail-empty mono">No matches.</p>'}
  `;
  $$('[data-result-id]').forEach(el => el.onclick = () => {
    const k = el.dataset.resultKind, id = el.dataset.resultId;
    if (k==='page'){ Vault.state.ui.selectedPageId=id; Vault.state.ui.activeView='page'; }
    else if (k==='tag'){ Vault.state.ui.activeTag=id; Vault.state.ui.activeView='tag'; }
    Vault.persist(); render();
  });
}

/* ============================================================
   TREE
============================================================ */
function renderTree(){
  const tree = $('#tree');
  const sel = Vault.state.ui.selectedPageId;
  const draftCount = Vault.listDrafts().length;
  const pages = [...Vault.listPages()].sort((a,b)=>a.title.localeCompare(b.title));
  const tags = Vault.allTags();

  // Group pages by type
  const byType = {};
  pages.forEach(p => { (byType[p.type || 'note'] ||= []).push(p); });
  const collapsed = Vault.state.ui.collapsedFolders ||= {};

  // Folder order from PAGE_TYPES.order, anchor handled separately above
  const folderOrder = Object.keys(PAGE_TYPES)
    .filter(t => t !== 'anchor')
    .sort((a,b) => PAGE_TYPES[a].order - PAGE_TYPES[b].order);

  const folderHtml = folderOrder.map(type => {
    const ps = byType[type] || [];
    if (!ps.length) return '';
    const meta = PAGE_TYPES[type];
    const isCollapsed = !!collapsed[type];
    const items = isCollapsed ? '' : ps.map(p => `
      <div class="tree-item ${sel===p.id && Vault.state.ui.activeView==='page'?'active':''}" data-pageid="${p.id}" style="padding-left:30px">
        ${escapeHtml(p.title)}${p.status==='draft'?' <span class="sub">DRAFT</span>':''}
      </div>
    `).join('');
    return `
      <div class="tree-section" data-toggle="${type}" style="cursor:pointer">
        ${meta.glyph} ${meta.label} <span class="sub">${ps.length}${isCollapsed?' ▸':' ▾'}</span>
      </div>
      ${items}
    `;
  }).join('');

  // v5.1 — Inbox + Review counts surface in tree
  const inboxPending = Vault.listTempItems().filter(t => t.status === 'captured').length;
  const reviewPending = Vault.listIngestDrafts().filter(d => ['draft_ready','needs_review'].includes(d.status)).length;
  const reviewRequiredCount = Vault.listIngestDrafts().filter(d => ['draft_ready','needs_review'].includes(d.status) && d.review_required).length;
  const syncPending = Vault.state.sync?.sync_status === 'pending';

  tree.innerHTML = `
    <div class="tree-section">Workflow ${syncPending ? '<span class="sub" style="color:var(--rust)">sync pending</span>' : ''}</div>
    <div class="tree-item ${Vault.state.ui.activeView==='inbox'?'active':''}" data-view="inbox">⊞ Temp Inbox ${inboxPending ? `<span class="sub" style="color:${inboxPending>10?'#e74c3c':'var(--rust)'}">${inboxPending}</span>` : ''}</div>
    <div class="tree-item ${Vault.state.ui.activeView==='review'?'active':''}" data-view="review">↯ Review ${reviewPending ? `<span class="sub" style="color:${reviewRequiredCount?'#e74c3c':'var(--lime)'}">${reviewPending}${reviewRequiredCount?` · ${reviewRequiredCount}!`:''}</span>` : ''}</div>
    <div class="tree-item ${Vault.state.ui.activeView==='ingestlog'?'active':''}" data-view="ingestlog">⌚ Ingest log</div>
    <div class="tree-item ${Vault.state.ui.activeView==='backups'?'active':''}" data-view="backups">⎙ Backups <span class="sub">${(Vault.state.backups||[]).length}/5</span></div>

    <div class="tree-section">Anchors</div>
    <div class="tree-item anchor ${sel==='__index__'?'active':''}" data-pageid="__index__">▦ index</div>
    <div class="tree-item anchor ${sel==='__log__'?'active':''}" data-pageid="__log__">⌚ log</div>

    <div class="tree-section">Drafts (lint) ${draftCount ? `<span class="sub">${draftCount}</span>` : ''}</div>
    <div class="tree-item ${Vault.state.ui.activeView==='drafts'?'active':''}" data-view="drafts">↯ lint drafts</div>

    <div class="tree-section" style="display:flex;justify-content:space-between;align-items:center">
      <span>Pages <span class="sub">${pages.length}</span></span>
      <button id="addPage" title="New page">+</button>
    </div>
    ${folderHtml || '<div class="tree-empty">no pages</div>'}

    <div class="tree-section">Tags</div>
    ${tags.length ? tags.map(t => `
      <div class="tree-item ${Vault.state.ui.activeTag===t&&Vault.state.ui.activeView==='tag'?'active':''}" data-tag="${escapeHtml(t)}">#${escapeHtml(t)}</div>
    `).join('') : '<div class="tree-empty">no tags</div>'}

    <div class="tree-section">Graph</div>
    <div class="tree-item ${Vault.state.ui.activeView==='graph'?'active':''}" data-view="graph">◌ open graph</div>
  `;

  // Folder collapse toggling
  $$('[data-toggle]', tree).forEach(el => el.onclick = () => {
    const t = el.dataset.toggle;
    collapsed[t] = !collapsed[t];
    Vault.persist(); renderTree();
  });

  $$('[data-pageid]', tree).forEach(el => el.onclick = () => {
    Vault.state.ui.selectedPageId = el.dataset.pageid;
    Vault.state.ui.activeView = 'page';
    Vault.state.ui.editing = false;
    Vault.persist(); render();
  });
  $$('[data-view]', tree).forEach(el => el.onclick = () => {
    Vault.state.ui.activeView = el.dataset.view; Vault.persist(); render();

  $$('[data-sid]', tree).forEach(el => el.onclick = () => {
    const s = Vault.getSource(el.dataset.sid);

function renderRail(){
  const rail = $('#rail');
  const id = Vault.state.ui.selectedPageId;
  const page = Anchors.asPage(id) || Vault.getPage(id);

  let backlinksHtml = '<div class="rail-empty">none</div>';
  let tagsHtml = '<div class="rail-empty">none</div>';
  if (page && !Anchors.isAnchor(page.id)){
    const links = LinkResolver.linksFor(page);
    const back = links.backlinks.map(pid => Vault.getPage(pid)).filter(Boolean);
    if (back.length) backlinksHtml = back.map(p => `<a class="rail-link" data-pageid="${p.id}">← ${escapeHtml(p.title)}</a>`).join('');
    if (page.tags.length) tagsHtml = page.tags.map(t => `<a class="rail-link" data-tag="${escapeHtml(t)}">#${escapeHtml(t)}</a>`).join('');
  }

  rail.innerHTML = `
    <div class="rail-block">
      <h4>Backlinks</h4>
      ${backlinksHtml}
    </div>
    <div class="rail-block">
      <h4>Tags</h4>
      ${tagsHtml}
    </div>
  `;

  $$('[data-pageid]', rail).forEach(a => a.onclick = () => { Vault.state.ui.selectedPageId=a.dataset.pageid; Vault.state.ui.activeView='page'; Vault.persist(); render(); });
  $$('[data-tag]', rail).forEach(a => a.onclick = () => { Vault.state.ui.activeTag=a.dataset.tag; Vault.state.ui.activeView='tag'; Vault.persist(); render(); });
}

function openIngestModal(){
  IngestFlow.reset();
  renderIngestModal();
}

function renderIngestModal(){
  const f = IngestFlow;
  const stages = ['source','fetch','preview','done'];
  const stageMap = { idle:'source', fetching:'fetch', preview:'preview', committing:'preview', done:'done', error:'fetch' };
  const current = stageMap[f.stage];
  const stagesHtml = stages.map(s => {
    const idx = stages.indexOf(s), curIdx = stages.indexOf(current);
    const cls = s===current ? 'active' : (idx < curIdx ? 'done' : '');
    return `<div class="stage ${cls}">${s}</div>`;
  }).join('');

  let body = `<div class="stages">${stagesHtml}</div>`;

  if (f.stage==='idle' || f.stage==='error'){
    body += `
      <div class="src-tabs">
        <button class="src-tab ${f.mode==='url'?'active':''}" data-mode="url">⌖ URL</button>
        <button class="src-tab ${f.mode==='pdf'?'active':''}" data-mode="pdf">▦ PDF</button>
        <button class="src-tab ${f.mode==='text'?'active':''}" data-mode="text">✎ Paste text</button>
      </div>
    `;
    if (f.error) body += `<div style="padding:10px;border-left:2px solid var(--rust);background:var(--rust-soft);font-family:var(--mono);font-size:11px;color:var(--ink);margin-bottom:10px">${escapeHtml(f.error)}</div>`;

    if (f.mode==='url'){
      body += `
        <label>Web URL</label>
        <input id="ingUrl" placeholder="https://example.com/article" autofocus />
        <p class="mono" style="font-size:10px;color:var(--ink-3);margin-top:6px">Fetched via Jina Reader (free, no auth). Paywalled or login-gated pages may be partial.</p>
      `;
    } else if (f.mode==='pdf'){
      body += `
        <label>PDF file</label>
        <div class="drop" id="pdfDrop">
          ⤴ drop PDF here or click to choose
          <input type="file" id="pdfFile" accept="application/pdf" style="display:none" />
        </div>
      `;
    } else {
      body += `
        <label>Title (optional)</label>
        <input id="ingTitle" placeholder="auto-detect from first line" />
        <label>Raw text</label>
        <textarea id="ingText" placeholder="Paste article, transcript, notes…" autofocus></textarea>
      `;
    }
  }

  if (f.stage==='fetching'){
    body += `<div style="padding:40px;text-align:center;font-family:var(--mono);font-size:12px;color:var(--ink-2)"><span class="spinner"></span>Fetching ${f.mode==='pdf'?'and parsing PDF':'and converting to markdown'}…</div>`;
  }

  if (f.stage==='preview' || f.stage==='committing'){
    const meta = f.fetched.meta;
    body += `
      <div class="fetched-meta">
        <b>${escapeHtml(f.fetched.type.toUpperCase())}</b> ·
        ${escapeHtml(f.fetched.text.length.toLocaleString())} chars
        ${meta?.pages ? ` · ${meta.pages} pages` : ''}
        ${meta?.sizeKb ? ` · ${meta.sizeKb} KB` : ''}
        ${f.fetched.url ? ` · <a href="${escapeHtml(f.fetched.url)}" target="_blank" style="color:var(--rust)">source</a>` : ''}
      </div>
      <label>Title</label>
      <input id="ingEditTitle" value="${escapeHtml(f.edits.title)}" />
      <label>Content (edit before commit)</label>
      <textarea id="ingEditText" style="min-height:280px">${escapeHtml(f.edits.text)}</textarea>
      <p class="mono" style="font-size:10px;color:var(--ink-3);margin-top:6px">Commit will: create source page · extract concepts · draft updates to linked pages · append to log.md</p>
    `;
  }

  if (f.stage==='done'){
    const linked = f.linkedPages || [];
    const concepts = f.conceptStubs || [];
    const people = f.personStubs || [];
    const total = 1 + linked.length + concepts.length + people.length;
    const section = (label, glyph, items, color='var(--lime)') => items.length ? `
      <div style="margin-bottom:10px">
        <div class="mono" style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px">${glyph} ${label} · ${items.length}</div>
        <div class="mono" style="font-size:11px;color:var(--ink-2);padding:8px 10px;background:var(--bg-2);border-left:2px solid ${color}">
          ${items.map(p=>`→ <a class="wikilink" data-jump="${p.id}">${escapeHtml(p.title)}</a>`).join('<br>')}
        </div>
      </div>` : '';
    body += `
      <div style="padding:14px 0">
        <div style="color:var(--lime);font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:14px;text-align:center">✓ ${total} page${total===1?'':'s'} written to vault</div>
        ${section('Source page', PAGE_TYPES[f.sourcePage.type]?.glyph || '⌖', [f.sourcePage], 'var(--rust)')}
        ${section('Concept stubs', '◇', concepts)}
        ${section('Person stubs', '☻', people)}
        ${section('Auto-linked existing', '↔', linked, 'rgba(255,255,255,.3)')}
      </div>
    `;
  }

  // actions per stage
  let actions = [];
  if (f.stage==='idle' || f.stage==='error'){
    actions = [
      { label:'Cancel', cb: () => { IngestFlow.reset(); closeModal(); }},
      { label: f.mode==='text' ? 'Load' : 'Fetch', primary:true, cb: () => {
        if (f.mode==='url'){
          const url = $('#ingUrl').value.trim();
          if (!url){ toast('Enter URL'); return; }
          IngestFlow.fetchUrl(url);
        } else if (f.mode==='pdf'){
          const file = $('#pdfFile').files?.[0];
          if (!file){ toast('Choose a PDF'); return; }
          IngestFlow.loadPdf(file);
        } else {
          const text = $('#ingText').value.trim();
          if (!text){ toast('Paste some text'); return; }
          IngestFlow.loadText(text, $('#ingTitle').value.trim());
        }
      }}
    ];
  } else if (f.stage==='fetching' || f.stage==='committing'){
    actions = [{ label:'Working…', cb: () => {} }];
  } else if (f.stage==='preview'){
    actions = [
      { label:'← Back', cb: () => { IngestFlow.reset(); renderIngestModal(); }},
      { label:'Commit', primary:true, cb: () => {
        IngestFlow.edits.title = $('#ingEditTitle').value.trim();
        IngestFlow.edits.text = $('#ingEditText').value;
        IngestFlow.commit();
      }}
    ];
  } else if (f.stage==='done'){
    actions = [
      { label:'Ingest another', cb: () => { IngestFlow.reset(); renderIngestModal(); }},
      { label:'View drafts', primary:true, cb: () => { IngestFlow.reset(); closeModal(); }}
    ];
  }

  openModal({ title: 'Ingest source', body, actions });

  // wire dynamic handlers
  $$('.src-tab').forEach(b => b.onclick = () => IngestFlow.setMode(b.dataset.mode));
  $$('[data-jump]').forEach(a => a.onclick = () => {
    Vault.state.ui.selectedPageId = a.dataset.jump;
    Vault.state.ui.activeView = 'page';
    Vault.persist();
    IngestFlow.reset(); closeModal(); render();
  });
  const drop = $('#pdfDrop'), pdfInput = $('#pdfFile');
  if (drop && pdfInput){
    drop.onclick = () => pdfInput.click();
    pdfInput.onchange = () => { if (pdfInput.files[0]) IngestFlow.loadPdf(pdfInput.files[0]); };
    drop.ondragover = e => { e.preventDefault(); drop.classList.add('drag'); };
    drop.ondragleave = () => drop.classList.remove('drag');
    drop.ondrop = e => {
      e.preventDefault(); drop.classList.remove('drag');
      const file = e.dataTransfer.files[0];
      if (file && file.type==='application/pdf') IngestFlow.loadPdf(file);
      else toast('Drop a PDF file');
    };
  }
}

function openQueryModal(){
  openModal({

    body: `
      <label>Question</label>
      <textarea id="qInput" placeholder="What is risk management in this vault?"></textarea>

        }
        $('#qAnswer').innerHTML = `

            ${citations.length ? `<div class="citations">${citations.map(c=>`<a data-cite="${c.id}">${escapeHtml(c.title)}</a>`).join('')}</div>` : ''}
          </div>
          <button class="op" id="qSave" style="margin-top:10px">Save as synthesis page</button>
        `;
        $$('#qAnswer [data-cite]').forEach(a => a.onclick = () => { Vault.state.ui.selectedPageId=a.dataset.cite; Vault.state.ui.activeView='page'; Vault.persist(); closeModal(); render(); });
        $('#qSave').onclick = () => {
          const p = Page.create({

            type:'synthesis', tags:['synthesis'], status:'draft',
            sources: citations.map(c=>c.id),
            md: `# ${q}\n\n## Answer\n\n${answer}\n\n## Citations\n\n${citations.map(c=>`- [[${c.title}]]`).join('\n')}\n`
          });
          Vault.putPage(p);

          closeModal();
          Vault.state.ui.selectedPageId=p.id; Vault.state.ui.activeView='page'; Vault.persist(); render();
          toast('Saved as synthesis page');
        };
      }}
    ]
  });
  setTimeout(()=>$('#qInput')?.focus(), 50);
}

async function runLint(){
  toast('Linting…');
  const issues = await llm.lint();
  if (!issues.length){ toast('Vault clean — no issues found'); return; }
  // Convert to drafts so user can review
  issues.forEach(i => {
    Vault.putDraft(Draft.create({
      kind:`lint-${i.kind}`,
      target: i.page,
      content: `Lint issue on [[${Vault.getPage(i.page)?.title || i.page}]]: ${i.detail}`,
      reasoning: `Linter found: ${i.kind}`
    }));
  });
  Vault.appendLog(LogEntry.create({ op:'lint', summary: `${issues.length} issue${issues.length===1?'':'s'} → drafts` }));
  Vault.state.ui.activeView='drafts'; Vault.persist(); render();
  toast(`${issues.length} lint issues queued as drafts`);
}

function applyDraft(id){
  const d = Vault.listDrafts().find(x => x.id===id);
  if (!d) return;
  if (d.kind==='create-page' || d.kind==='create-source-page'){
    const titleMatch = d.content.match(/^#\s+(.+)$/m);
    const title = titleMatch ? titleMatch[1] : 'Untitled';
    const p = Page.create({ title, md: d.content, tags:[], type: d.kind==='create-source-page' ? 'source' : 'concept', status:'draft' });
    Vault.putPage(p);
    Vault.state.ui.selectedPageId = p.id;
    Vault.state.ui.activeView = 'page';
  } else if (d.kind==='append' && d.target){
    const p = Vault.getPage(d.target);
    if (p){ p.md += d.content; Vault.putPage(p); }
  } else if (d.kind.startsWith('lint-')){
    // just acknowledge — linter draft has no auto-fix yet
  }
  Vault.removeDraft(id);
  Vault.appendLog(LogEntry.create({ op:'apply-draft', summary: `Applied: ${d.kind}` }));
  Vault.persist(); render(); toast('Applied');
}

        // LLM settings
        if (!isMock){
          if (isCustom) Settings.data.baseUrl = $('#setBaseUrl')?.value.trim() || '';
          if (needsKey) Settings.data.apiKey = $('#setKey')?.value.trim() || '';
          Settings.data.model = $('#setModel')?.value.trim() || preset.defaultModel;
          Settings.data.maxTokens = parseInt($('#setMax').value, 10) || 2000;
        }
        Settings.save(); applyProvider();

        // GitHub settings
        const ghChanged = $('#ghOwner').value.trim() !== GitHubSync.config.owner ||
                          $('#ghRepo').value.trim() !== GitHubSync.config.repo ||
                          $('#ghToken').value.trim() !== GitHubSync.config.token ||
                          $('#ghBranch').value.trim() !== GitHubSync.config.branch ||
                          $('#ghPath').value.trim() !== GitHubSync.config.path;
        GitHubSync.config.owner = $('#ghOwner').value.trim();
        GitHubSync.config.repo = $('#ghRepo').value.trim();
        GitHubSync.config.branch = $('#ghBranch').value.trim() || 'main';
        GitHubSync.config.path = $('#ghPath').value.trim() || 'vault.json';
        GitHubSync.config.token = $('#ghToken').value.trim();
        if (ghChanged) GitHubSync.sha = null;  // reset SHA on config change
        GitHubSync.save();

        closeModal(); render();
        toast(`Saved — ${isMock?'mock':preset.label}${GitHubSync.configured()?' + GitHub':''}`);

        // If GitHub just configured, do initial sync
        if (ghChanged && GitHubSync.configured()){
          toast('Initializing GitHub sync…');
          try {
            const r = await GitHubSync.manualSync();
            toast(r.pulled ? '✓ Pulled vault from GitHub' : '✓ Pushed initial vault to GitHub');
          } catch(e){
            toast('GitHub: ' + e.message.slice(0,80));
          }
        }
      }}
    ]
  });

  // provider tab switching — update model field default + rerender
  $$('.src-tab[data-prov]').forEach(b => b.onclick = () => {
    const newProv = b.dataset.prov;
    Settings.data.provider = newProv;
    // Reset model to provider default if switching providers
    const newPreset = PROVIDER_PRESETS[newProv];
    if (newPreset && newPreset.defaultModel) Settings.data.model = newPreset.defaultModel;
    Settings.save(); applyProvider();
    openSettingsModal();
  });

  // Export
  const expBtn = $('#vaultExport');
  if (expBtn) expBtn.onclick = () => {
    const blob = new Blob([JSON.stringify(Vault.state, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `vault-${today()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    toast(`Exported ${Vault.state.pages.length} pages`);
  };

  // Import
  const impBtn = $('#vaultImport');
  const impFile = $('#vaultImportFile');
  if (impBtn && impFile){
    impBtn.onclick = () => impFile.click();
    impFile.onchange = async () => {
      const file = impFile.files?.[0]; if (!file) return;
      const txt = await file.text();
      let parsed;
      try { parsed = JSON.parse(txt); } catch(e){ toast('Invalid JSON: ' + e.message.slice(0,80)); return; }
      if (!parsed.pages || !Array.isArray(parsed.pages)){ toast('Not a valid vault.json'); return; }
      const mode = confirm(`Import vault?\n\nIncoming: ${parsed.pages.length} pages, ${(parsed.sources||[]).length} sources.\nCurrent: ${Vault.state.pages.length} pages, ${Vault.state.sources.length} sources.\n\nOK = REPLACE current vault.\nCancel = MERGE (newer .updated wins).`);
      if (mode === null) return;
      if (mode){
        Vault.state = Vault.migrate(parsed);
      } else {
        Vault.state = GitHubSync._merge(parsed, Vault.state);
        Vault.state = Vault.migrate(Vault.state);
      }
      Vault.persist(); closeModal(); render();
      toast(mode ? 'Vault replaced' : 'Vault merged');
    };
  }

  // Revert last ingest
  const revBtn = $('#vaultRevert');
  if (revBtn && Vault.lastBatch()) revBtn.onclick = () => {
    const b = Vault.lastBatch();
    const msg = `Revert last ingest "${b.sourceTitle}"?\n\n• Delete ${b.created.length} created page${b.created.length===1?'':'s'} (only if not yet edited+promoted)\n• Strip "Mentioned in" lines from ${b.updated.length} updated page${b.updated.length===1?'':'s'}\n• Drop source record\n\nCascade delete also removes draft stubs spawned from each created page.`;
    if (!confirm(msg)) return;
    const r = Vault.revertBatch(b.id);
    if (!r.ok){ toast('Revert failed: ' + r.reason); return; }
    Vault.appendLog(LogEntry.create({ op:'revert', summary:`Reverted ingest "${b.sourceTitle}" — ${r.deleted} deleted, ${r.kept} kept (user-edited)` }));
    closeModal(); render();
    toast(`Reverted · ${r.deleted} deleted${r.kept?` · ${r.kept} kept`:''}`);
  };
}

function openCreatePageModal(prefillTitle=''){
  openModal({
    title:'New page',
    body:`
      <label>Title</label>
      <input id="npTitle" value="${escapeHtml(prefillTitle)}" />
      <label>Tags (comma-separated)</label>
      <input id="npTags" placeholder="risk, sizing" />
      <label>Body (markdown)</label>
      <textarea id="npBody">## Summary\n\n</textarea>
    `,
    actions:[
      { label:'Cancel', cb: closeModal },
      { label:'Create', primary:true, cb: () => {
        const title = $('#npTitle').value.trim();
        if (!title){ toast('Title required'); return; }
        if (Vault.getPageByTitle(title)){ toast('Page already exists'); return; }
        const tags = $('#npTags').value.split(',').map(s=>s.trim()).filter(Boolean);
        const md = `# ${title}\n\n${$('#npBody').value}`;
        const p = Page.create({ title, tags, md });
        Vault.putPage(p);
        Vault.appendLog(LogEntry.create({ op:'create', summary:`Created page [[${title}]]` }));
        Vault.state.ui.selectedPageId = p.id; Vault.state.ui.activeView='page'; Vault.persist();
        closeModal(); render(); toast('Created');
      }}
    ]
  });
  setTimeout(()=>$('#npTitle')?.focus(), 50);
}

/* ============================================================
   COMMAND PALETTE (⌘K / Ctrl-K)
============================================================ */
const Palette = {
  open(){ $('#paletteModal').classList.add('show'); $('#paletteInput').value=''; $('#paletteResults').innerHTML=''; setTimeout(()=>$('#paletteInput').focus(),20); this.selected=0; },
  close(){ $('#paletteModal').classList.remove('show'); },
  selected:0,
  update(q){
    const results = Vault.search(q);
    this.results = results;
    $('#paletteResults').innerHTML = results.map((r,i) => `
      <div class="palette-result ${i===0?'selected':''}" data-i="${i}">
        <span class="kind">${r.kind}</span>${escapeHtml(r.label)} <span style="color:var(--ink-3);margin-left:8px">${r.hint}</span>
      </div>
    `).join('') || `<div class="palette-result" style="cursor:default;color:var(--ink-3)">no matches</div>`;
    this.selected = 0;
    $$('.palette-result').forEach(el => el.onclick = () => this.pick(parseInt(el.dataset.i)));
  },
  pick(i){
    const r = this.results?.[i]; if (!r) return;
    if (r.kind==='page'){ Vault.state.ui.selectedPageId=r.id; Vault.state.ui.activeView='page'; }
    else if (r.kind==='source'){ const s=Vault.getSource(r.id); if (s?.url) window.open(s.url,'_blank'); }
    else if (r.kind==='tag'){ Vault.state.ui.activeTag=r.id; Vault.state.ui.activeView='tag'; }
    Vault.persist(); this.close(); render();
  }
};

/* ============================================================
   ROOT RENDER
============================================================ */
function render(){
  const view = Vault.state.ui.activeView || 'page';
  if (view !== 'graph') clearBigGraph();
  renderTree();
  (Views[view] || renderPageView)();
  renderRail();
  Vault.refreshStats();
}

/* ============================================================
   BOOT
============================================================ */
function boot(){
  Vault.init();
  GitHubSync.load();

  applyProvider();

  // If GitHub configured, attempt background pull on boot
  if (GitHubSync.configured()){
    GitHubSync.pull().then(remote => {
      if (remote){
        // Fresh device (no prior localStorage) → fully replace with remote
        // Returning device → merge by newer .updated wins
        const next = Vault._wasEmpty ? remote : GitHubSync._merge(remote, Vault.state);
        Vault.state = Vault.migrate(next);
        storage.save(Vault.state);
        render();
        toast(Vault._wasEmpty ? '✓ Loaded vault from GitHub' : '✓ Pulled + merged from GitHub');
      } else {
        // Empty repo — push our seed
        GitHubSync.push(Vault.state, 'initial vault commit').then(() => toast('✓ Initialized GitHub vault'));
      }
    }).catch(e => {
      console.warn('GitHub boot pull failed:', e.message);
      toast('GitHub: ' + e.message.slice(0,80));
    });
  }

  $('#opCapture').onclick = openCaptureModal;
  $('#opIngest').onclick = openIngestModal;
  $('#opQuery').onclick = openQueryModal;
  $('#opLint').onclick = runLint;
  $('#opSync').onclick = async () => {
    if (!GitHubSync.configured()){ toast('Configure GitHub in ⚙ Settings first'); openSettingsModal(); return; }
    // v5.1 — manual sync gate per Brief §Step 6: warn if pending review drafts exist
    const pendingReview = Vault.listIngestDrafts().filter(d => ['draft_ready','needs_review'].includes(d.status)).length;
    if (pendingReview > 0){
      if (!confirm(`${pendingReview} draft(s) still pending review. Sync anyway?\n\n(They stay in Review until committed — they will not be pushed until you commit them.)`)) return;
    }
    toast('Syncing with GitHub…');
    try {
      const r = await GitHubSync.manualSync();
      Vault.state.sync.last_synced_at = now();
      Vault.state.sync.last_synced_remote_sha = GitHubSync.sha;
      Vault.state.sync.sync_status = 'synced';
      Vault.persist();
      toast(r.pulled ? '✓ Pulled + pushed' : '✓ Initial commit pushed');
    } catch(e){
      Vault.state.sync.sync_status = 'failed';
      Vault.persist();
      toast('✗ ' + e.message.slice(0,100));
    }
  };
  $('#opSettings').onclick = openSettingsModal;

  $('#paletteTrigger').onclick = () => Palette.open();
  $('#paletteInput').oninput = (e) => Palette.update(e.target.value);
  $('#paletteInput').onkeydown = (e) => {
    if (e.key==='Escape') Palette.close();
    if (e.key==='Enter') Palette.pick(Palette.selected);
    if (e.key==='ArrowDown' || e.key==='ArrowUp'){
      e.preventDefault();
      const max = (Palette.results?.length || 1) - 1;
      Palette.selected = Math.max(0, Math.min(max, Palette.selected + (e.key==='ArrowDown'?1:-1)));
      $$('.palette-result').forEach((el,i)=>el.classList.toggle('selected', i===Palette.selected));
    }
  };

  document.addEventListener('keydown', (e) => {
    if ((e.metaKey||e.ctrlKey) && e.key==='k'){ e.preventDefault(); Palette.open(); }
    if (e.key==='Escape'){ closeModal(); Palette.close(); }
    if ((e.metaKey||e.ctrlKey) && e.key==='i'){ e.preventDefault(); openIngestModal(); }
    if ((e.metaKey||e.ctrlKey) && e.key==='/'){ e.preventDefault(); openQueryModal(); }
  });

  $('#modalBg').onclick = (e) => { if (e.target.id==='modalBg') closeModal(); };

  window.addEventListener('resize', () => { if (Vault.state.ui.activeView==='graph') render(); });

  render();

  // expose for debugging
  window.Vault = Vault; window.LinkResolver = LinkResolver; window.GraphProjection = GraphProjection; window.MockLLM = MockLLM;
}

boot();
</script>
