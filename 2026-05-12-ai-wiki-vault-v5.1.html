<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Wiki Vault v5.1 — Temp Inbox + Prepare + Review Gate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --bg:#0a0a0a; --bg-1:#0e0e0e; --bg-2:#131313; --bg-3:#181818;
    --line:rgba(255,255,255,.06); --line-2:rgba(255,255,255,.10); --line-3:rgba(255,255,255,.16);
    --ink:#ece9e2; --ink-2:#a8a59c; --ink-3:#67645c; --ink-4:#3e3c37;
    --rust:#d97757; --rust-soft:rgba(217,119,87,.14);
    --lime:#CCFF00; --lime-soft:rgba(204,255,0,.10);
    --mono:'IBM Plex Mono',ui-monospace,monospace; --sans:'IBM Plex Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
  ::selection{background:var(--rust);color:#000}
  *{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.10) transparent}
  *::-webkit-scrollbar{width:8px;height:8px}
  *::-webkit-scrollbar-track{background:transparent}
  *::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:4px;border:2px solid transparent;background-clip:padding-box}
  *::-webkit-scrollbar-thumb:hover{background:rgba(217,119,87,.35);background-clip:padding-box;border:2px solid transparent}
  *::-webkit-scrollbar-corner{background:transparent}
  .mono{font-family:var(--mono);letter-spacing:.01em}
  .micro{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  input,textarea{font:inherit;color:inherit;background:none;border:none;outline:none}

  #app{display:grid;grid-template-columns:240px 1fr 220px;grid-template-rows:48px 1fr 24px;height:100vh}

  /* topbar */
  .topbar{grid-column:1/-1;display:grid;grid-template-columns:240px 1fr auto;align-items:center;border-bottom:1px solid var(--line);background:var(--bg);z-index:50}
  .brand{display:flex;align-items:center;gap:10px;height:100%;padding:0 16px;border-right:1px solid var(--line)}
  .brand .glyph{width:22px;height:22px;border:1px solid var(--rust);color:var(--rust);display:grid;place-items:center;font-family:var(--mono);font-size:11px}
  .brand b{font-weight:600;letter-spacing:.02em}
  .brand .v{color:var(--ink-3);font-family:var(--mono);font-size:10px;margin-left:6px}

  .palette{display:flex;align-items:center;gap:10px;padding:0 14px}
  .palette input{flex:1;height:32px;padding:0 12px;border:1px solid var(--line-2);background:var(--bg-1);font-family:var(--mono);font-size:12px;color:var(--ink)}
  .palette input:focus{border-color:var(--rust)}
  .palette .kbd{font-family:var(--mono);font-size:10px;color:var(--ink-3);border:1px solid var(--line-2);padding:2px 6px}

  .ops{display:flex;align-items:center;gap:6px;padding:0 14px}
  .op{height:32px;padding:0 12px;border:1px solid var(--line-2);font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);transition:all .15s}
  .op:hover{border-color:var(--rust);color:var(--ink)}
  .op.primary{background:var(--rust);color:#000;border-color:var(--rust)}
  .op.primary:hover{background:#e88a6a}

  /* tree */
  .tree{border-right:1px solid var(--line);background:var(--bg-1);overflow-y:auto;padding:12px 0}
  .tree-section{padding:6px 14px;font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);display:flex;justify-content:space-between;align-items:center;margin-top:4px}
  .tree-section button{font-family:var(--mono);font-size:14px;color:var(--ink-3);width:18px;height:18px;line-height:1;border:1px solid var(--line-2)}
  .tree-section button:hover{color:var(--rust);border-color:var(--rust)}
  .tree-item{display:flex;align-items:center;gap:8px;padding:5px 14px 5px 18px;font-family:var(--mono);font-size:12px;color:var(--ink-2);cursor:pointer;border-left:2px solid transparent}
  .tree-item:hover{background:var(--bg-2);color:var(--ink)}
  .tree-item.active{background:var(--bg-2);color:var(--rust);border-left-color:var(--rust)}
  .tree-item .sub{color:var(--ink-3);font-size:10px;margin-left:auto}
  .tree-item.anchor{color:var(--lime)}
  .tree-empty{padding:8px 18px;color:var(--ink-3);font-family:var(--mono);font-size:11px;font-style:italic}

  /* main */
  .main{overflow:hidden;display:flex;flex-direction:column;background:var(--bg)}
  .main-header{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--ink-3)}
  .main-header .crumb b{color:var(--ink);font-weight:500}
  .main-header .actions{display:flex;gap:6px}
  .main-header .actions button{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;color:var(--ink-3);border:1px solid var(--line-2)}
  .main-header .actions button:hover{color:var(--rust);border-color:var(--rust)}
  .main-content{flex:1;overflow-y:auto;padding:32px 56px}

  /* markdown */
  .md{max-width:720px;font-size:14px;line-height:1.55;color:var(--ink)}
  .md h1{font-size:26px;font-weight:600;letter-spacing:-.01em;line-height:1.25;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--line-2)}
  .md h2{font-size:17px;font-weight:600;line-height:1.3;margin-top:24px;margin-bottom:8px;color:var(--ink)}
  .md h3{font-size:13px;font-weight:600;line-height:1.3;margin-top:16px;margin-bottom:6px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.08em;font-family:var(--mono)}
  .md p{margin-bottom:10px;line-height:1.55;color:var(--ink)}
  .md ul,.md ol{margin:6px 0 10px 20px}
  .md li{margin-bottom:3px;line-height:1.55}
  .md code{font-family:var(--mono);font-size:12px;background:var(--bg-2);padding:1px 6px;border:1px solid var(--line);color:var(--rust)}
  .md pre{font-family:var(--mono);font-size:12px;background:var(--bg-1);padding:14px;border:1px solid var(--line);overflow-x:auto;margin:12px 0}
  .md a.wikilink{color:var(--lime);text-decoration:none;border-bottom:1px dashed rgba(204,255,0,.4);cursor:pointer}
  .md a.wikilink:hover{border-bottom-style:solid}
  .md a.wikilink.broken{color:var(--ink-3);border-bottom-color:var(--ink-4)}
  .md blockquote{border-left:2px solid var(--rust);padding-left:14px;color:var(--ink-2);margin:12px 0;font-style:italic}

  /* editor textarea */
  .editor{width:100%;min-height:600px;background:var(--bg-1);border:1px solid var(--line-2);padding:18px;font-family:var(--mono);font-size:13px;line-height:1.7;color:var(--ink);resize:vertical}
  .editor:focus{border-color:var(--rust)}

  /* page meta strip */
  .meta{display:flex;gap:14px;flex-wrap:wrap;padding:10px 0 18px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--line);margin-bottom:18px}
  .meta b{color:var(--ink-2)}
  .meta .pill{padding:2px 8px;border:1px solid var(--line-2);color:var(--ink-2)}
  .meta .pill.draft{color:var(--rust);border-color:var(--rust)}
  .meta .pill.tag{color:var(--lime);border-color:rgba(204,255,0,.4);cursor:pointer}
  .meta .pill.tag:hover{background:var(--lime-soft)}
  /* v5 review-state pills (Brief §9) */
  .meta .pill.rs{font-size:9px;letter-spacing:.14em}
  .meta .pill.rs-raw{color:#9b8cf2;border-color:rgba(155,140,242,.4)}
  .meta .pill.rs-extracted{color:#ffb347;border-color:rgba(255,179,71,.4)}
  .meta .pill.rs-reviewed{color:#5fb8c9;border-color:rgba(95,184,201,.4)}
  .meta .pill.rs-promoted{color:var(--lime);border-color:rgba(204,255,0,.5)}
  .meta .pill.rs-deprecated{color:#7a7770;border-color:rgba(122,119,112,.5);text-decoration:line-through}
  .meta .pill.review-required{color:#e74c3c;border-color:#e74c3c;animation:rrPulse 2s ease-in-out infinite}
  @keyframes rrPulse{0%,100%{opacity:1}50%{opacity:.55}}
  .meta .pill.specialist{color:#7ee787;border-color:rgba(126,231,135,.4)}

  /* right rail */
  .rail{border-left:1px solid var(--line);background:var(--bg-1);overflow-y:auto;display:flex;flex-direction:column}
  .rail-block{padding:14px;border-bottom:1px solid var(--line)}
  .rail-block h4{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
  .rail-link{display:block;padding:4px 0;font-family:var(--mono);font-size:12px;color:var(--ink-2);cursor:pointer;border-bottom:1px solid transparent}
  .rail-link:hover{color:var(--rust)}
  .rail-empty{font-family:var(--mono);font-size:11px;color:var(--ink-3);font-style:italic}

  /* status bar */
  .statusbar{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 14px;border-top:1px solid var(--line);background:var(--bg-1);font-family:var(--mono);font-size:10px;color:var(--ink-3)}
  .statusbar .dot{width:6px;height:6px;border-radius:50%;background:var(--ink-3)}
  .statusbar .dot.ok{background:var(--lime)}
  .statusbar .dot.warn{background:var(--rust)}
  .statusbar .spacer{flex:1}

  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:100}
  .modal-bg.show{display:flex}
  .modal{background:var(--bg-1);border:1px solid var(--line-3);width:560px;max-width:90vw;max-height:80vh;display:flex;flex-direction:column}
  .modal h3{font-size:14px;padding:14px 18px;border-bottom:1px solid var(--line);font-weight:500}
  .modal-body{padding:18px;flex:1;overflow-y:auto}
  .modal-body label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:14px 0 6px}
  .modal-body label:first-child{margin-top:0}
  .modal-body input,.modal-body textarea{width:100%;padding:10px;border:1px solid var(--line-2);background:var(--bg);font-family:var(--mono);font-size:12px;color:var(--ink)}
  .modal-body textarea{min-height:140px;resize:vertical;line-height:1.6}
  .modal-body input:focus,.modal-body textarea:focus{border-color:var(--rust)}
  .modal-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
  .modal-foot button{padding:8px 14px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line-2);color:var(--ink-2)}
  .modal-foot button:hover{border-color:var(--rust);color:var(--ink)}
  .modal-foot button.primary{background:var(--rust);color:#000;border-color:var(--rust)}

  /* command palette */
  .palette-modal{position:fixed;top:80px;left:50%;transform:translateX(-50%);width:560px;max-width:90vw;background:var(--bg-1);border:1px solid var(--line-3);display:none;z-index:200}
  .palette-modal.show{display:block}
  .palette-modal input{width:100%;padding:14px 18px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:13px}
  .palette-results{max-height:400px;overflow-y:auto}
  .palette-result{padding:10px 18px;font-family:var(--mono);font-size:12px;color:var(--ink-2);cursor:pointer;border-bottom:1px solid var(--line)}
  .palette-result:hover,.palette-result.selected{background:var(--bg-2);color:var(--rust)}
  .palette-result .kind{color:var(--ink-3);font-size:10px;margin-right:8px}

  /* toast */
  .toast{position:fixed;bottom:48px;left:50%;transform:translateX(-50%);background:var(--bg-2);border:1px solid var(--rust);padding:10px 18px;font-family:var(--mono);font-size:12px;color:var(--ink);opacity:0;transition:opacity .3s;pointer-events:none;z-index:300}
  .toast.show{opacity:1}

  /* big graph view — v5: Obsidian-inspired aesthetic.
     Pure black canvas, rust-brown links, collapsible Groups/Filters/Colors/Display/Forces panel. */
  .graph-wrap{position:relative;width:100%;background:#000;overflow:hidden;border:1px solid var(--line)}
  .graph-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.012) 1px, transparent 1px),linear-gradient(90deg, rgba(255,255,255,.012) 1px, transparent 1px);background-size:48px 48px;pointer-events:none}
  #bigGraph{position:absolute;inset:0;width:100%;height:100%}
  .graph-overlay{position:absolute;top:18px;left:300px;z-index:10;pointer-events:none}
  .graph-overlay h2{font-family:var(--mono);font-size:11px;font-weight:400;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3)}
  .graph-overlay p{font-family:var(--sans);font-size:13px;color:var(--ink-2);margin-top:4px;max-width:380px}
  .graph-stats{position:absolute;bottom:18px;left:18px;display:flex;gap:18px;z-index:10;pointer-events:none}
  .gstat{font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase}
  .gstat b{color:var(--ink);font-size:14px;font-weight:500;display:block;margin-bottom:2px;letter-spacing:0;text-transform:none}
  .graph-controls{position:absolute;top:18px;right:18px;display:flex;flex-direction:column;gap:6px;z-index:10}
  .gctl{width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:var(--bg-2);border:1px solid var(--line);color:var(--ink-2);cursor:pointer;font-family:var(--mono);font-size:13px}
  .gctl:hover{border-color:var(--line-3);color:var(--ink)}

  /* Obsidian-style Graph view panel — top-left, collapsible sections */
  .gpanel{position:absolute;top:14px;left:14px;z-index:12;width:268px;background:rgba(14,14,14,.92);border:1px solid var(--line-2);font-family:var(--mono);backdrop-filter:blur(8px);max-height:calc(100% - 28px);overflow-y:auto}
  .gpanel-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);font-size:11px;color:var(--rust);letter-spacing:.18em;text-transform:uppercase}
  .gpanel-head .glyph{color:var(--rust)}
  .gpanel-head .ctrls{display:flex;gap:6px}
  .gpanel-head .ctrls button{font:inherit;color:var(--ink-3);font-size:12px;width:18px;height:18px;display:grid;place-items:center}
  .gpanel-head .ctrls button:hover{color:var(--rust)}
  .gsec{border-bottom:1px solid var(--line)}
  .gsec:last-child{border-bottom:none}
  .gsec-head{display:flex;align-items:center;gap:8px;padding:10px 14px;font-size:11px;font-weight:600;color:var(--ink-2);cursor:pointer;user-select:none;letter-spacing:.04em}
  .gsec-head:hover{color:var(--ink)}
  .gsec-head .caret{display:inline-block;width:10px;color:var(--ink-3);transition:transform .15s}
  .gsec.open .gsec-head .caret{transform:rotate(90deg)}
  .gsec-body{display:none;padding:6px 14px 12px;font-size:11px;color:var(--ink-2)}
  .gsec.open .gsec-body{display:block}
  .gsec-body .row{display:flex;align-items:center;gap:8px;padding:4px 0;color:var(--ink-2)}
  .gsec-body .row label{flex:1;cursor:pointer;font-size:11px;display:flex;align-items:center;gap:8px}
  .gsec-body .row .swatch{width:10px;height:10px;border-radius:50%;border:1px solid rgba(255,255,255,.15);flex-shrink:0}
  .gsec-body .row input[type=checkbox]{accent-color:var(--rust);cursor:pointer}
  .gsec-body .row input[type=color]{width:22px;height:18px;border:1px solid var(--line-2);background:none;cursor:pointer;padding:0}
  .gsec-body .row input[type=text]{flex:1;background:var(--bg);border:1px solid var(--line-2);padding:3px 6px;font-family:var(--mono);font-size:11px;color:var(--ink)}
  .gsec-body .row input[type=range]{flex:1;accent-color:var(--rust)}
  .gsec-body .row .num{color:var(--ink-3);font-size:10px;min-width:28px;text-align:right}
  .gsec-body .group-add{margin-top:8px;display:flex;gap:6px}
  .gsec-body .group-add input{flex:1;background:var(--bg);border:1px solid var(--line-2);padding:4px 6px;font-family:var(--mono);font-size:11px;color:var(--ink)}
  .gsec-body .group-add button{padding:4px 10px;border:1px solid var(--line-2);font-family:var(--mono);font-size:10px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em;cursor:pointer}
  .gsec-body .group-add button:hover{border-color:var(--rust);color:var(--rust)}
  .gsec-body .group-row{display:grid;grid-template-columns:18px 1fr 22px 18px;gap:6px;align-items:center;padding:3px 0}
  .gsec-body .group-row code{background:var(--bg);padding:1px 5px;border:1px solid var(--line);font-size:10px;color:var(--ink-2);font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gsec-body .group-row .x{font-size:14px;color:var(--ink-3);cursor:pointer;text-align:center}
  .gsec-body .group-row .x:hover{color:var(--rust)}
  .gsec-body .hint{font-size:10px;color:var(--ink-3);margin-top:6px;line-height:1.5;font-style:italic}

  /* ingest stages */
  .stages{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-bottom:16px;border:1px solid var(--line-2)}
  .stage{padding:9px 10px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);text-align:center;border-right:1px solid var(--line-2);background:var(--bg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stage:last-child{border-right:none}
  .stage.active{background:var(--rust);color:#000}
  .stage.done{color:var(--lime)}
  .src-tabs{display:flex;gap:4px;margin-bottom:10px}
  .src-tab{flex:1;min-width:0;padding:9px 8px;border:1px solid var(--line-2);font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);background:var(--bg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .src-tab.active{border-color:var(--rust);color:var(--rust);background:var(--rust-soft)}
  .src-tabs.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .src-tabs.grid-3 .src-tab{padding:10px 6px;font-size:10px;letter-spacing:.08em}

  /* settings form rhythm */
  .form-section{padding:14px 0;border-bottom:1px solid var(--line)}
  .form-section:last-child{border-bottom:none}
  .form-section:first-child{padding-top:0}
  .form-row{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center;margin-bottom:10px}
  .form-row:last-child{margin-bottom:0}
  .form-row > label{margin:0;font-size:10px}
  .form-row > input,.form-row > select{margin:0}
  .form-hint{font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-top:6px;line-height:1.6}
  .form-hint.lime{color:var(--lime)}
  .form-hint code{background:var(--bg-2);padding:1px 5px;border:1px solid var(--line);color:var(--rust)}
  .form-callout{font-family:var(--mono);font-size:11px;color:var(--ink-2);padding:10px 12px;background:var(--bg-2);border-left:2px solid var(--lime);margin-top:8px;line-height:1.6}
  .drop{border:1px dashed var(--line-3);padding:24px;text-align:center;font-family:var(--mono);font-size:12px;color:var(--ink-3);cursor:pointer;transition:all .15s}
  .drop:hover,.drop.drag{border-color:var(--rust);color:var(--ink);background:var(--rust-soft)}
  .fetched-meta{padding:10px;background:var(--bg-2);border-left:2px solid var(--lime);margin-bottom:12px;font-family:var(--mono);font-size:11px;color:var(--ink-2)}
  .fetched-meta b{color:var(--lime)}
  .spinner{display:inline-block;width:10px;height:10px;border:1.5px solid var(--ink-3);border-top-color:var(--rust);border-radius:50%;animation:spin .8s linear infinite;margin-right:8px;vertical-align:middle}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* v5.1 — Temp Inbox + Review cards */
  .inbox-bar{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
  .inbox-bar h2{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)}
  .inbox-bar .actions{display:flex;gap:6px}
  .inbox-bar .actions button{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border:1px solid var(--line-2);color:var(--ink-2);cursor:pointer}
