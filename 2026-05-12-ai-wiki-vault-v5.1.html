<script>
/* ============================================================
   AI WIKI VAULT v4
   Karpathy-method second brain. Flat vault. 3 ops. No silos.
   Architecture: Vault + Storage adapter + LLM adapter + LinkResolver
   + GraphProjection + view registry. See bottom of file for boot.
============================================================ */

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const escapeHtml = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,48);
const now = () => new Date().toISOString();
const today = () => new Date().toISOString().slice(0,10);
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2200); }

/* ============================================================
   DOMAIN TYPES
============================================================ */
const PAGE_TYPES = {
  // --- v4 maintained-page types (Karpathy ingest still writes these) ---
  concept:     { folder:'concepts',     glyph:'◇', label:'Concepts',     order: 1, layer:'wiki' },
  person:      { folder:'people',       glyph:'☻', label:'People',       order: 2, layer:'wiki' },
  source:      { folder:'sources',      glyph:'⌖', label:'Sources',      order: 3, layer:'raw'  },
  clip:        { folder:'clips',        glyph:'✂', label:'Clips',        order: 4, layer:'raw'  },
  synthesis:   { folder:'synthesis',    glyph:'⌬', label:'Synthesis',    order: 5, layer:'wiki' },
  note:        { folder:'notes',        glyph:'✎', label:'Notes',        order: 6, layer:'wiki' },
  anchor:      { folder:'anchors',      glyph:'▦', label:'Anchors',      order: 0, layer:'meta' },

  // --- v5 atomic layer (derived from raw/maintained) ---
  // Brief: AI_First_Second_Brain_Hybrid_Claude_Brief_2026-05-07.md §3.1, §7
  claim:       { folder:'atoms/claims',      glyph:'❝', label:'Claims',      order:10, layer:'atoms' },
  fact:        { folder:'atoms/facts',       glyph:'✓', label:'Facts',       order:11, layer:'atoms' },
  decision:    { folder:'atoms/decisions',   glyph:'⊞', label:'Decisions',   order:12, layer:'atoms' },
  hypothesis:  { folder:'atoms/hypotheses',  glyph:'?', label:'Hypotheses',  order:13, layer:'atoms' },
  question:    { folder:'atoms/questions',   glyph:'¿', label:'Questions',   order:14, layer:'atoms' },
  playbook:    { folder:'atoms/playbooks',   glyph:'▷', label:'Playbooks',   order:15, layer:'atoms' },
  entity:      { folder:'atoms/entities',    glyph:'◉', label:'Entities',    order:16, layer:'atoms' },

  // --- v5 specialist context-pack layer (generated agent working memory) ---
  // Brief §3.4, §10
  'context-pack': { folder:'contexts',  glyph:'▣', label:'Context Packs', order:20, layer:'contexts' }
};

// Brief §9 review-state model. Stored on Page.review_state.
const REVIEW_STATES = ['raw','extracted','reviewed','promoted','deprecated'];

// Brief §11 specialist domains. Used as context-pack folders + tag affinity.
const SPECIALIST_DOMAINS = ['ai-research','finance-trading','hermes-ops','business-product','personal'];

// Brief Workflow Rework §6 — finance content must be quarantined by default.
// Returns { isFinance, hits } so callers can tag review_required and flag in UI.
const FINANCE_KEYWORDS = [
  'earnings','sec ','price target','analyst rating','short squeeze','catalyst',
  'valuation','market cap','ipo','acquisition','merger','dividend','options chain',
  'call option','put option','stop loss','take profit','breakout','support level',
  'resistance level','rsi','macd','moving average','vwap','bollinger'
];
const TICKER_RE = /\$[A-Z]{1,5}\b|\b[A-Z]{2,5}\b(?=\s+(?:stock|shares|price|earnings|reported|announced))/g;
function detectFinance(text){
  if (!text) return { isFinance:false, hits:[], tickers:[] };
  const t = (' ' + text.toLowerCase() + ' ');
  const hits = FINANCE_KEYWORDS.filter(k => t.includes(k));
  const tickers = [...new Set((text.match(TICKER_RE) || []).map(s => s.replace(/^\$/,'')))].slice(0,10);
  return { isFinance: hits.length > 0 || tickers.length > 0, hits, tickers };
}
const CLIP_HOST_RE = /(twitter\.com|x\.com|threads\.net|linkedin\.com\/posts|mastodon|bsky\.app|reddit\.com\/r\/\w+\/comments)/i;
function detectKind(url){ return url && CLIP_HOST_RE.test(url) ? 'clip' : (url ? 'source' : 'note'); }
function clipHandle(url){
  // x.com/JLawStock/status/... → JLawStock
  const m = url && url.match(/(?:twitter\.com|x\.com)\/([^\/?#]+)/i);
  return m ? m[1] : '';
}

const Page = {
  // v5: review_state defaults per layer (Brief §9):
  //   raw layer    -> 'raw'
  //   wiki layer   -> 'reviewed' (human-maintained synthesis)
  //   atoms layer  -> 'extracted' (must be reviewed before promotion)
  //   contexts    -> 'reviewed'  (generated outputs, but reviewable)
  defaultReviewState(type){
    const layer = PAGE_TYPES[type]?.layer;
    if (layer === 'raw') return 'raw';
    if (layer === 'atoms') return 'extracted';
    return 'reviewed';
  },
  create({title, md='', tags=[], sources=[], type='concept', status='curated', review_state=null, specialist=null, confidence=null, review_required=false}){
    const id = slug(title) || `page-${Date.now()}`;
    const page = { id, title, type, tags, sources, status, md, updated: today() };
    page.review_state = review_state || this.defaultReviewState(type);
    if (specialist) page.specialist = specialist;        // ai-research | finance-trading | etc.
    if (confidence) page.confidence = confidence;        // low | medium | high
    if (review_required) page.review_required = true;
    // Auto-tag with current ingest batch (set by IngestFlow.commit)
    if (typeof Vault !== 'undefined' && Vault._currentBatchId) page.batch = Vault._currentBatchId;
    return page;
  }
};
const Source = {
  create({title, url='', raw='', summary='', type='note'}){
    const id = `src-${slug(title) || Date.now()}`;
    return { id, title, url, raw, summary, type, ingested: now() };
  }
};
const Draft = {
  create({kind, target=null, content='', reasoning=''}){
    return { id:`d-${Date.now()}-${Math.floor(Math.random()*1e4)}`, kind, target, content, reasoning, created: now() };
  }
};
const LogEntry = {
  create({op, summary}){ return { ts: now(), op, summary }; }
};

/* ============================================================
   v5.1 — Temp Inbox + Ingest Draft factories.
   State machine (Brief Workflow Rework §Required state model):
     captured -> normalized -> draft_ready -> needs_review -> approved
                 -> committed_local -> sync_pending -> synced
     (or archived | discarded | failed at any step)
============================================================ */
const TEMP_STATES = ['captured','normalized','draft_ready','archived','discarded','failed'];
const DRAFT_STATES = ['draft_ready','needs_review','approved','committed_local','archived','discarded','failed'];

function hashStr(s){
  // Cheap deterministic hash for dedupe (not crypto-strength).
  let h = 5381;
  for (let i=0;i<s.length;i++) h = ((h<<5)+h) + s.charCodeAt(i);
  return (h >>> 0).toString(36);
}

const TempItem = {
  // Brief §Step 1 — minimal fields at capture time. No summarization yet.
  create({raw_input='', user_note='', source_hint=''} = {}){
    const trimmed = (raw_input || '').trim();
    return {
      id: `t-${Date.now()}-${Math.floor(Math.random()*1e4)}`,
      raw_input: trimmed,
      input_hash: hashStr(trimmed),
      captured_at: now(),
      user_note,
      source_hint,                 // 'finance' | 'ai-research' | etc, optional
      status: 'captured',
      warnings: [],
      normalized_item_ids: []
    };
  }
};

const IngestDraft = {
  // Brief §Step 3 — draft packet. Reviewable, editable, not yet committed.
  create({temp_item_id=null, source_id=null, raw_input='', cleaned_title='', source_type='note', domain='', proposed_category='', short_summary='', key_claims=[], entities=[], tickers=[], dates=[], source_quality='unknown', confidence='medium', suggested_action='commit', review_required=false, reasons_review_required=[], provenance_snippets=[], proposed_vault_changes=null, cost_metadata=null, warnings=[], specialist=null, url=''} = {}){
    return {
      id: `idr-${Date.now()}-${Math.floor(Math.random()*1e4)}`,
      created_at: now(),
      status: 'draft_ready',
      temp_item_id, source_id, raw_input, url,
      cleaned_title, source_type, domain, proposed_category, short_summary,
      key_claims, entities, tickers, dates,
      source_quality, confidence,
      suggested_action,            // 'commit' | 'dated_source_only' | 'archive' | 'discard'
      review_required, reasons_review_required,
      provenance_snippets,
      proposed_vault_changes,      // null until prepared, then { newPageTitle, type, mdPreview }
      cost_metadata,
      warnings,
      specialist                   // 'finance-trading' | 'ai-research' | etc.
    };
  }
};

const IngestLogEntry = {
  create({draftId=null, tempId=null, op, from=null, to=null, detail=''}){
    return { ts: now(), draftId, tempId, op, from, to, detail };
  }
};

/* ============================================================
   STORAGE ADAPTER (seam — swap for GitHubAdapter later)
============================================================ */
const LocalStorageAdapter = {
  KEY: 'vault-v4',
  saveErrors: 0,
  load(){
    try { const raw = localStorage.getItem(this.KEY); return raw ? JSON.parse(raw) : null; }
    catch(e){
      console.error('localStorage load failed:', e);
      try { toast('⚠ Could not load vault — localStorage parse error'); } catch(_){}
      return null;
    }
  },
  save(state){
    try {
      localStorage.setItem(this.KEY, JSON.stringify(state));
      if (this.saveErrors){
        this.saveErrors = 0;
        try { toast('✓ localStorage save recovered'); } catch(_){}
      }
    } catch(e){
      this.saveErrors++;
      console.error('localStorage save failed:', e);
      // QuotaExceededError most common — vault too large for browser quota
      const reason = /quota|exceeded/i.test(e.message) ? 'quota exceeded — export + clear or move to GitHub sync' : e.message.slice(0,80);
      try { toast(`⚠ Save failed: ${reason}`); } catch(_){}
    }
  },
  status(){ return { connected:false, label:'local only', kind:'local' }; }
};

/* ============================================================
   GITHUB SYNC (Phase 3)
   localStorage stays primary. GitHub = sync layer on top.
   - Push debounced on every Vault.persist()
   - Pull on boot + manual ↻ button
   - Conflict policy: SHA-tracked. 409 → fetch fresh + merge by
     newer .updated wins (pages), union (sources/drafts/log)
   - Repo file: single vault.json blob at user-chosen path
============================================================ */
const GitHubSync = {
  KEY: 'vault-v4-github',
  config: {
    owner: '', repo: '', token: '', branch: 'main', path: 'vault.json'
  },
  sha: null,
  state: 'idle',          // idle | pulling | pushing | synced | offline | error
  lastError: null,
  _pushTimer: null,

  load(){
    try { const r = localStorage.getItem(this.KEY); if (r) Object.assign(this.config, JSON.parse(r)); } catch(e){}
    try { this.sha = localStorage.getItem(this.KEY + '-sha') || null; } catch(e){}
    return this.config;
  },
  save(){
    localStorage.setItem(this.KEY, JSON.stringify(this.config));
    if (this.sha) localStorage.setItem(this.KEY + '-sha', this.sha);
    else localStorage.removeItem(this.KEY + '-sha');
  },
  configured(){
    const c = this.config;
    return !!(c.owner && c.repo && c.token);
  },
  enabled(){ return this.configured(); },

  apiUrl(){
    const c = this.config;
    return `https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/${c.path.split('/').map(encodeURIComponent).join('/')}`;
  },
  headers(){
    return {
      'Authorization': `Bearer ${this.config.token}`,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
      'Content-Type': 'application/json'
    };
  },

  setState(s, err){
    this.state = s;
    this.lastError = err || null;
    Vault.refreshStats?.();
  },

  /* base64 helpers — UTF-8 safe */
  _b64encode(str){
    const bytes = new TextEncoder().encode(str);
    let bin = ''; bytes.forEach(b => bin += String.fromCharCode(b));
    return btoa(bin);
  },
  _b64decode(b64){
    const bin = atob(b64.replace(/\s/g, ''));
    const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
    return new TextDecoder().decode(bytes);
  },

  async pull(){
    if (!this.configured()) throw new Error('GitHub not configured');
    this.setState('pulling');
    const res = await fetch(`${this.apiUrl()}?ref=${encodeURIComponent(this.config.branch)}`, { headers: this.headers() });
    if (res.status === 404){
      // Empty repo or vault.json doesn't exist yet
      this.setState('synced');
      return null;
    }
    if (res.status === 401) throw new Error('GitHub 401: bad token (check repo scope)');
    if (!res.ok) throw new Error(`GitHub pull ${res.status}: ${(await res.text()).slice(0,200)}`);
    const data = await res.json();
    this.sha = data.sha;
    this.save();
    const json = this._b64decode(data.content);
    this.setState('synced');
    return JSON.parse(json);
  },

  async push(state, message){
    if (!this.configured()) throw new Error('GitHub not configured');
    this.setState('pushing');
    const json = JSON.stringify(state, null, 2);
    const content = this._b64encode(json);
    const body = { message: message || `vault sync ${new Date().toISOString().slice(0,16)}`, content, branch: this.config.branch };
    if (this.sha) body.sha = this.sha;
    const res = await fetch(this.apiUrl(), { method:'PUT', headers: this.headers(), body: JSON.stringify(body) });

    if (res.status === 409 || (res.status === 422 && this.sha)){
      // SHA stale — fetch + merge + retry once
      const remote = await this.pull();
      const merged = this._merge(remote, state);
      // Apply merged state back into Vault
      Vault.state = merged;
      try { storage.save(merged); } catch(e){}
      Vault.refreshStats?.();
      const json2 = JSON.stringify(merged, null, 2);
      const body2 = { message: (message || 'vault sync') + ' (merged)', content: this._b64encode(json2), sha: this.sha, branch: this.config.branch };
      const res2 = await fetch(this.apiUrl(), { method:'PUT', headers: this.headers(), body: JSON.stringify(body2) });
      if (!res2.ok){
        const t = await res2.text();
        throw new Error(`GitHub merge push ${res2.status}: ${t.slice(0,200)}`);
      }
      const d2 = await res2.json();
      this.sha = d2.content.sha;
      this.save();
      this.setState('synced');
      return merged;
    }
    if (res.status === 401) throw new Error('GitHub 401: bad token');
    if (!res.ok) throw new Error(`GitHub push ${res.status}: ${(await res.text()).slice(0,200)}`);
    const data = await res.json();
    this.sha = data.content.sha;
    this.save();
    this.setState('synced');
    return state;
  },

  _merge(remote, local){
    if (!remote) return local;
    const out = JSON.parse(JSON.stringify(remote));
    // pages — newer .updated wins
    const lMap = Object.fromEntries((local.pages||[]).map(p=>[p.id,p]));
    const rMap = Object.fromEntries((remote.pages||[]).map(p=>[p.id,p]));
    const ids = new Set([...Object.keys(lMap), ...Object.keys(rMap)]);
    out.pages = [...ids].map(id => {
      const lp = lMap[id], rp = rMap[id];
      if (!rp) return lp; if (!lp) return rp;
      return (lp.updated || '') > (rp.updated || '') ? lp : rp;
    });
    // sources — union by id
    const sMap = {};
    [...(remote.sources||[]), ...(local.sources||[])].forEach(s => sMap[s.id] = s);
    out.sources = Object.values(sMap);
    // drafts — union by id
    const dMap = {};
    [...(remote.drafts||[]), ...(local.drafts||[])].forEach(d => dMap[d.id] = d);
    out.drafts = Object.values(dMap);
    // log — union by ts+op, sorted
    const lkey = e => `${e.ts}::${e.op}`;
    const lgMap = {};
    [...(remote.log||[]), ...(local.log||[])].forEach(e => lgMap[lkey(e)] = e);
    out.log = Object.values(lgMap).sort((a,b)=>a.ts.localeCompare(b.ts));
    // ui — always local
    out.ui = local.ui;
    out.schemaVersion = Math.max(remote.schemaVersion||1, local.schemaVersion||1);
    return out;
  },

  schedulePush(){
    if (!this.configured()) return;
    clearTimeout(this._pushTimer);
    this._pushTimer = setTimeout(() => {
      this.push(Vault.state).catch(e => {
        console.warn('GitHub push failed:', e.message);
        this.setState('error', e.message);
      });
    }, 1800);
  },

  async manualSync(){
    if (!this.configured()){ throw new Error('GitHub not configured. Open Settings (⚙) → GitHub Sync.'); }
    const remote = await this.pull();
    if (!remote){
      // First-time push
      await this.push(Vault.state, 'initial vault commit');
      return { pulled:false, pushed:true };
    }
    const merged = this._merge(remote, Vault.state);
    Vault.state = merged;
    storage.save(merged);
    Vault.refreshStats?.();
    await this.push(merged, 'manual sync');
    render();
    return { pulled:true, pushed:true };
  },

  status(){
    if (!this.configured()) return { connected:false, label:'local only', kind:'local' };
    const owner = this.config.owner, repo = this.config.repo;
    const labels = {
      idle:    `github · ${owner}/${repo}`,
      pulling: `pulling…`,
      pushing: `pushing…`,
      synced:  `✓ synced · ${owner}/${repo}`,
      offline: `offline`,
      error:   `✗ ${this.lastError?.slice(0,40) || 'sync error'}`
    };
    return { connected: this.state==='synced' || this.state==='idle', label: labels[this.state] || labels.idle, kind:'github' };
  }
};

let storage = LocalStorageAdapter;

/* ============================================================
   VAULT MODULE — single seam over state
============================================================ */
const Vault = {
  state: null,

  init(){
    const loaded = storage.load();
    this._wasEmpty = !loaded;
    this.state = loaded ? this.migrate(loaded) : this.seed();
    this.persist();
  },

  migrate(s){
    if (!s.schemaVersion) s.schemaVersion = 1;
    s.pages ||= []; s.sources ||= []; s.drafts ||= []; s.log ||= [];
    s.batches ||= [];   // ingest batch records (for revert)
    s.ui ||= { selectedPageId:null, activeView:'page' };

    // --- v5 migration (schemaVersion 1 -> 2) ---
    if (s.schemaVersion < 2){
      s.pages.forEach(p => {
        if (!p.review_state) p.review_state = Page.defaultReviewState(p.type);
      });
      s.contextPacks ||= {};
      s.schemaVersion = 2;
    }
    // --- v5.1 migration (schemaVersion 2 -> 3) — Workflow Rework ---
    // Brief: AI_Wiki_Vault_Workflow_Rework_Claude_Instructions_2026-05-07.md §Required state model
    if (s.schemaVersion < 3){
      s.tempItems ||= [];        // Step 1: captured raw input (Brief §Step 1)
      s.ingestDrafts ||= [];     // Step 3: draft packets awaiting review (Brief §Step 3)
      s.ingestLog ||= [];        // append-only ingest history with state transitions
      s.backups ||= [];          // pre-commit snapshots (last 5)
      s.sync = s.sync || { last_synced_remote_sha:null, last_synced_at:null, sync_status:'unknown' };
      s.revision = s.revision || 0;
      s.device_id = s.device_id || ('dev-' + Math.random().toString(36).slice(2,10));
      s.schemaVersion = 3;
    }
    return s;
  },

  seed(){
    const pages = [
      Page.create({ title:'Welcome', type:'index', tags:['meta'], status:'curated',
        md: `# Welcome\n\nThis vault uses the Karpathy LLM-wiki method.\n\n## Three operations\n\n- **Ingest** — paste a URL or text. The LLM reads it, creates a Source page, drafts updates to related pages, and appends to [[log]].\n- **Query** — ask a question. The LLM reads relevant pages and answers with citations. Save useful answers as synthesis pages.\n- **Lint** — periodic audit for orphans, broken links, missing tags.\n\n## Anchor pages\n\n- [[index]] — auto-generated catalog of all pages\n- [[log]] — append-only ingest and query history\n\n## Try\n\n1. Click **⊕ Ingest** in the top bar. Paste any text. See drafts appear.\n2. Click **? Query**. Ask "what is in this vault?".\n3. Open [[Karpathy LLM Wiki]] to see the method.` }),
      Page.create({ title:'Karpathy LLM Wiki', type:'source', tags:['meta','method'], status:'curated',
        sources:['src-karpathy-gist'],
        md: `# Karpathy LLM Wiki\n\n## Summary\n\nA second-brain pattern where the wiki is a directory of LLM-generated markdown files. Knowledge is compiled once and kept current.\n\n## Three layers\n\n- **Raw sources** — immutable input (articles, PDFs, transcripts)\n- **Wiki** — markdown files: entity, concept, source, synthesis pages\n- **Schema** — config that drives the LLM (this vault uses frontmatter + an internal prompt)\n\n## Three operations\n\n- **Ingest** — read source, update 10–15 pages with summaries and cross-references\n- **Query** — answer questions with citations\n- **Lint** — audit for contradictions, orphans, gaps\n\n## Two anchors\n\n- [[index]] — catalog\n- [[log]] — chronological record\n\n## Why flat\n\nFolders force premature classification. Tags + wikilinks let the graph emerge.` }),
    ];
    const sources = [
      Source.create({ title:'Karpathy LLM-wiki gist', url:'https://gist.github.com/karpathy/442a6bf555914893e9891c11519de94f', type:'url', summary:'Three-layer LLM-maintained wiki pattern.' })
    ];
    return {
      schemaVersion: 3,
      revision: 0,
      device_id: 'dev-' + Math.random().toString(36).slice(2,10),
      pages, sources,
      drafts: [],
      batches: [],
      contextPacks: {},
      tempItems: [],
      ingestDrafts: [],
      ingestLog: [],
      backups: [],
      sync: { last_synced_remote_sha:null, last_synced_at:null, sync_status:'unknown' },
      log: [ LogEntry.create({ op:'init', summary:'Vault initialized (v5.1: Temp Inbox + Prepare + Review Gate enabled).' }) ],
      ui: { selectedPageId: pages[0].id, activeView:'page' }
    };
  },

  persist(){
    storage.save(this.state);
    this.refreshStats();
    // v5.1 — Brief §1: do not auto-sync after every ingest. Default to manual sync.
    // Legacy v4 behavior available by setting Settings.data.autoSync = true.
    if (GitHubSync.enabled() && Settings.data.autoSync === true) GitHubSync.schedulePush();
  },
  refreshStats(){
    const s = this.state;
    const sd = Settings.data;
    let label;
    if (sd.provider==='mock') label = '⌘ mock';
    else {
      const preset = PROVIDER_PRESETS[sd.provider];
      const m = (sd.model || '').split('/').pop().slice(0,28);
      label = `${preset?.label || sd.provider} · ${m}`;
    }
    $('#vaultStats').textContent = `${s.pages.length} pages · ${s.sources.length} sources · ${label}`;
    const gs = GitHubSync.enabled() ? GitHubSync.status() : storage.status();
    $('#syncLabel').textContent = gs.label;
    let cls = 'dot';
    if (gs.kind === 'github'){
      if (GitHubSync.state === 'synced' || GitHubSync.state === 'idle') cls += ' ok';
      else if (GitHubSync.state === 'error') cls += ' warn';
    } else {
      const llmReady = sd.provider!=='mock' && (sd.apiKey || sd.provider==='ollama');
      if (llmReady) cls += ' ok';
    }
    $('#syncDot').className = cls;
  },

  /* reads */
  listPages(){ return this.state.pages; },
  listSources(){ return this.state.sources; },
  listDrafts(){ return this.state.drafts; },
  listLog(){ return this.state.log; },
  getPage(id){ return this.state.pages.find(p=>p.id===id) || null; },
  getPageByTitle(title){ const t=title.toLowerCase().trim(); return this.state.pages.find(p=>p.title.toLowerCase()===t) || null; },
  getSource(id){ return this.state.sources.find(s=>s.id===id) || null; },
  allTags(){ const t=new Set(); this.state.pages.forEach(p=>p.tags.forEach(x=>t.add(x))); return [...t].sort(); },

  /* writes (single seam) */
  putPage(page){
    const i = this.state.pages.findIndex(p=>p.id===page.id);
    page.updated = today();
    if (i>=0) this.state.pages[i] = page; else this.state.pages.push(page);
    this.persist();
    return page;
  },
  deletePage(id){
    const page = this.getPage(id);
    if (!page){ return { removed: 1, cascadedStubs: 0 }; }
    const title = page.title;
    const titleRe = title.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const stubFromMe = new RegExp(`(Created from|First mention via)\\s*\\[\\[${titleRe}\\]\\]`);

    // Pass 1: collect stub pages created from this page (auto-cascade)
    const stubIds = new Set();
    this.state.pages.forEach(p => {
      if (p.id === id) return;
      if (p.status === 'draft' && stubFromMe.test(p.md || '')) stubIds.add(p.id);
    });

    // Pass 2: remove references on remaining pages
    const removedIds = new Set([id, ...stubIds]);
    const survivors = this.state.pages.filter(p => !removedIds.has(p.id));
    survivors.forEach(p => {
      const wikilinkRe = new RegExp(`\\[\\[${titleRe}\\]\\]`, 'g');
      const mentionLineRe = new RegExp(`^\\s*-\\s*\\[\\[${titleRe}\\]\\][^\\n]*\\n?`, 'gm');
      if (!wikilinkRe.test(p.md || '')) return;
      // Remove bullet lines listing the deleted page
      p.md = p.md.replace(mentionLineRe, '');
      // Degrade remaining wikilinks to plain text
      p.md = p.md.replace(new RegExp(`\\[\\[${titleRe}\\]\\]`, 'g'), title);
      // Drop empty "Mentioned in" / "Links" / "People" / "Concepts" sections
      p.md = p.md.replace(/##\s+(Mentioned in|Links|People|Concepts)\s*\n+(?=##|\s*$)/g, '');
    });

    this.state.pages = survivors;

    // Drop sources orphaned by deletion (source had only this page referencing it)
    const stillUsedSourceIds = new Set();
    this.state.pages.forEach(p => (p.sources || []).forEach(sid => stillUsedSourceIds.add(sid)));
    const removedSources = (page.sources || []).filter(sid => !stillUsedSourceIds.has(sid));
    if (removedSources.length){
      this.state.sources = this.state.sources.filter(s => !removedSources.includes(s.id));
    }

    if (removedIds.has(this.state.ui.selectedPageId)){
      this.state.ui.selectedPageId = this.state.pages[0]?.id || null;
    }
    this.persist();
    return { removed: 1, cascadedStubs: stubIds.size, removedSources: removedSources.length };
  },
  putSource(src){
    const i = this.state.sources.findIndex(s=>s.id===src.id);
    if (i>=0) this.state.sources[i] = src; else this.state.sources.push(src);
    this.persist();
    return src;
  },
  putDraft(d){ this.state.drafts.push(d); this.persist(); return d; },
  removeDraft(id){ this.state.drafts = this.state.drafts.filter(d=>d.id!==id); this.persist(); },
  appendLog(entry){ this.state.log.push(entry); this.persist(); },

  /* batch ingest records — for "revert last ingest" */
  recordBatch(b){ this.state.batches.push(b); this.persist(); return b; },
  listBatches(){ return [...this.state.batches].reverse(); },
  lastBatch(){ return this.state.batches[this.state.batches.length - 1] || null; },
  revertBatch(batchId){
    const b = this.state.batches.find(x => x.id === batchId);
    if (!b) return { ok:false, reason:'batch not found' };

    // Delete pages this batch created (skip if user has since edited & promoted them)
    const deleted = [];
    const kept = [];
    b.created.forEach(pid => {
      const p = this.getPage(pid);
      if (!p) return;
      if (p.batch === batchId){
        // Cascade delete handles reference cleanup in survivors
        this.deletePage(pid);
        deleted.push(pid);
      } else {
        kept.push(pid);
      }
    });

    // Strip "Mentioned in" lines this batch added to existing pages
    if (b.sourceTitle){
      const titleRe = b.sourceTitle.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const stamp = new RegExp(`^\\s*-\\s*\\[\\[${titleRe}\\]\\]\\s*_\\([^)]+\\)_\\s*\\n?`, 'gm');
      b.updated.forEach(pid => {
        const p = this.getPage(pid);
        if (!p) return;
        p.md = (p.md || '').replace(stamp, '');
        p.md = p.md.replace(/##\s+Mentioned in\s*\n+(?=##|\s*$)/g, '');
        this.putPage(p);
      });
    }

    // Drop the source record if no remaining page references it
    if (b.sourceId){
      const stillUsed = this.state.pages.some(p => (p.sources||[]).includes(b.sourceId));
      if (!stillUsed){
        this.state.sources = this.state.sources.filter(s => s.id !== b.sourceId);
      }
    }

    // Remove batch record
    this.state.batches = this.state.batches.filter(x => x.id !== batchId);
    this.persist();
    return { ok:true, deleted: deleted.length, kept: kept.length };
  },

  /* ----- v5.1: Temp Inbox + Ingest Draft accessors ----- */
  listTempItems(){ return this.state.tempItems || []; },
  listIngestDrafts(){ return this.state.ingestDrafts || []; },
  listIngestLog(){ return this.state.ingestLog || []; },
  getTempItem(id){ return (this.state.tempItems || []).find(t => t.id === id) || null; },
  getIngestDraft(id){ return (this.state.ingestDrafts || []).find(d => d.id === id) || null; },

  putTempItem(t){
    const list = this.state.tempItems;
    const dupe = list.find(x => x.input_hash === t.input_hash && x.status === 'captured');
    if (dupe){
      dupe.warnings = dupe.warnings || [];
      dupe.warnings.push('duplicate paste at ' + now());
      this.persist(); return dupe;
    }
    list.push(t); this.persist(); return t;
  },
  updateTempItem(id, patch){
    const t = this.getTempItem(id); if (!t) return null;
    Object.assign(t, patch); this.persist(); return t;
  },
  removeTempItem(id){
    this.state.tempItems = this.state.tempItems.filter(t => t.id !== id);
    this.persist();
  },

  putIngestDraft(d){
    // Multi-URL paste = multiple drafts per temp item, so dedupe ONLY on
    // exact (temp_item_id + url + raw_input prefix) match — not just temp_item_id.
    const list = this.state.ingestDrafts;
    const sig = `${d.temp_item_id}|${d.url}|${(d.raw_input||'').slice(0,40)}`;
    const dupe = list.find(x => `${x.temp_item_id}|${x.url}|${(x.raw_input||'').slice(0,40)}` === sig && x.status === 'draft_ready');
    if (dupe){ Object.assign(dupe, d); this.persist(); return dupe; }
    list.push(d); this.persist(); return d;
  },
  updateIngestDraft(id, patch){
    const d = this.getIngestDraft(id); if (!d) return null;
    Object.assign(d, patch); this.persist(); return d;
  },
  removeIngestDraft(id){
    this.state.ingestDrafts = this.state.ingestDrafts.filter(d => d.id !== id);
    this.persist();
  },
  appendIngestLog(entry){ this.state.ingestLog.push(entry); this.persist(); },

  /* ----- v5.1: backup snapshot for reversible commit (Brief §Step 5) ----- */
  snapshotBackup(reason){
    // Cap last 5 snapshots. Each snapshot stores pages + sources only (smallest payload).
    const snap = {
      id: `bk-${Date.now()}-${Math.floor(Math.random()*1e4)}`,
      ts: now(), reason,
      revision: this.state.revision || 0,
      pageCount: this.state.pages.length,
      sourceCount: this.state.sources.length,
      payload: JSON.stringify({ pages: this.state.pages, sources: this.state.sources, contextPacks: this.state.contextPacks })
    };
    this.state.backups.push(snap);
    if (this.state.backups.length > 5) this.state.backups.shift();
    return snap;
  },
  listBackups(){ return [...(this.state.backups || [])].reverse(); },
  restoreBackup(id){
    const b = (this.state.backups || []).find(x => x.id === id);
    if (!b) return { ok:false, reason:'backup not found' };
    try {
      const data = JSON.parse(b.payload);
      this.state.pages = data.pages || [];
      this.state.sources = data.sources || [];
      if (data.contextPacks) this.state.contextPacks = data.contextPacks;
      this.state.revision = (this.state.revision || 0) + 1;
      this.appendLog(LogEntry.create({ op:'restore', summary:`Restored backup ${b.id} (rev ${b.revision} → ${this.state.revision})` }));
      this.persist(); return { ok:true };
    } catch(e){ return { ok:false, reason: e.message }; }
  },
  bumpRevision(){ this.state.revision = (this.state.revision || 0) + 1; this.persist(); },

  /* search */
  search(query){
    const q = query.toLowerCase().trim();
    if (!q) return [];
    const results = [];
    this.state.pages.forEach(p => {
      const inTitle = p.title.toLowerCase().includes(q);
      const inBody = p.md.toLowerCase().includes(q);
      const inTags = p.tags.some(t=>t.toLowerCase().includes(q));
      if (inTitle || inBody || inTags) results.push({ kind:'page', id:p.id, label:p.title, hint: inTitle ? 'title' : inTags ? 'tag' : 'body' });
    });
    this.state.sources.forEach(s => {
      if (s.title.toLowerCase().includes(q)) results.push({ kind:'source', id:s.id, label:s.title, hint:'source' });
    });
    this.allTags().forEach(t => {
      if (t.includes(q)) results.push({ kind:'tag', id:t, label:`#${t}`, hint:'tag' });
    });
    return results.slice(0, 25);
  }
};

/* ============================================================
   LINK RESOLVER — derive links one place
============================================================ */
const LinkResolver = {
  // explicit [[Title]] links in body
  explicit(page){
    if (!page) return [];
    const ids = new Set();
    [...(page.md||'').matchAll(/\[\[([^\]]+?)\]\]/g)].forEach(m => {
      const target = Vault.getPageByTitle(m[1].trim());
      if (target && target.id !== page.id) ids.add(target.id);
    });
    return [...ids];
  },
  // pages that link TO this one
  backlinks(page){
    if (!page) return [];
    const me = page.title.toLowerCase();
    return Vault.listPages().filter(other => {
      if (other.id === page.id) return false;
      return [...(other.md||'').matchAll(/\[\[([^\]]+?)\]\]/g)].some(m => m[1].trim().toLowerCase() === me);
    }).map(p => p.id);
  },
  // shared-tag affinity
  tagPeers(page){
    if (!page || !page.tags.length) return [];
    const set = new Set(page.tags);
    return Vault.listPages()
      .filter(p => p.id !== page.id && p.tags.some(t => set.has(t)))
      .map(p => p.id);
  },
  // unified
  linksFor(page){
    return {
      explicit: this.explicit(page),
      backlinks: this.backlinks(page),
      tagPeers: this.tagPeers(page)
    };
  }
};

/* ============================================================
   GRAPH PROJECTION — pure: vault -> {nodes, edges}
============================================================ */
const GraphProjection = {
  fromVault(){
    const pages = Vault.listPages();
    const idSet = new Set(pages.map(p=>p.id));
    const edgeMap = new Map();
    const addEdge = (a,b,kind) => {
      if (a===b || !idSet.has(a) || !idSet.has(b)) return;
      const k = [a,b].sort().join('::');
      if (!edgeMap.has(k)) edgeMap.set(k, { source:a, target:b, kind });
    };
    pages.forEach(p => {
      LinkResolver.explicit(p).forEach(t => addEdge(p.id, t, 'wikilink'));
      LinkResolver.tagPeers(p).forEach(t => addEdge(p.id, t, 'tag'));
    });
    const degree = {};
    [...edgeMap.values()].forEach(e => { degree[e.source]=(degree[e.source]||0)+1; degree[e.target]=(degree[e.target]||0)+1; });
    const nodes = pages.map(p => ({
      id: p.id, label: p.title, tags: p.tags, type: p.type,
      r: 4 + Math.min(8, (degree[p.id]||0)*1.2)
    }));
    return { nodes, edges:[...edgeMap.values()] };
  }
};

/* ============================================================
   SOURCE FETCHER (seam — adapters per input mode)
   Returns: { title, text, url, type } or throws.
============================================================ */
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const SourceFetcher = {
  // Jina Reader: free, no auth, CORS-friendly. Returns clean markdown for any URL.
  async fromUrl(url){
    if (!/^https?:\/\//i.test(url)) throw new Error('URL must start with http(s)://');
    const reader = `https://r.jina.ai/${url}`;
    const res = await fetch(reader, { headers: { 'Accept':'text/markdown' } });
    if (!res.ok) throw new Error(`Reader failed: ${res.status}`);
    const md = await res.text();
    // Jina returns header block: "Title:", "URL Source:", "Markdown Content:"
    const titleMatch = md.match(/^Title:\s*(.+)$/m);
    const contentMatch = md.match(/Markdown Content:\s*\n([\s\S]+)$/);
    const title = titleMatch ? titleMatch[1].trim() : url;
    const text = contentMatch ? contentMatch[1].trim() : md;
    return { title, text, url, type:'url' };
  },

  async fromPdf(file){
    if (!window.pdfjsLib) throw new Error('PDF.js not loaded');
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    const parts = [];
    for (let i=1; i<=pdf.numPages; i++){
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      parts.push(content.items.map(it => it.str).join(' '));
    }
    return {
      title: file.name.replace(/\.pdf$/i,''),
      text: parts.join('\n\n'),
      url: '',
      type: 'pdf',
      meta: { pages: pdf.numPages, sizeKb: Math.round(file.size/1024) }
    };
  },

  fromText(text, title=''){
    const t = title || (text.split('\n').find(l=>l.trim()) || 'Pasted note').slice(0,80);
    return { title: t, text, url:'', type:'note' };
  }
};

/* ============================================================
   v5.1 — INGEST PIPELINE (Brief Workflow Rework)
   Replaces the v4 single-shot Ingest modal with a staged flow:
     capture (Temp Inbox) -> normalize (Prepare) -> draft -> review gate
     -> commit local (with backup) -> manual sync to GitHub.
   The legacy IngestFlow modal still exists for single-source quick path.
============================================================ */
const URL_RE = /https?:\/\/[^\s)>\]]+/g;

function canonicalizeUrl(u){
  try {
    const url = new URL(u);
    // Strip common tracking params
    ['utm_source','utm_medium','utm_campaign','utm_term','utm_content','fbclid','gclid','mc_cid','mc_eid','ref','ref_src','si','t']
      .forEach(p => url.searchParams.delete(p));
    url.hash = '';
    return url.toString().replace(/\/$/,'');
  } catch(_){ return u.trim(); }
}

const IngestPipeline = {
  /* ---------- Step 1: Capture ---------- */
  capture(rawInput, opts={}){
    const t = TempItem.create({ raw_input: rawInput, user_note: opts.note || '', source_hint: opts.hint || '' });
    const stored = Vault.putTempItem(t);
    Vault.appendIngestLog(IngestLogEntry.create({ tempId: stored.id, op:'capture', to:'captured', detail:`hash=${stored.input_hash}` }));
    return stored;
  },

  /* ---------- Step 2: Normalize ----------
     Deterministic, no LLM. Splits multi-URL paste into separate items.
     Detects finance/tickers, computes hash for dedupe, classifies source type. */
  normalize(tempItemId){
    const t = Vault.getTempItem(tempItemId);
    if (!t) return { ok:false, reason:'temp item not found' };
    if (t.status !== 'captured') return { ok:false, reason:`already ${t.status}` };

    const raw = t.raw_input || '';
    const urls = [...new Set((raw.match(URL_RE) || []).map(canonicalizeUrl))];
    const items = [];

    if (urls.length === 0){
      // Pure text paste — single item
      items.push({ kind:'text', text: raw, url:'' });
    } else if (urls.length === 1 && raw.replace(URL_RE,'').trim().length > 80){
      // Single URL with substantial accompanying text — keep as one item with both
      items.push({ kind:'note+url', text: raw, url: urls[0] });
    } else {
      // Multi-URL paste — one item per URL, accompanying text duplicated as user_note
      const note = raw.replace(URL_RE,'').trim();
      urls.forEach(u => items.push({ kind:'url', text: note, url: u }));
    }

    // Build one IngestDraft per normalized item
    const drafts = items.map(it => {
      const fin = detectFinance(it.text + ' ' + it.url);
      const finReasons = [];
      if (fin.hits.length) finReasons.push(`finance keywords: ${fin.hits.slice(0,3).join(', ')}`);
      if (fin.tickers.length) finReasons.push(`tickers detected: ${fin.tickers.join(', ')}`);

      const kind = it.url ? detectKind(it.url) : 'note';
      const titleGuess = it.url
        ? (it.url.replace(/^https?:\/\//,'').slice(0, 80))
        : (it.text.split('\n').find(l => l.trim()) || 'Untitled paste').slice(0, 80);

      const warnings = [];
      if (it.text.length < 40 && !it.url) warnings.push('very short paste — low extraction confidence');
      if (urls.length > 5) warnings.push(`large multi-URL paste (${urls.length} urls)`);

      const draft = IngestDraft.create({
        temp_item_id: t.id,
        raw_input: it.text,
        url: it.url,
        cleaned_title: titleGuess,
        source_type: kind,
        domain: it.url ? (new URL(it.url).hostname) : '',
        proposed_category: fin.isFinance ? 'finance-trading' : (t.source_hint || ''),
        short_summary: it.text.split(/[.!?]\s/).slice(0,2).join('. ').slice(0,240),
        tickers: fin.tickers,
        review_required: fin.isFinance,
        reasons_review_required: finReasons,
        suggested_action: fin.isFinance ? 'dated_source_only' : 'commit',
        specialist: fin.isFinance ? 'finance-trading' : null,
        warnings
      });
      Vault.putIngestDraft(draft);
      Vault.appendIngestLog(IngestLogEntry.create({ tempId: t.id, draftId: draft.id, op:'normalize', from:'captured', to:'draft_ready', detail:`${kind}${draft.review_required?' [REVIEW]':''}` }));
      return draft;
    });

    Vault.updateTempItem(t.id, { status:'normalized', normalized_item_ids: drafts.map(d => d.id) });
    return { ok:true, drafts };
  },

  /* ---------- Step 3: Prepare (deeper LLM enrichment, optional) ----------
     For now, this just re-runs normalize. Wired to LLM later. */
  prepare(draftId){
    const d = Vault.getIngestDraft(draftId);
    if (!d) return { ok:false, reason:'draft not found' };
    Vault.updateIngestDraft(d.id, { status:'needs_review' });
    Vault.appendIngestLog(IngestLogEntry.create({ draftId: d.id, op:'prepare', from:'draft_ready', to:'needs_review' }));
    return { ok:true, draft: d };
  },

  /* ---------- Step 4-5: Commit approved draft to vault ----------
     Brief §Step 5 — backup snapshot before mutation. */
  async commit(draftId, action='commit'){
    const d = Vault.getIngestDraft(draftId);
    if (!d) return { ok:false, reason:'draft not found' };

    Vault.snapshotBackup(`pre-commit ${draftId}`);

    const batchId = `b-${Date.now()}-${Math.floor(Math.random()*1e4)}`;
    Vault._currentBatchId = batchId;

    try {
      let result;
      if (action === 'dated_source_only'){
        // Just write a dated source page, no concept/person extraction
        const title = `${today()} ${d.cleaned_title}`.slice(0, 90);
        const source = Source.create({ title, url: d.url, raw: d.raw_input, type: d.url ? 'url':'note', summary: d.short_summary });
        Vault.putSource(source);
        const page = Page.create({
          title, type: d.source_type || 'source', tags: d.specialist ? [d.specialist] : [],
          sources:[source.id], status:'curated',
          review_state: 'reviewed',
          specialist: d.specialist,
          review_required: d.review_required,
          md: `# ${title}\n\n## Summary\n\n${d.short_summary || '_(no summary)_'}\n\n## Source\n\n${d.url ? `<${d.url}>` : '_(pasted text)_'}\n\n## Body\n\n${d.raw_input || '_(empty)_'}\n\n## Provenance\n\n- captured: ${d.created_at}\n- draft id: ${d.id}\n${d.tickers.length ? `- tickers: ${d.tickers.join(', ')}\n`:''}${d.reasons_review_required?.length ? `- review required: ${d.reasons_review_required.join('; ')}\n`:''}`
        });
        Vault.putPage(page);
        result = { sourcePage: page, source };
      } else {
        // Full Karpathy ingest via existing LLM module — produces concepts + people stubs too
        result = await llm.ingest({ title: d.cleaned_title, text: d.raw_input, url: d.url });
        // Stamp specialist + review_required on the produced source page
        if (result.sourcePage){
          const sp = Vault.getPage(result.sourcePage.id);
          if (sp){
            if (d.specialist) sp.specialist = d.specialist;
            if (d.review_required) sp.review_required = true;
            Vault.putPage(sp);
          }
        }
      }

      Vault._currentBatchId = null;

      // State transitions
      Vault.updateIngestDraft(d.id, { status:'committed_local' });
      const t = Vault.getTempItem(d.temp_item_id);
      if (t){
        const allDrafts = (t.normalized_item_ids || []).map(id => Vault.getIngestDraft(id)).filter(Boolean);
        const allDone = allDrafts.every(x => ['committed_local','archived','discarded'].includes(x.status));
        if (allDone) Vault.updateTempItem(t.id, { status: 'archived' });
      }
      Vault.bumpRevision();
      Vault.appendIngestLog(IngestLogEntry.create({ draftId: d.id, op:'commit', from:'needs_review', to:'committed_local', detail: action }));
      Vault.appendLog(LogEntry.create({ op:'ingest', summary: `Committed [[${result.sourcePage?.title || d.cleaned_title}]]${d.review_required?' (review required)':''} via ${action}` }));
      // Mark sync_pending — manual button required
      Vault.state.sync.sync_status = 'pending';
      Vault.persist();
      return { ok:true, result };
    } catch(e){
      Vault.updateIngestDraft(d.id, { status:'failed', warnings:[...(d.warnings||[]), 'commit failed: ' + e.message] });
      Vault.appendIngestLog(IngestLogEntry.create({ draftId: d.id, op:'commit_error', detail: e.message }));
      return { ok:false, reason: e.message };
    }
  },

  archiveDraft(id){
    const d = Vault.getIngestDraft(id); if (!d) return;
    Vault.updateIngestDraft(id, { status:'archived' });
    Vault.appendIngestLog(IngestLogEntry.create({ draftId: id, op:'archive', from: d.status, to:'archived' }));
  },
  discardDraft(id){
    const d = Vault.getIngestDraft(id); if (!d) return;
    Vault.updateIngestDraft(id, { status:'discarded' });
    Vault.appendIngestLog(IngestLogEntry.create({ draftId: id, op:'discard', from: d.status, to:'discarded' }));
  }
};

/* ============================================================
   INGEST FLOW — state machine. View subscribes; renders by stage.
   States: idle -> fetching -> preview -> committing -> done | error
============================================================ */
const IngestFlow = {
  stage: 'idle',          // idle | fetching | preview | committing | done | error
  mode: 'url',            // url | pdf | text
  fetched: null,          // {title, text, url, type, meta?}
  edits: { title:'', text:'', url:'' },
  error: null,
  drafts: [],
  source: null,
  reset(){
    this.stage='idle'; this.mode='url'; this.fetched=null;
    this.edits={title:'',text:'',url:''}; this.error=null; this.drafts=[]; this.source=null;
  },
  setMode(m){ this.mode=m; this.stage='idle'; this.error=null; renderIngestModal(); },
  async fetchUrl(url){
    this.stage='fetching'; this.error=null; renderIngestModal();
    try {
      this.fetched = await SourceFetcher.fromUrl(url);
      this.edits = { title:this.fetched.title, text:this.fetched.text, url:this.fetched.url };
      this.stage='preview'; renderIngestModal();
    } catch(e){ this.error = e.message; this.stage='error'; renderIngestModal(); }
  },
  async loadPdf(file){
    this.stage='fetching'; this.error=null; renderIngestModal();
    try {
      this.fetched = await SourceFetcher.fromPdf(file);
      this.edits = { title:this.fetched.title, text:this.fetched.text, url:'' };
      this.stage='preview'; renderIngestModal();
    } catch(e){ this.error = e.message; this.stage='error'; renderIngestModal(); }
  },
  loadText(text, title){
    this.fetched = SourceFetcher.fromText(text, title);
    this.edits = { title:this.fetched.title, text:this.fetched.text, url:'' };
    this.stage='preview'; renderIngestModal();
  },
  async commit(){
    this.stage='committing'; renderIngestModal();
    const { title, text, url } = this.edits;
    try {
      // Tag every page touched by this ingest with the same batch id for rollback
      const batchId = `b-${Date.now()}-${Math.floor(Math.random()*1e4)}`;
      Vault._currentBatchId = batchId;
      const result = await llm.ingest({ title, text, url });
      Vault._currentBatchId = null;

      const cs = result.conceptStubs?.length || 0;
      const ps = result.personStubs?.length || 0;
      const lp = result.linkedPages?.length || 0;
      const parts = [];
      if (cs) parts.push(`${cs} concept stub${cs===1?'':'s'}`);
      if (ps) parts.push(`${ps} person stub${ps===1?'':'s'}`);
      if (lp) parts.push(`linked ${lp} existing`);

      // Record batch metadata for revert
      const created = [
        result.sourcePage?.id,
        ...(result.conceptStubs||[]).map(p=>p.id),
        ...(result.personStubs||[]).map(p=>p.id)
      ].filter(Boolean);
      const updated = (result.linkedPages || []).map(p => p.id);
      Vault.recordBatch({
        id: batchId,
        ts: now(),
        op: 'ingest',
        sourceId: result.source?.id,
        sourceTitle: result.sourcePage?.title,
        provider: Settings.data.provider,
        created,
        updated
      });

      Vault.appendLog(LogEntry.create({
        op:'ingest',
        summary: `${result.sourcePage.title} (${result.sourcePage.type}) [${Settings.data.provider}]${parts.length?' · '+parts.join(' · '):''} {${batchId.slice(2,10)}}`
      }));
      this.source = result.source; this.sourcePage = result.sourcePage;
      this.linkedPages = result.linkedPages || [];
      this.conceptStubs = result.conceptStubs || [];
      this.personStubs = result.personStubs || [];
      this.batchId = batchId;
      this.stage='done'; renderIngestModal();
      Vault.state.ui.selectedPageId = result.sourcePage.id;
      Vault.state.ui.activeView = 'page';
      Vault.persist(); render();
    } catch(e){
      this.error = e.message; this.stage='error'; renderIngestModal();
      toast('Ingest failed: ' + e.message.slice(0,80));
    }
  }
};

/* ============================================================
   LLM ADAPTER (seam — Mock now, Anthropic/Agent later)
============================================================ */
const MockLLM = {
  async ingest({title, text, url}){
    // Karpathy method: AI writes direct, multiple pages per ingest:
    // source/clip page + concept stubs + person stubs + auto-links to existing.
    const kind = detectKind(url);
    const handle = clipHandle(url);

    // Title shape: clips get date-prefixed handle name
    const fallbackTitle = (text.split('\n').find(l=>l.trim()) || 'Untitled').slice(0,80);
    let cleanTitle = title || fallbackTitle;
    if (kind==='clip' && handle){
      cleanTitle = `${today()} ${handle}` + (title ? ` — ${title}`.slice(0,60) : '');
    }

    const summary = text.split(/[.!?]\s/).slice(0,2).join('. ').slice(0,240);
    const tags = (text.toLowerCase().match(/\b(risk|design|trading|fitness|ai|agent|wiki|knowledge|note|idea|method|swing|breakout|pullback|short|long)\b/g) || [])
      .filter((v,i,a)=>a.indexOf(v)===i).slice(0,4);
    if (kind==='clip') tags.unshift('clip');

    // Extract people: @handles + URL handle ONLY. Real LLM handles the rest.
    // Capitalized "First Last" regex was producing UI-label false positives.
    const peopleSet = new Set();
    [...text.matchAll(/@([A-Za-z0-9_]{3,20})/g)].forEach(m => peopleSet.add(m[1]));
    if (handle) peopleSet.add(handle);
    const people = [...peopleSet].slice(0,4);

    // Extract concepts: multi-word Title Case phrases only.
    // Rejects sentence-start words ("Before", "Here") + UI labels ("Privacy Policy", "Cookie Use").
    const SENTENCE_START_STOPS = new Set(['The','This','That','These','Those','And','But','For','With','From','Before','After','Here','There','Now','Then','When','Where','Why','How','What','Who','Which','While','Once','Most','Some','Many','Few','All','None','Any','Each','Every','Both','Either','Neither','Other','Such','Same','New','Old','Good','Bad','First','Last','Next','Previous']);
    const UI_NOISE = new Set(['Privacy Policy','Cookie Use','Cookie Policy','Terms of Service','Terms of Use','Sign In','Sign Up','Sign Out','Log In','Log Out','Post See','Click Here','Read More','Learn More','Get Started','See More','Show More','Show Less','Page Not Found']);
    // Only match 2-3 word Title Case spans (single words = too noisy in MockLLM)
    const conceptSet = new Set();
    [...text.matchAll(/\b([A-Z][a-z]+(?:\s+[A-Z][a-z]+){1,3})\b/g)].forEach(m => {
      const phrase = m[1];
      const firstWord = phrase.split(' ')[0];
      if (SENTENCE_START_STOPS.has(firstWord)) return;
      if (UI_NOISE.has(phrase)) return;
      if (peopleSet.has(phrase) || peopleSet.has(firstWord)) return;
      conceptSet.add(phrase);
    });
    const concepts = [...conceptSet].filter(c => c.length>=8 && c.length<60).slice(0,6);

    // Existing pages mentioned in text → auto-wikilink first occurrence
    const linked = [];
    let bodyText = text;
    Vault.listPages().forEach(p => {
      if (linked.find(x=>x.id===p.id)) return;
      const esc = p.title.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const re = new RegExp(`\\b(${esc})\\b`, 'i');
      if (re.test(bodyText)){
        linked.push(p);
        bodyText = bodyText.replace(re, `[[$1]]`);
      }
    });

    // 1. Source record
    const source = Source.create({ title: cleanTitle, url, raw: text, type: url?'url':'note', summary });
    Vault.putSource(source);

    // 2. Source / clip page
    const sourcePage = Page.create({
      title: cleanTitle, type: kind, tags, sources:[source.id], status:'curated',
      md: `# ${cleanTitle}\n\n## Summary\n\n${summary || '_(no summary)_'}\n\n## Source\n\n${url ? `<${url}>` : '_(pasted text)_'}\n\n## Body\n\n${bodyText}\n${
        people.length ? `\n## People\n\n${people.map(p=>`- [[${p}]]`).join('\n')}\n` : ''
      }${
        concepts.length ? `\n## Concepts\n\n${concepts.map(c=>`- [[${c}]]`).join('\n')}\n` : ''
      }${
        linked.length ? `\n## Links\n\n${linked.map(p=>`- [[${p.title}]]`).join('\n')}\n` : ''
      }`
    });
    Vault.putPage(sourcePage);

    // 3. Concept stubs (skip if already exists)
    const conceptStubs = [];
    concepts.forEach(c => {
      if (Vault.getPageByTitle(c)) return;
      const stub = Page.create({
        title: c, type:'concept', tags:[tags[0]||'concept'].filter(Boolean), status:'draft',
        md: `# ${c}\n\n## Summary\n\n_Stub. Created from [[${cleanTitle}]] on ${today()}._\n\n## Mentioned in\n\n- [[${cleanTitle}]]\n`
      });
      Vault.putPage(stub);
      conceptStubs.push(stub);
    });

    // 4. Person stubs (skip if exists)
    const personStubs = [];
    people.forEach(p => {
      if (Vault.getPageByTitle(p)) return;
      const stub = Page.create({
        title: p, type:'person', tags:['person'], status:'draft',
        md: `# ${p}\n\n## Summary\n\n_Stub. First mention via [[${cleanTitle}]] on ${today()}._\n\n## Mentioned in\n\n- [[${cleanTitle}]]\n`
      });
      Vault.putPage(stub);
      personStubs.push(stub);
    });

    // 5. Append "Mentioned in" to existing linked pages
    linked.forEach(p => {
      const stamp = `- [[${cleanTitle}]] _(${today()})_`;
      if (/## Mentioned in/i.test(p.md)){
        p.md = p.md.replace(/(## Mentioned in\s*\n)([\s\S]*?)(\n##|\n*$)/i, (m, h, body, tail) => `${h}${body}${stamp}\n${tail}`);
      } else {
        p.md += `\n\n## Mentioned in\n\n${stamp}\n`;
      }
      Vault.putPage(p);
    });

    return { source, sourcePage, linkedPages: linked, conceptStubs, personStubs, tags };
  },

  async query(question){
    const q = question.toLowerCase();
    const hits = Vault.listPages().filter(p => {
      const hay = (p.title + ' ' + p.md + ' ' + p.tags.join(' ')).toLowerCase();
      return q.split(/\s+/).filter(t=>t.length>2).some(t => hay.includes(t));
    }).slice(0,6);
    if (!hits.length) return { answer: '_No matching pages found in vault. Try ingesting more sources._', citations: [] };
    const snippets = hits.map(p => `**[[${p.title}]]** — ${(p.md.match(/## Summary\s*\n+([^\n#]+)/) || [,p.md.slice(0,160)])[1].trim()}`);
    const answer = `Based on ${hits.length} page(s) in the vault:\n\n${snippets.join('\n\n')}\n\n_(Mock LLM — wire a real provider for synthesis.)_`;
    return { answer, citations: hits.map(p => ({ id: p.id, title: p.title })) };
  },

  async lint(){
    const issues = [];
    const pages = Vault.listPages();
    pages.forEach(p => {
      // broken wikilinks
      [...(p.md||'').matchAll(/\[\[([^\]]+?)\]\]/g)].forEach(m => {
        const t = m[1].trim();
        if (!Vault.getPageByTitle(t) && !['index','log'].includes(t.toLowerCase())) {
          issues.push({ kind:'broken-link', page: p.id, detail: `[[${t}]]` });
        }
      });
      // orphan: no inbound, no tags
      if (LinkResolver.backlinks(p).length===0 && p.tags.length===0 && p.id !== 'welcome') {
        issues.push({ kind:'orphan', page: p.id, detail: 'no backlinks, no tags' });
      }
      // missing summary
      if (!/##\s+Summary/i.test(p.md||'')) {
        issues.push({ kind:'missing-summary', page: p.id, detail: 'no ## Summary section' });
      }
    });
    return issues;
  }
};
/* ============================================================
   LLM ADAPTERS (Phase 2)
   Single LLM module routes to provider transport based on settings.
   Supports OpenAI-compatible endpoints (OpenAI, OpenRouter, Ollama,
   any /v1/chat/completions service) plus Anthropic native shape.
   Personal-use only — key sits in localStorage, exposed to page.
============================================================ */
const PROVIDER_PRESETS = {
  openai:     { label:'OpenAI',     baseUrl:'https://api.openai.com/v1',         shape:'openai',    needsKey:true,  defaultModel:'gpt-4o-mini', modelHint:'gpt-4o-mini, gpt-4o, o1-mini' },
  openrouter: { label:'OpenRouter', baseUrl:'https://openrouter.ai/api/v1',      shape:'openai',    needsKey:true,  defaultModel:'nousresearch/hermes-3-llama-3.1-405b', modelHint:'nousresearch/hermes-3-llama-3.1-405b, anthropic/claude-sonnet-4.5, openai/gpt-4o-mini, meta-llama/llama-3.3-70b-instruct' },
  anthropic:  { label:'Anthropic',  baseUrl:'https://api.anthropic.com/v1',      shape:'anthropic', needsKey:true,  defaultModel:'claude-sonnet-4-6', modelHint:'claude-sonnet-4-6, claude-opus-4-7, claude-haiku-4-5-20251001' },
  ollama:     { label:'Ollama',     baseUrl:'http://localhost:11434/v1',         shape:'openai',    needsKey:false, defaultModel:'llama3.1', modelHint:'llama3.1, hermes3, qwen2.5, mistral (whatever you have pulled locally)' },
  custom:     { label:'Custom',     baseUrl:'',                                  shape:'openai',    needsKey:true,  defaultModel:'', modelHint:'any OpenAI-compatible /v1/chat/completions endpoint (Together, Groq, Fireworks, vLLM, LM Studio…)' }
};

const Settings = {
  KEY: 'vault-v4-settings',
  data: {
    provider: 'mock',          // 'mock' | 'openai' | 'openrouter' | 'anthropic' | 'ollama' | 'custom'
    apiKey: '',
    baseUrl: '',               // for custom only; presets use PROVIDER_PRESETS
    model: 'gpt-4o-mini',
    maxTokens: 2000
  },
  load(){
    try { const raw = localStorage.getItem(this.KEY); if (raw) Object.assign(this.data, JSON.parse(raw)); } catch(e){}
    return this.data;
  },
  save(){ localStorage.setItem(this.KEY, JSON.stringify(this.data)); },
  resolvedBaseUrl(){
    const p = this.data.provider;
    if (p==='custom') return (this.data.baseUrl || '').replace(/\/$/, '');
    return PROVIDER_PRESETS[p]?.baseUrl || '';
  },
  resolvedShape(){
    const p = this.data.provider;
    return PROVIDER_PRESETS[p]?.shape || 'openai';
  }
};

const LLM = {
  /* ---------- transport ---------- */
  async call({ system, user, maxTokens }){
    const s = Settings.data;
    if (Settings.resolvedShape()==='anthropic') return this._callAnthropic({ system, user, maxTokens });
    return this._callOpenAI({ system, user, maxTokens });
  },

  async _callOpenAI({ system, user, maxTokens }){
    const s = Settings.data;
    const base = Settings.resolvedBaseUrl();
    if (!base) throw new Error('No baseUrl set. Open Settings (⚙) to configure.');
    const preset = PROVIDER_PRESETS[s.provider] || PROVIDER_PRESETS.custom;
    if (preset.needsKey && !s.apiKey) throw new Error(`No API key set for ${preset.label}.`);
    const headers = { 'content-type':'application/json' };
    if (s.apiKey) headers['authorization'] = `Bearer ${s.apiKey}`;
    if (s.provider==='openrouter'){
      headers['HTTP-Referer'] = location.origin || 'https://localhost';
      headers['X-Title'] = 'AI Wiki Vault';
    }
    const body = {
      model: s.model,
      max_tokens: maxTokens || s.maxTokens,
      messages: [
        { role:'system', content: system },
        { role:'user',   content: user }
      ]
    };
    const res = await fetch(`${base}/chat/completions`, { method:'POST', headers, body: JSON.stringify(body) });
    if (!res.ok){
      const errText = await res.text();
      throw new Error(`${preset.label} ${res.status}: ${errText.slice(0,240)}`);
    }
    const data = await res.json();
    return data.choices?.[0]?.message?.content || '';
  },

  async _callAnthropic({ system, user, maxTokens }){
    const s = Settings.data;
    if (!s.apiKey) throw new Error('No API key set for Anthropic.');
    const body = {
      model: s.model,
      max_tokens: maxTokens || s.maxTokens,
      system: [{ type:'text', text: system, cache_control:{ type:'ephemeral' } }],
      messages: [{ role:'user', content: user }]
    };
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers: {
        'content-type':'application/json',
        'x-api-key': s.apiKey,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body: JSON.stringify(body)
    });
    if (!res.ok){
      const errText = await res.text();
      throw new Error(`Anthropic ${res.status}: ${errText.slice(0,240)}`);
    }
    const data = await res.json();
    const usage = data.usage || {};
    if (usage.cache_read_input_tokens) console.log(`[cache hit] ${usage.cache_read_input_tokens} tokens`);
    return data.content?.[0]?.text || '';
  },

  parseJson(raw){
    if (!raw) return null;
    // Strip code fences if model wrapped JSON in ```json ... ```
    const fence = raw.match(/```(?:json)?\s*([\s\S]*?)```/);
    const blob = fence ? fence[1] : raw;
    const m = blob.match(/\{[\s\S]*\}/);
    if (!m) return null;
    try { return JSON.parse(m[0]); } catch(e){ return null; }
  },

  /* ---------- ops (provider-agnostic, share transport) ---------- */
  async ingest({ title, text, url }){
    const pages = Vault.listPages();
    const kind = detectKind(url);
    const handle = clipHandle(url);
    const pageList = pages.map(p => `- [${p.type}] ${p.title}${p.tags.length?` (${p.tags.join(',')})`:''}`).join('\n') || '(empty vault)';

    const system = `You are an AI librarian for a personal Karpathy-style LLM wiki. The wiki is a flat markdown vault using [[Wikilinks]] and emergent tags. Pages are typed: concept | person | source | clip | synthesis | note.

For each ingest, you EXPAND the vault: produce one source/clip page AND extract every distinct concept and person worth its own page. Karpathy method: 1 ingest → 5-15 pages of summaries, entity pages, concept pages, all cross-linked.

Return STRICT JSON only. No commentary outside the JSON object.

Schema:
{
  "title":    "<cleaned title, max 80 chars; for clips use date+handle>",
  "kind":     "source | clip",
  "summary":  "<2-3 sentence factual summary>",
  "tags":     ["lowercase-kebab-tag", ...],
  "concepts": ["Concept Name", ...],
  "people":   ["Person or Handle", ...],
  "mentions": ["Existing Page Title", ...]
}

CONCEPTS — what counts as a concept page

A concept is an idea, framework, pattern, strategy, technique, or named methodology that someone could spend a whole page describing. Use multi-word descriptive phrases. Title Case.

GOOD concept names (the kind to extract):
- "Swing Trading Pullback Entries"
- "Breakout Entry Setup"
- "LLM Wiki Pattern"
- "AI Research Overview"
- "Claude.md Behavioral Guidelines"
- "Prompt Caching"
- "Position Sizing"
- "Risk Management"
- "Negative Space"
- "13F Tracking"

BAD — DO NOT extract these as concepts:
- Single capitalized words at sentence starts: "Before", "Here", "March", "Most", "Now", "Then"
- UI / legal labels: "Privacy Policy", "Cookie Use", "Sign In", "Post See", "Click Here", "Read More"
- Generic verbs/nouns: "Leaving", "Sign", "Page", "View"
- Pure proper nouns that are products/companies (treat as tags or mentions, not concepts): "GitHub", "Claude", "Twitter"
- One-word fragments that are actually part of a sentence

Test: if you couldn't write 2 paragraphs explaining the concept, it's not a concept — drop it.

PEOPLE — what counts as a person page

A person is a real human or a real social-media handle. Either:
- Full name in Title Case ("Andrej Karpathy", "Jane Smith")
- A handle from a URL or @mention, returned as just the handle without @ ("JLawStock", "karpathy", "defileo")

DO NOT include as people:
- Two-word capitalized phrases that aren't names ("Cookie Use", "Privacy Policy", "Post See", "Claude Code", "Prompt Caching")
- Product names ("Claude", "GPT", "Hermes" the model — only "Hermes" the human if context says so)
- Generic 2-word phrases (always check: would a real person be named this?)

If unsure whether something is a person or a concept, prefer concept.

MENTIONS — only existing titles

"mentions" = EXACT titles drawn verbatim from the existing pages list. Never invent. Never add titles you would create as concepts/people stubs — those go in concepts/people instead.

OTHER RULES
- "kind" = "clip" for short social posts (twitter/x/threads/reddit/linkedin) and "source" otherwise.
- Same item never appears in more than one of concepts/people/mentions.
- Aim for 3-10 concepts+people combined when source has substance. Quality over quantity — a vague extraction is worse than fewer good ones.
- 1-5 tags, lowercase, dash-separated, reusing existing tags when sensible.
- Concept titles should be the form a curious reader would search for, not random capitalized fragments from the prose.`;

    const user = `Existing pages:\n${pageList}\n\n---\n\nIngest:\nDetected kind: ${kind}${handle?` (handle: ${handle})`:''}\nSource URL: ${url || '(pasted)'}\nSource title hint: ${title || '(none — infer)'}\nDate: ${today()}\n\nSource text:\n${text.slice(0, 80000)}\n\nReturn JSON only.`;

    const raw = await this.call({ system, user, maxTokens: 1500 });
    const parsed = this.parseJson(raw) || { title: title || 'Untitled', kind, summary: raw.slice(0,200), tags:[], concepts:[], people:[], mentions:[] };

    const finalKind = parsed.kind || kind;
    let cleanTitle = parsed.title || title || (text.split('\n').find(l=>l.trim()) || 'Untitled').slice(0,80);
    if (finalKind==='clip' && handle && !cleanTitle.includes(handle)){
      cleanTitle = `${today()} ${handle}` + (parsed.title ? ` — ${parsed.title}`.slice(0,60) : '');
    }

    // 1. Source record
    const source = Source.create({
      title: cleanTitle, url, raw: text,
      type: url ? 'url' : 'note',
      summary: parsed.summary || ''
    });
    Vault.putSource(source);

    // 2. Auto-wikilink existing mentions in body
    const linked = [];
    let bodyText = text;
    (parsed.mentions || []).forEach(t => {
      const p = Vault.getPageByTitle(t);
      if (p && !linked.find(x=>x.id===p.id)){
        linked.push(p);
        const esc = t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const re = new RegExp(`\\b(${esc})\\b`, 'i');
        bodyText = bodyText.replace(re, `[[$1]]`);
      }
    });

    // 3. Source / clip page
    const tags = (finalKind==='clip' && !((parsed.tags||[]).includes('clip'))) ? ['clip', ...(parsed.tags||[])] : (parsed.tags || []);
    const sourcePage = Page.create({
      title: cleanTitle, type: finalKind, tags, sources:[source.id], status:'curated',
      md: `# ${cleanTitle}\n\n## Summary\n\n${parsed.summary || '_(no summary)_'}\n\n## Source\n\n${url ? `<${url}>` : '_(pasted text)_'}\n\n## Body\n\n${bodyText}\n${
        (parsed.people||[]).length ? `\n## People\n\n${parsed.people.map(p=>`- [[${p}]]`).join('\n')}\n` : ''
      }${
        (parsed.concepts||[]).length ? `\n## Concepts\n\n${parsed.concepts.map(c=>`- [[${c}]]`).join('\n')}\n` : ''
      }${
        linked.length ? `\n## Links\n\n${linked.map(p=>`- [[${p.title}]]`).join('\n')}\n` : ''
      }`
    });
    Vault.putPage(sourcePage);

    // 4. Concept stubs
    const conceptStubs = [];
    (parsed.concepts || []).forEach(c => {
      if (Vault.getPageByTitle(c)) return;
      const stub = Page.create({
        title: c, type:'concept', tags:[tags[0]||'concept'].filter(Boolean), status:'draft',
        md: `# ${c}\n\n## Summary\n\n_Stub. Created from [[${cleanTitle}]] on ${today()}._\n\n## Mentioned in\n\n- [[${cleanTitle}]]\n`
      });
      Vault.putPage(stub);
      conceptStubs.push(stub);
    });

    // 5. Person stubs
    const personStubs = [];
    (parsed.people || []).forEach(p => {
      if (Vault.getPageByTitle(p)) return;
      const stub = Page.create({
        title: p, type:'person', tags:['person'], status:'draft',
        md: `# ${p}\n\n## Summary\n\n_Stub. First mention via [[${cleanTitle}]] on ${today()}._\n\n## Mentioned in\n\n- [[${cleanTitle}]]\n`
      });
      Vault.putPage(stub);
      personStubs.push(stub);
    });

    // 6. Append "Mentioned in" to existing linked pages
    linked.forEach(p => {
      const stamp = `- [[${cleanTitle}]] _(${today()})_`;
      if (/## Mentioned in/i.test(p.md)){
        p.md = p.md.replace(/(## Mentioned in\s*\n)([\s\S]*?)(\n##|\n*$)/i, (m, h, body, tail) => `${h}${body}${stamp}\n${tail}`);
      } else {
        p.md += `\n\n## Mentioned in\n\n${stamp}\n`;
      }
      Vault.putPage(p);
    });

    return { source, sourcePage, linkedPages: linked, conceptStubs, personStubs, tags };
  },

  async query(question){
    const pages = Vault.listPages();
    if (!pages.length) return { answer:'_Vault is empty. Ingest sources first._', citations: [] };

    const corpus = pages.map(p =>
      `### ${p.title} {id: ${p.id}}\nTags: ${p.tags.join(', ') || '—'}\n\n${(p.md || '').slice(0, 2500)}`
    ).join('\n\n---\n\n');

    const system = `You are a research assistant answering from a personal Karpathy-style LLM wiki.

Rules:
- Answer using ONLY the provided vault pages. Do NOT use outside knowledge.
- Cite every factual claim with the page id in [[brackets]] using its id, e.g. [[risk-management]].
- If the answer is not in the vault, say so plainly.
- Output STRICT JSON only:

{
  "answer": "<markdown answer with [[page-id]] citations inline>",
  "citations": [{"id":"page-id","title":"Page Title"}]
}

Vault contents follow:

${corpus}`;

    const user = `Question: ${question}\n\nReturn JSON only.`;
    const raw = await this.call({ system, user, maxTokens: 1500 });
    const parsed = this.parseJson(raw);
    if (!parsed) return { answer: raw, citations: [] };

    let pretty = parsed.answer || '';
    (parsed.citations || []).forEach(c => {
      pretty = pretty.split(`[[${c.id}]]`).join(`[[${c.title}]]`);
    });
    return { answer: pretty, citations: parsed.citations || [] };
  },

  async lint(){
    // Heuristic lint stays fast + free.
    return MockLLM.lint();
  }
};

/* ============================================================
   ANCHOR PAGES — index.md + log.md (auto-rendered)
============================================================ */
const Anchors = {
  isAnchor(id){ return id==='__index__' || id==='__log__'; },
  renderIndex(){
    const byType = {};
    Vault.listPages().forEach(p => { (byType[p.type || 'note'] ||= []).push(p); });
    const order = Object.keys(PAGE_TYPES).filter(t => t!=='anchor').sort((a,b)=>PAGE_TYPES[a].order - PAGE_TYPES[b].order);
    const sections = order.map(type => {
      const ps = (byType[type] || []).sort((a,b)=>a.title.localeCompare(b.title));
      if (!ps.length) return '';
      const meta = PAGE_TYPES[type];
      const items = ps.map(p => `- [[${p.title}]]${p.status==='draft'?' _(draft)_':''}${p.tags.length?` — ${p.tags.map(t=>'#'+t).join(' ')}`:''}`).join('\n');
      return `## ${meta.glyph} ${meta.label}\n\n${items}`;
    }).filter(Boolean).join('\n\n');
    const stats = order.map(t => byType[t]?.length ? `${byType[t].length} ${PAGE_TYPES[t].label.toLowerCase()}` : null).filter(Boolean).join(' · ');
    return `# index\n\n_Auto-generated catalog of all pages, grouped by type._\n\n${sections}\n\n---\n\n_${stats}_`;
  },
  renderLog(){
    const entries = [...Vault.listLog()].reverse().map(e =>
      `- \`${e.ts.slice(0,16).replace('T',' ')}\` **${e.op}** — ${e.summary}`
    ).join('\n');
    return `# log\n\n_Append-only history of vault operations._\n\n${entries || '_(no entries yet)_'}`;
  },
  asPage(id){
    if (id==='__index__') return { id:'__index__', title:'index', type:'anchor', tags:[], sources:[], status:'auto', md: this.renderIndex(), updated: today() };
    if (id==='__log__') return { id:'__log__', title:'log', type:'anchor', tags:[], sources:[], status:'auto', md: this.renderLog(), updated: today() };
    return null;
  }
};

/* ============================================================
   MARKDOWN RENDER
============================================================ */
function renderMarkdown(md){
  if (!md) return '<div></div>';

  // Pre-extract fenced code blocks so their content isn't transformed
  const codeBlocks = [];
  md = md.replace(/```([\s\S]*?)```/g, (_, c) => {
    codeBlocks.push(c);
    return `␀CB${codeBlocks.length - 1}␀`;
  });

  // Inline transforms applied AFTER escapeHtml — input is escape-safe text
  const renderInline = (s) => escapeHtml(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/(^|[\s(])_([^_\n]+)_(?=[\s.,!?;:)\]]|$)/g, '$1<i>$2</i>')
    .replace(/\[\[([^\]]+?)\]\]/g, (_, ref) => {
      const t = ref.trim();
      const tLower = t.toLowerCase();
      if (tLower === 'index') return `<a class="wikilink" data-anchor="__index__">${t}</a>`;
      if (tLower === 'log')   return `<a class="wikilink" data-anchor="__log__">${t}</a>`;
      const p = Vault.getPageByTitle(t);
      if (p) return `<a class="wikilink" data-pageid="${p.id}">${t}</a>`;
      return `<a class="wikilink broken" data-create="${t}" title="Page not found — click to create">${t}</a>`;
    })
    .replace(/&lt;(https?:[^\s&]+)&gt;/g, '<a href="$1" target="_blank" rel="noopener" style="color:var(--rust)">$1</a>');

  // Split into blocks separated by blank lines, render block-by-block
  const blocks = md.split(/\n\s*\n+/);
  const html = blocks.map(block => {
    block = block.replace(/^\s+|\s+$/g, '');
    if (!block) return '';

    // Code block placeholder
    const cb = block.match(/^␀CB(\d+)␀$/);
    if (cb) return `<pre>${escapeHtml(codeBlocks[+cb[1]])}</pre>`;

    // Headings (single-line block)
    if (/^### /.test(block)) return `<h3>${renderInline(block.slice(4))}</h3>`;
    if (/^## /.test(block))  return `<h2>${renderInline(block.slice(3))}</h2>`;
    if (/^# /.test(block))   return `<h1>${renderInline(block.slice(2))}</h1>`;

    // Horizontal rule
    if (/^---+$/.test(block)) return '<hr style="border:none;border-top:1px solid var(--line-2);margin:14px 0">';

    // Blockquote
    if (/^>\s/.test(block)) {
      const lines = block.split('\n').map(l => l.replace(/^>\s?/, ''));
      return `<blockquote>${renderInline(lines.join(' '))}</blockquote>`;
    }

    // Unordered list — every non-empty line must start with '- '
    const lines = block.split('\n');
    if (lines.every(l => /^- /.test(l) || !l.trim())) {
      const items = lines.filter(l => /^- /.test(l))
        .map(l => `<li>${renderInline(l.slice(2))}</li>`).join('');
      return `<ul>${items}</ul>`;
    }

    // Ordered list
    if (lines.every(l => /^\d+\.\s/.test(l) || !l.trim())) {
      const items = lines.filter(l => /^\d+\.\s/.test(l))
        .map(l => `<li>${renderInline(l.replace(/^\d+\.\s/, ''))}</li>`).join('');
      return `<ol>${items}</ol>`;
    }

    // Paragraph — collapse internal newlines to spaces (markdown-style)
    return `<p>${renderInline(block.replace(/\n/g, ' '))}</p>`;
  }).join('\n');

  return `<div>${html}</div>`;
}
