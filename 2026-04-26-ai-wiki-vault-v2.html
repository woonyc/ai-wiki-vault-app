<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vault — Second Brain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<style>
  :root{
    --bg:#0a0a0a;
    --bg-1:#0e0e0e;
    --bg-2:#131313;
    --bg-3:#181818;
    --line:rgba(255,255,255,.06);
    --line-2:rgba(255,255,255,.10);
    --line-3:rgba(255,255,255,.16);
    --ink:#ece9e2;
    --ink-2:#a8a59c;
    --ink-3:#67645c;
    --ink-4:#3e3c37;
    --rust:#d97757;
    --rust-soft:rgba(217,119,87,.14);
    --lime:#CCFF00;
    --lime-soft:rgba(204,255,0,.10);
    --mono:'IBM Plex Mono', ui-monospace, monospace;
    --sans:'IBM Plex Sans', system-ui, sans-serif;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--sans);
    background:var(--bg);
    color:var(--ink);
    font-size:14px;
    line-height:1.5;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    background-image:
      radial-gradient(circle at 20% 0%, rgba(217,119,87,.04), transparent 40%),
      radial-gradient(circle at 90% 100%, rgba(204,255,0,.02), transparent 40%);
  }
  /* film grain */
  body::before{
    content:'';
    position:fixed;inset:0;pointer-events:none;z-index:1000;
    opacity:.035;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' /%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  ::selection{background:var(--rust);color:#000}

  .mono{font-family:var(--mono);letter-spacing:.01em}
  .micro{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)}

  /* APP SHELL */
  #app{
    display:grid;
    grid-template-columns:220px 1fr;
    grid-template-rows:48px 1fr;
    height:100vh;
  }

  /* TOP BAR */
  .topbar{
    grid-column:1 / -1;
    display:grid;
    grid-template-columns:220px 1fr auto;
    align-items:center;
    border-bottom:1px solid var(--line);
    background:var(--bg);
    z-index:50;
  }
  .brand{
    display:flex;align-items:center;gap:10px;
    height:100%;padding:0 16px;
    border-right:1px solid var(--line);
    font-family:var(--mono);
    font-weight:500;
    font-size:12px;
    color:var(--ink);
    letter-spacing:.04em;
  }
  .brand .logo{
    width:24px;height:24px;flex-shrink:0;color:var(--ink);
    animation:logoSpin 60s linear infinite;
  }
  @keyframes logoSpin{
    from{transform:rotate(0)}
    to{transform:rotate(360deg)}
  }
  .brand .name{display:flex;flex-direction:column;line-height:1.1}
  .brand .name b{font-weight:500;color:var(--ink);letter-spacing:.04em}
  .brand .name small{
    font-family:var(--mono);font-size:9px;color:var(--ink-3);letter-spacing:.22em;
    text-transform:uppercase;margin-top:2px;
  }
  .topbar-mid{
    display:flex;align-items:center;gap:14px;padding:0 18px;
  }
  .crumb{
    font-family:var(--mono);font-size:11px;color:var(--ink-3);
    display:flex;align-items:center;gap:8px;
  }
  .crumb b{color:var(--ink-2);font-weight:500}
  .crumb .sep{color:var(--ink-4)}
  .search{
    flex:1;max-width:520px;margin-left:24px;position:relative;
  }
  .search input{
    width:100%;background:transparent;border:none;border-bottom:1px solid var(--line);
    color:var(--ink);font-family:var(--mono);font-size:12px;padding:6px 0 6px 18px;
    outline:none;transition:border-color .2s;
  }
  .search input:focus{border-color:var(--rust)}
  .search::before{
    content:'';position:absolute;left:0;top:50%;width:10px;height:10px;
    border:1px solid var(--ink-3);border-radius:50%;transform:translateY(-50%);
  }
  .search::after{
    content:'';position:absolute;left:8px;top:50%;width:6px;height:1px;background:var(--ink-3);
    transform:translateY(2px) rotate(45deg);transform-origin:left center;
  }
  .topbar-right{
    display:flex;align-items:center;gap:0;height:100%;
  }
  .top-tab{
    height:100%;padding:0 16px;display:flex;align-items:center;gap:8px;
    font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--ink-3);background:transparent;border:none;border-left:1px solid var(--line);
    cursor:pointer;transition:color .15s,background .15s;position:relative;
  }
  .top-tab:hover{color:var(--ink)}
  .top-tab.active{color:var(--ink)}
  .top-tab.active::after{
    content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--rust);
  }
  .top-tab .dot{width:4px;height:4px;border-radius:50%;background:var(--ink-4)}
  .top-tab.active .dot{background:var(--lime)}
  .sync{
    padding:0 16px;height:100%;display:flex;align-items:center;gap:8px;
    border-left:1px solid var(--line);
    font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase;
  }
  .sync .pulse{width:6px;height:6px;border-radius:50%;background:var(--lime);box-shadow:0 0 8px var(--lime);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

  /* LEFT RAIL */
  .rail{
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;
    padding:14px 10px;
    background:var(--bg);
    overflow-y:auto;
  }
  .rail::-webkit-scrollbar{display:none}
  .rail-section{
    font-family:var(--mono);font-size:9px;font-weight:400;
    letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3);
    padding:6px 8px 8px;
  }
  .rail-btn{
    display:flex;align-items:center;gap:10px;
    padding:8px 10px;margin-bottom:1px;
    border:none;background:transparent;cursor:pointer;
    color:var(--ink-2);
    font-family:var(--sans);font-weight:400;font-size:13px;
    text-align:left;
    position:relative;
    transition:all .12s;
    border-left:2px solid transparent;
  }
  .rail-btn:hover{background:var(--bg-2);color:var(--ink)}
  .rail-btn.active{
    background:var(--bg-2);color:var(--ink);border-left-color:var(--rust);
  }
  .rail-btn .dot{
    width:7px;height:7px;border-radius:50%;flex-shrink:0;
    background:var(--ink-3);
    transition:all .15s;
  }
  .rail-btn:hover .dot,.rail-btn.active .dot{transform:scale(1.15)}
  .rail-btn.all{justify-content:center;padding:10px}
  .rail-btn.all .dot{
    width:16px;height:16px;border-radius:50%;
    background:transparent;border:1.5px solid var(--ink-2);
    position:relative;
  }
  .rail-btn.all .dot::before{
    content:'';position:absolute;inset:2px;border-radius:50%;
    border:1px solid var(--ink-2);
  }
  .rail-btn.all .dot::after{
    content:'';position:absolute;inset:5px;border-radius:50%;
    background:var(--ink-2);
  }
  .rail-btn.all:hover .dot,.rail-btn.all:hover .dot::before{border-color:var(--ink)}
  .rail-btn.all:hover .dot::after{background:var(--ink)}
  .rail-btn.all.active .dot,.rail-btn.all.active .dot::before{border-color:var(--rust)}
  .rail-btn.all.active .dot::after{background:var(--rust)}
  .rail-btn.all .label{display:none}
  .rail-btn .label{
    flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .rail-btn .edit-hint{
    font-family:var(--mono);font-size:10px;color:var(--ink-4);
    opacity:0;transition:opacity .15s;
  }
  .rail-btn:hover .edit-hint{opacity:1}
  .rail-divider{height:1px;background:var(--line);margin:8px 4px}
  .rail-add{
    display:flex;align-items:center;gap:10px;
    padding:8px 10px;margin:4px 0;
    border:1px dashed var(--line-3);
    background:transparent;color:var(--ink-3);cursor:pointer;
    font-family:var(--mono);font-size:11px;letter-spacing:.08em;
    text-align:left;
    transition:all .15s;
  }
  .rail-add:hover{border-color:var(--rust);color:var(--rust)}
  .rail-add .plus{font-size:14px;width:7px;text-align:center}

  /* MAIN */
  .main{
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  .view{
    flex:1;
    overflow:auto;
    position:relative;
  }
  .view::-webkit-scrollbar{width:6px;height:6px}
  .view::-webkit-scrollbar-track{background:transparent}
  .view::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:0}

  /* GRAPH */
  .graph-wrap{
    position:absolute;inset:0;
    background:
      radial-gradient(circle at 50% 50%, rgba(255,255,255,.012) 0%, transparent 70%);
  }
  .graph-grid{
    position:absolute;inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,.012) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.012) 1px, transparent 1px);
    background-size:60px 60px;
    pointer-events:none;
  }
  #graph{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
  #graph:active{cursor:grabbing}
  .graph-overlay{
    position:absolute;top:18px;left:18px;z-index:10;
    pointer-events:none;
  }
  .graph-overlay h2{
    font-family:var(--mono);font-size:11px;font-weight:400;
    letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3);
  }
  .graph-overlay p{
    font-family:var(--sans);font-size:13px;color:var(--ink-2);margin-top:4px;max-width:340px;
  }
  .graph-stats{
    position:absolute;bottom:18px;left:18px;display:flex;gap:18px;z-index:10;
    pointer-events:none;
  }
  .stat{
    font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase;
  }
  .stat b{color:var(--ink);font-size:14px;font-weight:500;display:block;margin-bottom:2px;letter-spacing:0;text-transform:none}
  .graph-controls{
    position:absolute;top:18px;right:18px;display:flex;flex-direction:column;gap:6px;z-index:10;
  }
  .gctl{
    width:30px;height:30px;display:flex;align-items:center;justify-content:center;
    background:var(--bg-2);border:1px solid var(--line);
    color:var(--ink-2);cursor:pointer;font-family:var(--mono);font-size:13px;
    transition:all .15s;
  }
  .gctl:hover{border-color:var(--line-3);color:var(--ink)}
  .legend{
    position:absolute;bottom:18px;right:18px;z-index:10;
    background:var(--bg-2);border:1px solid var(--line);padding:10px 12px;
    font-family:var(--mono);font-size:10px;
  }
  .legend-row{display:flex;align-items:center;gap:8px;color:var(--ink-3);padding:2px 0}
  .legend-row .swatch{width:8px;height:8px;border-radius:50%}

  /* node + link styles handled by D3 inline */

  /* INBOX */
  .inbox-wrap{
    max-width:880px;
    margin:0 auto;
    padding:48px 32px 80px;
  }
  .inbox-head{margin-bottom:28px}
  .inbox-head .micro{margin-bottom:8px}
  .inbox-head h1{
    font-family:var(--mono);font-size:24px;font-weight:400;letter-spacing:-.01em;color:var(--ink);
  }
  .inbox-head h1 b{color:var(--rust);font-weight:500}
  .inbox-head p{color:var(--ink-3);margin-top:6px;max-width:540px;font-size:13px}

  .inbox-card{
    background:var(--bg-1);border:1px solid var(--line);
    padding:0;margin-bottom:20px;
  }
  .url-row{
    display:flex;align-items:center;border-bottom:1px solid var(--line);
  }
  .url-row .prefix{
    padding:0 16px;font-family:var(--mono);font-size:11px;color:var(--ink-3);
    border-right:1px solid var(--line);height:52px;display:flex;align-items:center;letter-spacing:.1em;
  }
  .url-row input{
    flex:1;background:transparent;border:none;outline:none;
    font-family:var(--mono);color:var(--ink);font-size:13px;
    padding:0 16px;height:52px;
  }
  .url-row input::placeholder{color:var(--ink-4)}
  .url-row button{
    border:none;background:var(--rust);color:#0a0a0a;
    font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;
    padding:0 22px;height:52px;cursor:pointer;
    transition:filter .15s;
  }
  .url-row button:hover{filter:brightness(1.08)}
  .url-row button:disabled{background:var(--bg-3);color:var(--ink-4);cursor:not-allowed}

  .drop-zone{
    border:1px dashed var(--line-3);
    margin:20px;padding:48px 24px;text-align:center;
    transition:all .2s;cursor:pointer;
    position:relative;
  }
  .drop-zone:hover,.drop-zone.over{
    border-color:var(--rust);background:var(--rust-soft);
  }
  .drop-zone.over .drop-icon{transform:scale(1.1) rotate(-3deg)}
  .drop-icon{
    width:38px;height:38px;margin:0 auto 14px;
    border:1px solid var(--ink-3);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:14px;color:var(--ink-2);
    transition:transform .25s;
  }
  .drop-zone h3{
    font-family:var(--mono);font-size:13px;font-weight:400;color:var(--ink);
    letter-spacing:.02em;
  }
  .drop-zone p{color:var(--ink-3);font-size:12px;margin-top:6px}
  .drop-zone .types{
    display:flex;justify-content:center;gap:12px;margin-top:14px;
    font-family:var(--mono);font-size:10px;color:var(--ink-4);letter-spacing:.16em;text-transform:uppercase;
  }
  .drop-zone .types span{padding:3px 8px;border:1px solid var(--line)}

  .ai-routing{
    border-top:1px solid var(--line);padding:18px 20px;
    display:flex;align-items:flex-start;gap:14px;
  }
  .ai-routing .ai-glyph{
    width:24px;height:24px;flex-shrink:0;
    border:1px solid var(--lime);
    color:var(--lime);
    font-family:var(--mono);font-size:11px;font-weight:500;
    display:flex;align-items:center;justify-content:center;
  }
  .ai-routing .body{flex:1;min-width:0}
  .ai-routing .label{
    font-family:var(--mono);font-size:10px;color:var(--lime);letter-spacing:.16em;text-transform:uppercase;margin-bottom:4px;
  }
  .ai-routing .text{color:var(--ink-2);font-size:13px;line-height:1.55}
  .ai-routing .text b{color:var(--ink);font-weight:500}

  .recents{
    margin-top:36px;
  }
  .recents-head{
    display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;
    border-bottom:1px solid var(--line);padding-bottom:10px;
  }
  .recents-head h2{
    font-family:var(--mono);font-size:11px;font-weight:400;
    letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3);
  }
  .recents-head .count{font-family:var(--mono);font-size:11px;color:var(--ink-4)}

  .source-row{
    display:grid;grid-template-columns:14px 1fr auto auto;gap:16px;
    padding:14px 0;border-bottom:1px solid var(--line);align-items:center;
  }
  .source-row .marker{
    width:6px;height:6px;border-radius:50%;background:var(--ink-4);
    justify-self:center;
  }
  .source-row.processed .marker{background:var(--lime)}
  .source-row.raw .marker{background:var(--rust)}
  .source-row .title{font-size:13px;color:var(--ink);min-width:0}
  .source-row .title small{
    display:block;font-family:var(--mono);font-size:10px;color:var(--ink-3);
    margin-top:2px;letter-spacing:.06em;
  }
  .source-row .compartment{
    font-family:var(--mono);font-size:10px;color:var(--ink-2);letter-spacing:.1em;text-transform:uppercase;
    padding:3px 8px;border:1px solid var(--line);
  }
  .source-row .status{
    font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase;
  }

  /* WIKI */
  .wiki-wrap{
    display:grid;grid-template-columns:240px 1fr;height:100%;
  }
  .page-list{
    border-right:1px solid var(--line);overflow-y:auto;padding:18px 0;
    background:var(--bg-1);
  }
  .page-list-head{
    padding:0 18px 12px;display:flex;justify-content:space-between;align-items:baseline;
    border-bottom:1px solid var(--line);margin-bottom:8px;
  }
  .page-list-head h3{
    font-family:var(--mono);font-size:10px;font-weight:400;
    letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3);
  }
  .page-list-head .new{
    background:transparent;border:none;color:var(--rust);
    font-family:var(--mono);font-size:11px;cursor:pointer;letter-spacing:.04em;
  }
  .page-item{
    width:100%;text-align:left;background:transparent;border:none;cursor:pointer;
    padding:8px 18px;color:var(--ink-2);font-family:var(--sans);font-size:13px;
    border-left:2px solid transparent;
    transition:all .12s;
  }
  .page-item:hover{background:var(--bg-2);color:var(--ink)}
  .page-item.active{background:var(--bg-2);color:var(--ink);border-left-color:var(--rust)}
  .page-item .meta{
    display:block;font-family:var(--mono);font-size:10px;color:var(--ink-4);
    margin-top:2px;letter-spacing:.06em;
  }

  .page-content{overflow-y:auto;padding:0}
  .page-header{
    padding:48px 56px 24px;border-bottom:1px solid var(--line);
  }
  .page-header .micro{margin-bottom:10px}
  .page-header h1{
    font-family:var(--mono);font-size:32px;font-weight:400;color:var(--ink);
    letter-spacing:-.01em;line-height:1.15;
  }
  .page-meta{
    display:flex;gap:18px;margin-top:14px;
    font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.04em;
  }
  .page-meta span b{color:var(--ink-2);font-weight:500;margin-left:4px}
  .page-actions{
    display:flex;gap:8px;margin-top:18px;
  }
  .btn{
    background:transparent;border:1px solid var(--line-2);color:var(--ink-2);
    font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    padding:8px 14px;cursor:pointer;transition:all .15s;
  }
  .btn:hover{border-color:var(--line-3);color:var(--ink)}
  .btn.primary{background:var(--rust);color:#0a0a0a;border-color:var(--rust)}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.lime{border-color:var(--lime);color:var(--lime)}
  .btn.lime:hover{background:var(--lime-soft)}

  .markdown{
    padding:32px 56px 80px;max-width:780px;
  }
  .markdown h1{display:none}
  .markdown h2{
    font-family:var(--mono);font-size:11px;font-weight:400;
    letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3);
    margin:32px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line);
  }
  .markdown h2:first-child{margin-top:0}
  .markdown p{color:var(--ink);margin-bottom:14px;font-size:14.5px;line-height:1.7}
  .markdown ul{margin:0 0 16px;padding:0;list-style:none}
  .markdown li{
    padding:6px 0 6px 20px;color:var(--ink);position:relative;font-size:14px;line-height:1.65;
  }
  .markdown li::before{
    content:'';position:absolute;left:0;top:14px;width:8px;height:1px;background:var(--rust);
  }
  .markdown a[data-wikilink]{
    color:var(--rust);text-decoration:none;border-bottom:1px solid var(--rust-soft);
    padding-bottom:1px;cursor:pointer;
  }
  .markdown a[data-wikilink]:hover{border-bottom-color:var(--rust);background:var(--rust-soft)}
  .markdown code{
    font-family:var(--mono);background:var(--bg-3);padding:1px 6px;font-size:.9em;color:var(--lime);
  }

  /* CONTEXT DRAWER (under article) */
  .ctx-drawer{
    border-top:1px solid var(--line);
    background:var(--bg-1);
  }
  .ctx-toggle{
    width:100%;background:transparent;border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 56px;font-family:var(--mono);font-size:11px;
    color:var(--ink-3);letter-spacing:.18em;text-transform:uppercase;
    transition:color .15s;
  }
  .ctx-toggle:hover{color:var(--ink)}
  .ctx-toggle .arrow{
    width:8px;height:8px;border-right:1px solid currentColor;border-bottom:1px solid currentColor;
    transform:rotate(45deg);transition:transform .25s;
  }
  .ctx-drawer.open .ctx-toggle .arrow{transform:rotate(-135deg)}
  .ctx-body{
    max-height:0;overflow:hidden;transition:max-height .3s ease;
  }
  .ctx-drawer.open .ctx-body{max-height:600px}
  .ctx-grid{
    display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;
    background:var(--line);border-top:1px solid var(--line);
  }
  .ctx-cell{background:var(--bg-1);padding:20px 28px}
  .ctx-cell h4{
    font-family:var(--mono);font-size:10px;font-weight:400;
    letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3);margin-bottom:12px;
  }
  .ctx-item{
    padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink-2);
    cursor:pointer;transition:color .15s;
  }
  .ctx-item:hover{color:var(--ink)}
  .ctx-item:last-child{border-bottom:none}
  .ctx-item small{display:block;font-family:var(--mono);font-size:10px;color:var(--ink-4);margin-top:2px}
  .ai-tip{
    background:var(--lime-soft);border-left:2px solid var(--lime);
    padding:10px 12px;font-size:12px;color:var(--ink);
  }

  /* REVIEW */
  .review-wrap{padding:36px 48px;max-width:980px;margin:0 auto}
  .review-head{
    display:flex;justify-content:space-between;align-items:flex-end;
    border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:24px;
  }
  .review-head h1{
    font-family:var(--mono);font-size:22px;font-weight:400;color:var(--ink);
  }
  .review-head h1 b{color:var(--rust)}
  .review-head .micro{margin-bottom:8px;display:block}
  .prop{
    border:1px solid var(--line);background:var(--bg-1);
    padding:20px 24px;margin-bottom:14px;
  }
  .prop-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px}
  .prop-tags{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
  .tag{
    font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;
    padding:3px 8px;border:1px solid var(--line-2);color:var(--ink-3);
  }
  .tag.high{color:var(--lime);border-color:var(--lime)}
  .tag.medium{color:var(--rust);border-color:var(--rust)}
  .tag.low{color:var(--ink-3)}
  .prop h3{
    font-family:var(--mono);font-size:15px;font-weight:500;color:var(--ink);margin-bottom:8px;
  }
  .prop .reasoning{font-size:13px;color:var(--ink-2);margin-bottom:8px}
  .prop .source-ref{
    font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.04em;
  }
  .prop pre{
    margin-top:14px;background:var(--bg);border:1px solid var(--line);
    padding:14px;font-family:var(--mono);font-size:12px;color:var(--ink-2);
    white-space:pre-wrap;line-height:1.6;
  }
  .prop-actions{display:flex;gap:6px;flex-shrink:0}
  .empty{
    border:1px solid var(--line);padding:80px 24px;text-align:center;
  }
  .empty .glyph{
    width:48px;height:48px;margin:0 auto 16px;border:1px solid var(--line-3);
    display:flex;align-items:center;justify-content:center;color:var(--lime);font-family:var(--mono);
  }
  .empty h3{font-family:var(--mono);font-size:15px;font-weight:400;color:var(--ink)}
  .empty p{color:var(--ink-3);font-size:13px;margin-top:6px;max-width:340px;margin-inline:auto}

  /* RESEARCH */
  .research-wrap{padding:36px 48px;max-width:1100px;margin:0 auto}
  .mission-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .mission{
    border:1px solid var(--line);background:var(--bg-1);padding:22px 24px;
  }
  .mission h3{
    font-family:var(--mono);font-size:14px;color:var(--ink);margin-bottom:8px;
  }
  .mission .status{
    font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.16em;text-transform:uppercase;
  }
  .mission ol{list-style:none;margin-top:14px}
  .mission li{
    counter-increment:step;
    padding:8px 0 8px 28px;color:var(--ink-2);font-size:13px;position:relative;
    border-bottom:1px solid var(--line);
  }
  .mission li::before{
    content:counter(step,decimal-leading-zero);
    position:absolute;left:0;top:8px;
    font-family:var(--mono);font-size:10px;color:var(--ink-4);letter-spacing:.06em;
  }
  .mission ol{counter-reset:step}
  .mission .run{margin-top:14px}

  /* MODAL */
  .modal-bg{
    position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);
    display:none;align-items:center;justify-content:center;z-index:200;
  }
  .modal-bg.open{display:flex}
  .modal{
    background:var(--bg-1);border:1px solid var(--line-2);
    width:420px;max-width:90vw;padding:28px;
  }
  .modal h2{
    font-family:var(--mono);font-size:14px;font-weight:500;color:var(--ink);
    margin-bottom:18px;letter-spacing:.04em;
  }
  .modal label{
    display:block;font-family:var(--mono);font-size:10px;color:var(--ink-3);
    letter-spacing:.18em;text-transform:uppercase;margin:14px 0 6px;
  }
  .modal input[type=text]{
    width:100%;background:var(--bg);border:1px solid var(--line);
    color:var(--ink);font-family:var(--mono);font-size:13px;
    padding:10px 12px;outline:none;
  }
  .modal input[type=text]:focus{border-color:var(--rust)}
  .glyph-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:6px}
  .glyph-opt{
    aspect-ratio:1;background:var(--bg);border:1px solid var(--line);
    color:var(--ink-2);cursor:pointer;font-size:14px;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);
  }
  .glyph-opt:hover{border-color:var(--line-3);color:var(--ink)}
  .glyph-opt.sel{border-color:var(--rust);background:var(--rust-soft);color:var(--rust)}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}

  /* TOAST */
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--bg-3);border:1px solid var(--line-3);
    padding:12px 18px;font-family:var(--mono);font-size:12px;color:var(--ink);
    z-index:300;opacity:0;pointer-events:none;
    transition:all .25s;display:flex;align-items:center;gap:10px;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast .pulse{width:6px;height:6px;border-radius:50%;background:var(--lime)}

  /* node label dom (not used; svg handles labels) */
</style>
</head>
<body>

<div id="app">
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" fill="currentColor" aria-hidden="true">
        <g transform="translate(50,50)">
          <g id="petal-unit">
            <!-- main body (closer to center) -->
            <circle cx="0" cy="-25" r="9.5"/>
            <!-- two outer ears -->
            <circle cx="-7" cy="-37" r="5.6"/>
            <circle cx="7" cy="-37" r="5.6"/>
            <!-- thick band fusing body + ears -->
            <path d="M -8 -28 L -8 -36 Q -8 -41 -3 -41 L 3 -41 Q 8 -41 8 -36 L 8 -28 Z"/>
            <!-- inward foot toward center -->
            <circle cx="0" cy="-13" r="4.6"/>

          <use href="#petal-unit" transform="rotate(120)"/>
          <use href="#petal-unit" transform="rotate(180)"/>
          <use href="#petal-unit" transform="rotate(240)"/>
          <use href="#petal-unit" transform="rotate(300)"/>
        </g>
      </svg>
      <div class="name">
        <b>AI Wiki Vault</b>
        <small>Second Brain</small>
      </div>
    </div>
    <div class="topbar-mid">
      <div class="crumb mono" id="crumb">
        <b id="crumbCompartment">All</b>
        <span class="sep">/</span>
        <span id="crumbView">Graph</span>
      </div>
      <div class="search">
        <input id="search" placeholder="search vault — pages, sources, claims" />
      </div>
    </div>
    <div class="topbar-right">
      <button class="top-tab active" data-tab="graph"><span class="dot"></span>Graph</button>
      <button class="top-tab" data-tab="wiki"><span class="dot"></span>Wiki</button>
      <button class="top-tab" data-tab="inbox"><span class="dot"></span>Inbox</button>
      <button class="top-tab" data-tab="review"><span class="dot"></span>Review</button>
      <button class="top-tab" data-tab="research"><span class="dot"></span>Research</button>

    </div>
  </header>

  <aside class="rail" id="rail"></aside>

  <main class="main">
    <div class="view" id="view"></div>
  </main>
</div>

<!-- Compartment editor modal -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h2 id="modalTitle">New compartment</h2>
    <label>Name</label>
    <input type="text" id="modalName" placeholder="e.g. Trading / Finance" />
    <label>Description</label>
    <input type="text" id="modalDesc" placeholder="short focus statement" />
    <label>Glyph</label>
    <div class="glyph-grid" id="glyphGrid"></div>
    <div class="modal-actions">
      <button class="btn" id="modalDelete" style="margin-right:auto;display:none;color:var(--rust);border-color:var(--rust)">Delete</button>
      <button class="btn" id="modalCancel">Cancel</button>
      <button class="btn primary" id="modalSave">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span class="pulse"></span><span id="toastMsg"></span></div>

<script>
/* ============================================================
   STATE
============================================================ */
const STORAGE_KEY = 'vault-state-v2';

const seed = {
  activeCompartment: 'all',
  activeTab: 'graph',
  selectedPageId: null,
  ctxOpen: false,
  compartments: [
    { id:'trading', name:'Trading / Finance', desc:'Small-cap shorts, 13F, catalysts, risk.', glyph:'TR' },
    { id:'design',  name:'Design',             desc:'Motion, typography, branding, references.', glyph:'DS' },
    { id:'agents',  name:'AI / Coding',        desc:'OpenClaw, Hermes, Claude, mission control.', glyph:'AI' },
    { id:'fitness', name:'Fitness / Life',     desc:'Training logs, HR, 2.4 km, recovery.', glyph:'FT' }
  ],
  pages: [
    { id:'risk-management', cid:'trading', title:'Risk Management', type:'concept', confidence:'high',
      sources:['s-trading-note'], links:['position-sizing','parabolic-shorts','training-load','token-budget'],
      md:'# Risk Management\n\n## Summary\n\nRisk management is the shared operating system behind trading, training, and AI-token usage. A cross-compartment concept rather than a trading-only note.\n\n## Key Ideas\n\n- Define maximum loss before entering.\n- Tie daily loss to average green day, not emotion.\n- Separate process from variance in review logs.\n- Cross-link with fitness — pacing and drawdown share restraint.\n\n## Claims\n\n- Decisions should separate setup quality from outcome.\n- Simulation prepares; it does not predict.\n\n## Related Pages\n\n- [[Position Sizing]]\n- [[Parabolic Shorts]]\n- [[Training Load]]\n- [[Token Budget]]'},
    { id:'parabolic-shorts', cid:'trading', title:'Parabolic Shorts', type:'strategy', confidence:'medium',
      sources:['s-trading-note'], links:['risk-management','position-sizing'],
      md:'# Parabolic Shorts\n\n## Summary\n\nA setup focused on overheated small-caps where price extends rapidly and risk can be defined near the high of day.\n\n## Key Ideas\n\n- Avoid crowded or unclear structures.\n- Look for lower highs after emotional extension.\n- Size based on stop distance and account risk.\n- Log failed thesis conditions in detail.\n\n## Open Questions\n\n- Which filters separate exhaustion from continuation?\n- How does borrow quality affect expected value?'},
    { id:'position-sizing', cid:'trading', title:'Position Sizing', type:'concept', confidence:'high',
      sources:['s-trading-note'], links:['risk-management'],
      md:'# Position Sizing\n\n## Summary\n\nPosition sizing converts a thesis into controlled risk. Always attached to account size, stop distance, and max loss.\n\n## Key Ideas\n\n- Define dollar risk before share size.\n- Use half-Kelly only after edge is measured.\n- Avoid increasing size to recover losses emotionally.'},
    { id:'thirteen-f', cid:'trading', title:'13F Tracking', type:'workflow', confidence:'medium',
      sources:[], links:['risk-management'],
      md:'# 13F Tracking\n\n## Summary\n\nQuarterly tracking of fund positions for context, not signal.'},

    { id:'negative-space', cid:'design', title:'Negative Space', type:'principle', confidence:'medium',
      sources:['s-design-note'], links:['logo-wit','typography'],
      md:'# Negative Space\n\n## Summary\n\nDeliberate use of empty area to create a second layer of meaning.\n\n## Key Ideas\n\n- The hidden idea should feel discovered, not forced.\n- Simplicity increases memorability.\n- Concept and form collapse into one move.'},
    { id:'logo-wit', cid:'design', title:'Logo Wit', type:'principle', confidence:'medium',
      sources:['s-design-note'], links:['negative-space'],
      md:'# Logo Wit\n\n## Summary\n\nCompact visual idea that rewards the viewer.\n\n## Related Pages\n\n- [[Negative Space]]'},
    { id:'typography', cid:'design', title:'Typography Systems', type:'principle', confidence:'medium',
      sources:['s-design-note'], links:['negative-space'],
      md:'# Typography Systems\n\n## Summary\n\nA system pairs a display voice with a body voice and gives each role specific weights, sizes, and rhythms.'},
    { id:'motion', cid:'design', title:'Motion Curves', type:'principle', confidence:'low',
      sources:[], links:['typography'],
      md:'# Motion Curves\n\n## Summary\n\nEasing as character. Bezier choices define brand tempo.'},

    { id:'llm-wiki', cid:'agents', title:'LLM Wiki Pattern', type:'architecture', confidence:'high',
      sources:['s-karpathy-wiki'], links:['ai-librarian','review-queue','token-budget'],
      md:'# LLM Wiki Pattern\n\n## Summary\n\nAn LLM-maintained wiki uses raw sources as truth and treats generated pages as a living synthesis layer.\n\n## Key Ideas\n\n- Preserve raw sources.\n- Use AI to propose updates.\n- Keep review logs.\n- Maintain links, contradictions, and indexes.'},
    { id:'ai-librarian', cid:'agents', title:'AI Librarian', type:'agent-role', confidence:'medium',
      sources:['s-karpathy-wiki'], links:['llm-wiki','review-queue'],
      md:'# AI Librarian\n\n## Summary\n\nReads sources, extracts structure, proposes links, waits for approval before modifying the vault.'},
    { id:'review-queue', cid:'agents', title:'Review Queue', type:'workflow', confidence:'high',
      sources:[], links:['ai-librarian','llm-wiki'],
      md:'# Review Queue\n\n## Summary\n\nAll AI proposals queue here. Approve, reject, or edit. The anti-slop layer.'},
    { id:'token-budget', cid:'agents', title:'Token Budget', type:'concept', confidence:'medium',
      sources:[], links:['risk-management','llm-wiki'],
      md:'# Token Budget\n\n## Summary\n\nToken cost behaves like financial risk. Define ingest tiers — quick, normal, deep — and reserve deep ingest for high-value sources.'},

    { id:'training-load', cid:'fitness', title:'Training Load', type:'concept', confidence:'medium',
      sources:['s-fitness-note'], links:['risk-management','heart-rate'],
      md:'# Training Load\n\n## Summary\n\nTraining load should rise gradually. Trends matter more than single sessions.\n\n## Key Ideas\n\n- Recovery is part of adaptation.\n- Low-intensity base work reduces HR spikes.\n- Race-specific work after the base is stable.'},
    { id:'heart-rate', cid:'fitness', title:'Heart Rate Zones', type:'metric', confidence:'medium',
      sources:['s-fitness-note'], links:['training-load'],
      md:'# Heart Rate Zones\n\n## Summary\n\nZ2 dominates volume. Z4 reserved for race-specific blocks.'},
    { id:'two-four-km', cid:'fitness', title:'2.4 km Time Trial', type:'log', confidence:'high',
      sources:['s-fitness-note'], links:['training-load','heart-rate'],
      md:'# 2.4 km Time Trial\n\n## Summary\n\nMonthly benchmark. Track pacing, HR drift, recovery.'}
  ],
  sources: [
    { id:'s-karpathy-wiki', cid:'agents', type:'URL', title:'Karpathy LLM Wiki Notes',
      url:'https://gist.github.com/karpathy/442a6bf555914893e9891c11519de94f',
      status:'processed', summary:'Raw-source-first AI-maintained wiki pattern.' },
    { id:'s-trading-note', cid:'trading', type:'Note', title:'Small-cap Shorting Framework',
      url:'', status:'processed', summary:'Notes on parabolic shorts, risk, and sizing.' },
    { id:'s-design-note', cid:'design', type:'Note', title:'Design Principles Collection',
      url:'', status:'processed', summary:'Negative space, wit, brand systems.' },
    { id:'s-fitness-note', cid:'fitness', type:'Log', title:'HR Base Training Notes',
      url:'', status:'processed', summary:'Low-intensity base, race-specific blocks.' }
  ],
  proposals: [
    { id:'p1', cid:'trading', sid:'s-karpathy-wiki', type:'cross_link',
      title:'Cross-link: Risk Management ↔ Token Budget', target:'risk-management',
      confidence:'high', status:'pending',
      reasoning:'Risk management appears across trading, fitness, and AI token budgeting. Cross-link without merging.',
      content:'Add cross-compartment links from Risk Management to Training Load and Token Budget.' },
    { id:'p2', cid:'agents', sid:'s-karpathy-wiki', type:'update_page',
      title:'Update LLM Wiki with review-queue rule', target:'llm-wiki',
      confidence:'high', status:'pending',
      reasoning:'Prevent direct AI writes — route changes through proposals.',
      content:'Add: AI-generated wiki updates must enter the Review Queue before becoming canonical.' },
    { id:'p3', cid:'design', sid:'s-design-note', type:'add_backlink',
      title:'Backlink: Negative Space → Logo Wit', target:'negative-space',
      confidence:'medium', status:'pending',
      reasoning:'Both pages describe compact visual meaning and viewer discovery.',
      content:'Add backlink: [[Logo Wit]]' }
  ],
  missions: [
    { id:'m1', cid:'agents', title:'AI + Obsidian workflows', status:'draft',
      steps:['Collect sources','Ingest transcripts/articles','Generate synthesis','Propose wiki updates'] },
    { id:'m2', cid:'trading', title:'Small-cap evidence map', status:'draft',
      steps:['Collect filings','Extract catalysts','Map claims','Create risk checklist'] }
  ]
};

let state = (() => {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e){}
  return structuredClone(seed);
})();
function save(){ try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){} }

/* helpers */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const escape = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const compartmentOf = id => state.compartments.find(c => c.id === id);
const pagesIn = cid => cid==='all' ? state.pages : state.pages.filter(p=>p.cid===cid);
const sourcesIn = cid => cid==='all' ? state.sources : state.sources.filter(s=>s.cid===cid);
const propsIn = cid => state.proposals.filter(p => (cid==='all'||p.cid===cid) && p.status==='pending');

function toast(msg){
  const t=$('#toast'); $('#toastMsg').textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2200);
}

/* ============================================================
   RAIL — compartments
============================================================ */
function renderRail(){
  const rail = $('#rail');
  const all = state.activeCompartment==='all' ? 'active' : '';
  rail.innerHTML = `
    <button class="rail-btn all ${all}" data-cid="all" title="All compartments">
      <span class="dot"></span>
    </button>
    <div class="rail-divider"></div>
    <div class="rail-section">// Compartments</div>
    ${state.compartments.map(c => `
      <button class="rail-btn ${state.activeCompartment===c.id?'active':''}" data-cid="${c.id}" data-edit="${c.id}" title="Right-click or double-click to edit">
        <span class="dot" style="background:${compartmentColor(c.id)}"></span>
        <span class="label">${escape(c.name)}</span>
        <span class="edit-hint">⋯</span>
      </button>
    `).join('')}
    <button class="rail-add" id="addCompartment" title="New compartment">
      <span class="plus">+</span>
      <span>New compartment</span>
    </button>
  `;
  $$('#rail .rail-btn').forEach(b => {
    b.addEventListener('click', e => {
      state.activeCompartment = b.dataset.cid;
      // clear page selection when switching compartments
      const sel = state.pages.find(p=>p.id===state.selectedPageId);
      if (sel && state.activeCompartment!=='all' && sel.cid!==state.activeCompartment) state.selectedPageId=null;
      render();
    });
    b.addEventListener('contextmenu', e => {
      e.preventDefault();
      if (b.dataset.edit) openCompartmentModal(b.dataset.edit);
    });
    b.addEventListener('dblclick', e => {
      if (b.dataset.edit) openCompartmentModal(b.dataset.edit);
    });
  });
  $('#addCompartment').onclick = () => openCompartmentModal(null);
}

/* ============================================================
   COMPARTMENT MODAL
============================================================ */
const GLYPHS = ['TR','DS','AI','FT','RS','LB','MK','BK','WR','PR','HM','EX','TX','CL','OP','MD','PY','GO','RB','UI','DB','NW','SC','MV','MS','VD','AU','MX','PH','GD','LF','HB'];
let editingCompartment = null;
function openCompartmentModal(cid){
  editingCompartment = cid ? compartmentOf(cid) : null;
  $('#modalTitle').textContent = cid ? 'Edit compartment' : 'New compartment';
  $('#modalName').value = editingCompartment?.name || '';
  $('#modalDesc').value = editingCompartment?.desc || '';
  $('#modalDelete').style.display = cid ? 'inline-block' : 'none';
  const cur = editingCompartment?.glyph || GLYPHS[0];
  $('#glyphGrid').innerHTML = GLYPHS.map(g =>
    `<button class="glyph-opt ${g===cur?'sel':''}" data-glyph="${g}">${g}</button>`).join('');
  $$('#glyphGrid .glyph-opt').forEach(b => b.onclick = () => {
    $$('#glyphGrid .glyph-opt').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel');
  });
  $('#modalBg').classList.add('open');
  setTimeout(()=>$('#modalName').focus(),50);
}
$('#modalCancel').onclick = () => $('#modalBg').classList.remove('open');
$('#modalBg').onclick = e => { if(e.target.id==='modalBg') $('#modalBg').classList.remove('open'); };
$('#modalSave').onclick = () => {
  const name = $('#modalName').value.trim();
  const desc = $('#modalDesc').value.trim();
  const glyph = $('#glyphGrid .sel')?.dataset.glyph || 'XX';
  if (!name) { $('#modalName').focus(); return; }
  if (editingCompartment) {
    Object.assign(editingCompartment, { name, desc, glyph });
    toast('Compartment updated');
  } else {
    const id = name.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,24) + '-' + Date.now().toString().slice(-3);
    state.compartments.push({ id, name, desc, glyph });
    state.activeCompartment = id;
    toast('Compartment created');
  }
  $('#modalBg').classList.remove('open');
  save(); render();
};
$('#modalDelete').onclick = () => {
  if (!editingCompartment) return;
  if (!confirm(`Delete "${editingCompartment.name}"? Pages remain but become unassigned.`)) return;
  state.compartments = state.compartments.filter(c => c.id !== editingCompartment.id);
  state.pages = state.pages.filter(p => p.cid !== editingCompartment.id);
  state.sources = state.sources.filter(s => s.cid !== editingCompartment.id);
  state.proposals = state.proposals.filter(p => p.cid !== editingCompartment.id);
  if (state.activeCompartment === editingCompartment.id) state.activeCompartment = 'all';
  $('#modalBg').classList.remove('open');
  toast('Compartment deleted');
  save(); render();
};

/* ============================================================
   GRAPH (D3 force simulation)
============================================================ */
const COMPARTMENT_HUE = {
  trading: 18,   // rust
  design:  340,  // pink-rust
  agents:  68,   // lime-yellow
  fitness: 140   // green
};
function compartmentColor(cid){
  // give every dynamically-added compartment a consistent hue
  const idx = state.compartments.findIndex(c=>c.id===cid);
  const hue = COMPARTMENT_HUE[cid] ?? (idx*47 + 18) % 360;
  return `hsl(${hue}, 50%, 62%)`;
}

function buildGraphData(){
  const visiblePages = state.activeCompartment==='all'
    ? state.pages
    : state.pages.filter(p=>p.cid===state.activeCompartment);

  const nodes = visiblePages.map(p => ({
    id:p.id, label:p.title, type:p.type, cid:p.cid,
    confidence:p.confidence,
    r: p.confidence==='high' ? 9 : p.confidence==='medium' ? 7 : 5
  }));
  const idSet = new Set(nodes.map(n=>n.id));

  const links = [];
  visiblePages.forEach(p => (p.links||[]).forEach(l => {
    if (idSet.has(l)) {
      const target = state.pages.find(x=>x.id===l);
      links.push({ source:p.id, target:l, cross: target && target.cid !== p.cid });
    }
  }));
  return { nodes, links };
}

let sim, gZoom, gContent, pulseTimer, driftTimer;
function clearGraphTimers(){
  if (pulseTimer) { clearInterval(pulseTimer); pulseTimer = null; }
  if (driftTimer) { clearInterval(driftTimer); driftTimer = null; }
  if (sim) sim.stop();
}
function renderGraph(){
  clearGraphTimers();
  const view = $('#view');
  view.innerHTML = `
    <div class="graph-wrap">
      <div class="graph-grid"></div>
      <div class="graph-overlay">
        <h2>// SECOND BRAIN</h2>
        <p>${state.activeCompartment==='all'
          ? 'Every node from every compartment. Drag to rearrange. Scroll to zoom. Click to inspect.'
          : `${escape(compartmentOf(state.activeCompartment)?.name)} — ${escape(compartmentOf(state.activeCompartment)?.desc||'')}`}</p>
      </div>
      <div class="graph-controls">
        <button class="gctl" id="gZoomIn" title="Zoom in">+</button>
        <button class="gctl" id="gZoomOut" title="Zoom out">−</button>
        <button class="gctl" id="gRecenter" title="Recenter">◎</button>
      </div>
      <div class="legend" id="legend"></div>
      <div class="graph-stats">
        <div class="stat"><b id="statN">0</b>nodes</div>
        <div class="stat"><b id="statE">0</b>edges</div>
        <div class="stat"><b id="statC">0</b>compartments</div>
      </div>
      <svg id="graph"></svg>
    </div>
  `;

  // legend
  const compsToShow = state.activeCompartment==='all' ? state.compartments : state.compartments.filter(c=>c.id===state.activeCompartment);
  $('#legend').innerHTML = compsToShow.map(c =>
    `<div class="legend-row"><span class="swatch" style="background:${compartmentColor(c.id)}"></span>${escape(c.name)}</div>`
  ).join('');

  const svg = d3.select('#graph');
  const w = view.clientWidth;
  const h = view.clientHeight;

  const data = buildGraphData();
  $('#statN').textContent = data.nodes.length;
  $('#statE').textContent = data.links.length;
  $('#statC').textContent = compsToShow.length;

  svg.selectAll('*').remove();

  const defs = svg.append('defs');
  defs.append('filter').attr('id','glow').attr('x','-50%').attr('y','-50%').attr('width','200%').attr('height','200%')
    .append('feGaussianBlur').attr('stdDeviation','3').attr('result','coloredBlur');

  const g = svg.append('g');
  gContent = g;

  // zoom
  gZoom = d3.zoom().scaleExtent([0.3, 4]).on('zoom', ev => {
    g.attr('transform', ev.transform);
  });
  svg.call(gZoom);

  // compartment centroids for clustering when 'all'
  const cidList = [...new Set(data.nodes.map(n=>n.cid))];
  const centers = {};
  cidList.forEach((cid, i) => {
    const angle = (Math.PI*2*i)/Math.max(cidList.length,1) - Math.PI/2;
    const radius = Math.min(w,h) * 0.22;
    centers[cid] = { x: w/2 + Math.cos(angle)*radius, y: h/2 + Math.sin(angle)*radius };
  });

  // links
  const link = g.append('g').attr('class','links').selectAll('line')
    .data(data.links).enter().append('line')
    .attr('stroke', d => d.cross ? '#CCFF00' : 'rgba(255,255,255,.18)')
    .attr('stroke-width', d => d.cross ? 1.2 : 0.8)
    .attr('stroke-dasharray', d => d.cross ? '4 4' : null)
    .attr('opacity', 0.55);

  // nodes
  const node = g.append('g').attr('class','nodes').selectAll('g')
    .data(data.nodes).enter().append('g')
    .attr('class','node-g')
    .style('cursor','pointer');

  // glow halo
  node.append('circle')
    .attr('class','halo')
    .attr('r', d => d.r + 8)
    .attr('fill','none')
    .attr('stroke', d => compartmentColor(d.cid))
    .attr('stroke-width', 1)
    .attr('opacity', 0.2);

  // main circle
  node.append('circle')
    .attr('class','core')
    .attr('r', d => d.r)
    .attr('fill', d => compartmentColor(d.cid))
    .attr('stroke', '#0a0a0a')
    .attr('stroke-width', 2)
    .attr('filter','url(#glow)');

  // label
  node.append('text')
    .attr('y', d => d.r + 16)
    .attr('text-anchor','middle')
    .attr('font-family','IBM Plex Mono, monospace')
    .attr('font-size', 10)
    .attr('fill', '#a8a59c')
    .attr('letter-spacing','0.04em')
    .text(d => d.label.length > 22 ? d.label.slice(0,20)+'…' : d.label);

  // forces — slow cooling so the graph keeps drifting like a living brain
  sim = d3.forceSimulation(data.nodes)
    .alphaDecay(0.003)
    .velocityDecay(0.72)
    .force('link', d3.forceLink(data.links).id(d=>d.id).distance(d => d.cross ? 140 : 80).strength(0.35))
    .force('charge', d3.forceManyBody().strength(-260))
    .force('collide', d3.forceCollide().radius(d=>d.r+22))
    .force('center', d3.forceCenter(w/2, h/2))
    .force('cluster', alpha => {
      if (state.activeCompartment !== 'all') return;
      data.nodes.forEach(n => {
        const c = centers[n.cid]; if (!c) return;
        n.vx += (c.x - n.x) * 0.04 * alpha;
        n.vy += (c.y - n.y) * 0.04 * alpha;
      });
    })
    .force('flow', () => {
      // murmuration: coherent low-frequency flow + alignment with swarm
      const t = performance.now() * 0.00018;
      // average velocity (alignment target)
      let avx = 0, avy = 0, count = 0;
      data.nodes.forEach(d => { if (d.fx==null) { avx += d.vx; avy += d.vy; count++; } });
      if (count) { avx /= count; avy /= count; }
      data.nodes.forEach((d, i) => {
        if (d.fx != null) return;
        const phase = i * 0.42;
        // smooth coherent flow, two harmonics, low amplitude
        const fx = (Math.cos(t + phase) + 0.4 * Math.cos(t * 1.7 + phase * 2.1)) * 0.022;
        const fy = (Math.sin(t * 1.2 + phase) + 0.4 * Math.sin(t * 0.8 + phase * 1.5)) * 0.022;
        d.vx += fx;
        d.vy += fy;
        // weak alignment toward swarm-average velocity
        d.vx += (avx - d.vx) * 0.006;
        d.vy += (avy - d.vy) * 0.006;
      });
    })
    .on('tick', () => {
      link
        .attr('x1', d=>d.source.x).attr('y1', d=>d.source.y)
        .attr('x2', d=>d.target.x).attr('y2', d=>d.target.y);
      node.attr('transform', d => `translate(${d.x},${d.y})`);
    });

  // keep the simulation gently warm — fluid, not jittery
  sim.alphaTarget(0.025).restart();

  // neuron-style random pulses
  function firePulse(){
    if (!data.nodes.length) return;
    const n = data.nodes[Math.floor(Math.random() * data.nodes.length)];
    const sel = node.filter(d => d.id === n.id);
    const baseR = n.r;
    const color = compartmentColor(n.cid);
    // halo expands and fades
    sel.select('.halo')
      .interrupt()
      .transition().duration(260).ease(d3.easeQuadOut)
      .attr('r', baseR + 28)
      .attr('opacity', 0.55)
      .attr('stroke-width', 1.4)
      .transition().duration(900).ease(d3.easeQuadIn)
      .attr('r', baseR + 8)
      .attr('opacity', 0.2)
      .attr('stroke-width', 1);
    // core briefly brightens + grows
    sel.select('.core')
      .interrupt()
      .transition().duration(180).ease(d3.easeQuadOut)
      .attr('r', baseR + 1.8)
      .attr('fill', '#CCFF00')
      .transition().duration(700).ease(d3.easeQuadIn)
      .attr('r', baseR)
      .attr('fill', color);
    // pulse propagates to neighbors
    const neighbors = data.links.filter(l =>
      (l.source.id===n.id || l.target.id===n.id)
    );
    neighbors.forEach(l => {
      const isOut = l.source.id === n.id;
      const otherId = isOut ? l.target.id : l.source.id;
      // briefly glow the link
      link.filter(x => (x.source.id===l.source.id && x.target.id===l.target.id))
        .interrupt()
        .transition().duration(220)
        .attr('stroke', '#CCFF00')
        .attr('opacity', 0.95)
        .attr('stroke-width', 1.6)
        .transition().duration(700)
        .attr('stroke', l.cross ? '#CCFF00' : 'rgba(255,255,255,.18)')
        .attr('opacity', 0.55)
        .attr('stroke-width', l.cross ? 1.2 : 0.8);
      // small echo on the neighbor after a delay
      setTimeout(() => {
        const ns = node.filter(d => d.id === otherId);
        const nd = data.nodes.find(d => d.id === otherId);
        if (!nd) return;
        ns.select('.core')
          .interrupt()
          .transition().duration(160)
          .attr('r', nd.r + 0.8)
          .transition().duration(500)
          .attr('r', nd.r);
      }, 240);
    });
  }
  pulseTimer = setInterval(() => {
    // 1–2 pulses per beat, randomized for organic feel
    firePulse();
    if (Math.random() < 0.35) setTimeout(firePulse, 320 + Math.random()*400);
  }, 1400);

  // drag
  const drag = d3.drag()
    .on('start', (ev,d) => {
      if (!ev.active) sim.alphaTarget(0.3).restart();
      d.fx = d.x; d.fy = d.y;
    })
    .on('drag', (ev,d) => { d.fx = ev.x; d.fy = ev.y; })
    .on('end', (ev,d) => {
      if (!ev.active) sim.alphaTarget(0);
      d.fx = null; d.fy = null;
    });
  node.call(drag);

  // hover highlight neighbours
  const linkedById = {};
  data.links.forEach(l => {
    const a = typeof l.source==='object'?l.source.id:l.source;
    const b = typeof l.target==='object'?l.target.id:l.target;
    (linkedById[a] ??= new Set()).add(b);
    (linkedById[b] ??= new Set()).add(a);
  });
  node.on('mouseenter', (ev,d) => {
      node.style('opacity', n => (n.id===d.id || linkedById[d.id]?.has(n.id)) ? 1 : 0.18);
      link.style('opacity', l => (l.source.id===d.id || l.target.id===d.id) ? 0.9 : 0.05);
      link.style('stroke', l => (l.source.id===d.id || l.target.id===d.id) ? '#d97757' : (l.cross?'#CCFF00':'rgba(255,255,255,.18)'));
    })
    .on('mouseleave', () => {
      node.style('opacity', 1);
      link.style('opacity', 0.55);
      link.style('stroke', l => l.cross ? '#CCFF00' : 'rgba(255,255,255,.18)');
    })
    .on('click', (ev,d) => {
      state.selectedPageId = d.id;
      state.activeTab = 'wiki';
      $$('.top-tab').forEach(x => x.classList.toggle('active', x.dataset.tab==='wiki'));
      render();
    });

  // controls
  $('#gZoomIn').onclick  = () => svg.transition().duration(250).call(gZoom.scaleBy, 1.4);
  $('#gZoomOut').onclick = () => svg.transition().duration(250).call(gZoom.scaleBy, 1/1.4);
  $('#gRecenter').onclick= () => {
    svg.transition().duration(400).call(gZoom.transform, d3.zoomIdentity);
    sim.alpha(0.6).restart();
  };
}

function inferCompartment(text, url, title){
  const blob = ((title||'')+' '+(url||'')+' '+(text||'')).toLowerCase();
  const scores = state.compartments.map(c => {
    let s = 0;
    const haystack = (c.name + ' ' + c.desc).toLowerCase();
    haystack.split(/[^a-z0-9]+/).filter(Boolean).forEach(w => { if (w.length>3 && blob.includes(w)) s += 2; });
    if (c.id==='trading' && /(short|stock|13f|catalyst|borrow|small[- ]cap|ticker|trade|risk|filing)/.test(blob)) s += 4;
    if (c.id==='design'  && /(typograph|brand|motion|logo|figma|color|kerning|grid)/.test(blob)) s += 4;
    if (c.id==='agents'  && /(llm|claude|gpt|agent|prompt|rag|embedding|token|mcp|cursor|hermes)/.test(blob)) s += 4;
    if (c.id==='fitness' && /(heart|hr|run|recovery|training|km|pace|2\.4|mile|zone)/.test(blob)) s += 4;
    return { c, s };
  }).sort((a,b)=>b.s-a.s);
  if (scores[0].s === 0) return state.compartments[0];
  return scores[0].c;
}

function handleFiles(files, targetCid){
  files.forEach(f => {
    ingestSource({
      title: f.name,
      url: '',
      type: f.name.split('.').pop().toUpperCase(),
      text: f.name + ' — ' + f.type
    }, targetCid);
  });

function ingestSource(input, forceCid){
  const cid = forceCid || inferCompartment(input.text, input.url, input.title).id;
  const c = compartmentOf(cid);
  const id = 's-'+Date.now()+'-'+Math.random().toString(36).slice(2,5);
  state.sources.push({
    id, cid, type:input.type, title:input.title, url:input.url,
    status:'processed', summary:input.text ? input.text.slice(0,140) : 'Auto-routed by AI librarian.'
  });
  // create a proposal
  state.proposals.unshift({
    id:'p-'+Date.now(), cid, sid:id, type:'create_page',
    title:`Create page from: ${input.title}`,
    target:'',
    confidence:'medium', status:'pending',
    reasoning:`Source detected as ${c.name}. AI librarian proposes a structured wiki page before linking.`,
    content:`# ${input.title}\n\n## Summary\n\n${input.text ? input.text.slice(0,260) : 'Summarize after extraction.'}\n\n## Key Ideas\n\n- Extract main idea\n- Add source-backed claims\n- Suggest related pages\n\n## Related Pages\n\n`
  });
  $('#routingText').innerHTML = `<b>${escape(input.title)}</b> routed to <b>${escape(c.name)}</b>. ${forceCid?'(compartment locked)':'Inferred from content.'} A draft page proposal is now in the Review Queue.`;
  $('#aiRouting').style.display = 'flex';
  toast(`Routed → ${c.name}`);
  save();
  setTimeout(render, 700);
}

function renderMarkdown(md=''){
  const e = escape(md);
  return e
    .replace(/^# (.*)$/gm,'<h1>$1</h1>')
    .replace(/^## (.*)$/gm,'<h2>$1</h2>')
    .replace(/\[\[(.*?)\]\]/g,'<a href="#" data-wikilink="$1">$1</a>')
    .replace(/^- (.*)$/gm,'<li>$1</li>')
    .replace(/(<li>.*?<\/li>(?:\n|$))+/gs, m => '<ul>'+m+'</ul>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\n\n/g,'<br/><br/>');
}

    </div>
  `;

  $$('.page-item').forEach(b => b.onclick = () => {
    state.selectedPageId = b.dataset.page; render();
  });
  $('#newPage')?.addEventListener('click', () => {
    const title = prompt('Page title');
    if (!title) return;
    const id = title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')+'-'+Date.now().toString().slice(-3);
    const cid = state.activeCompartment==='all' ? state.compartments[0]?.id : state.activeCompartment;
    state.pages.push({ id, cid, title, type:'note', confidence:'draft', sources:[], links:[], md:`# ${title}\n\n## Summary\n\n` });
    state.selectedPageId = id;
    save(); render();
  });
  $('#editPage')?.addEventListener('click', () => {
    const updated = prompt('Edit markdown', page.md);
    if (updated !== null) { page.md = updated; save(); render(); }
  });
  $('#aiSuggest')?.addEventListener('click', () => {
    state.proposals.unshift({
      id:'p-'+Date.now(), cid:page.cid, sid:page.sources[0]||'', type:'update_page',
      title:`Strengthen page: ${page.title}`, target:page.id,
      confidence:'medium', status:'pending',
      reasoning:'AI librarian suggests adding clearer claims, related pages, and open questions.',
      content:`Add sections: Claims, Open Questions, Source Notes.`
    });
    state.activeTab='review';
    $$('.top-tab').forEach(x => x.classList.toggle('active', x.dataset.tab==='review'));
    save(); render();
  });
  $('#ctxToggle')?.addEventListener('click', () => {
    state.ctxOpen = !state.ctxOpen;
    $('#ctxDrawer').classList.toggle('open', state.ctxOpen);
    save();
  });
  $$('[data-go]').forEach(b => b.onclick = () => { state.selectedPageId = b.dataset.go; render(); });
  $$('[data-wikilink]').forEach(a => a.onclick = e => {
    e.preventDefault();
    const tgt = a.dataset.wikilink.toLowerCase();
    const found = state.pages.find(p => p.title.toLowerCase()===tgt);
    if (found) { state.selectedPageId = found.id; render(); }
  });
}

/* ============================================================
   REVIEW
============================================================ */
function renderReview(){
  const pending = propsIn(state.activeCompartment);
  $('#view').innerHTML = `
    <div class="review-wrap">
      <div class="review-head">
        <div>
          <span class="micro">// Review Queue</span>
          <h1>${pending.length} <b>pending</b></h1>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn" id="approveAll">Approve high-conf</button>
        </div>
      </div>
      ${pending.length ? pending.map(p => {
        const src = state.sources.find(s=>s.id===p.sid);
        const c = compartmentOf(p.cid);
        return `<div class="prop">
          <div class="prop-head">
            <div style="min-width:0;flex:1">
              <div class="prop-tags">
                <span class="tag">${escape(p.type)}</span>
                <span class="tag ${p.confidence}">${escape(p.confidence)}</span>
                <span class="tag">${escape(c?.name||'')}</span>
              </div>
              <h3>${escape(p.title)}</h3>
              <p class="reasoning">${escape(p.reasoning)}</p>
              ${src?`<p class="source-ref">↳ ${escape(src.title)}</p>`:''}
            </div>
            <div class="prop-actions">
              <button class="btn" data-edit="${p.id}">Edit</button>
              <button class="btn" data-reject="${p.id}" style="border-color:var(--rust);color:var(--rust)">Reject</button>
              <button class="btn primary" data-approve="${p.id}">Approve</button>
            </div>
          </div>
          <pre>${escape(p.content)}</pre>
        </div>`;
      }).join('') : `
        <div class="empty">
          <div class="glyph">✓</div>
          <h3>Queue clean</h3>
          <p>New AI-generated wiki changes appear here before entering the vault.</p>
        </div>`}
    </div>
  `;
  $$('[data-approve]').forEach(b => b.onclick = () => approveProposal(b.dataset.approve));
  $$('[data-reject]').forEach(b => b.onclick = () => { rejectProposal(b.dataset.reject); });
  $$('[data-edit]').forEach(b => b.onclick = () => {
    const p = state.proposals.find(x=>x.id===b.dataset.edit);
    const u = prompt('Edit proposal content', p.content);
    if (u!==null) { p.content = u; save(); render(); }
  });
  $('#approveAll').onclick = () => {
    propsIn(state.activeCompartment).filter(p=>p.confidence==='high').forEach(p => approveProposal(p.id, false));
    save(); render();
    toast('High-confidence proposals approved');
  };
}
function approveProposal(id, doRender=true){
  const p = state.proposals.find(x=>x.id===id);
  if (!p) return;
  p.status = 'approved';
  if (p.type === 'create_page') {
    const title = p.title.replace(/^Create page from:\s*/i,'').replace(/^Create page:\s*/i,'');
    const newId = title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')+'-'+Date.now().toString().slice(-3);
    state.pages.push({ id:newId, cid:p.cid, title, type:'source-note', confidence:p.confidence, sources:p.sid?[p.sid]:[], links:[], md:p.content });
  } else if (p.target) {
    const page = state.pages.find(x=>x.id===p.target);
    if (page) page.md += `\n\n## AI Approved\n\n${p.content}\n`;
  }
  if (doRender) { save(); render(); toast('Approved'); }
}
function rejectProposal(id){
  const p = state.proposals.find(x=>x.id===id);
  if (p) { p.status='rejected'; save(); render(); toast('Rejected'); }
}

/* ============================================================
   RESEARCH
============================================================ */
function renderResearch(){
  const missions = state.missions.filter(m => state.activeCompartment==='all' || m.cid===state.activeCompartment);
  $('#view').innerHTML = `
    <div class="research-wrap">
      <div class="review-head">
        <div>
          <span class="micro">// Research Missions</span>
          <h1>Autoresearch — <b>review-gated</b></h1>
        </div>
        <button class="btn primary" id="newMission">+ New mission</button>
      </div>
      <div class="mission-grid">
        ${missions.map(m => `
          <div class="mission">
            <h3>${escape(m.title)}</h3>
            <span class="status">${escape(m.status)} · ${escape(compartmentOf(m.cid)?.name||'—')}</span>
            <ol>${m.steps.map(s=>`<li>${escape(s)}</li>`).join('')}</ol>
            <div class="run"><button class="btn lime" data-run="${m.id}">Mock run → proposals</button></div>
          </div>
        `).join('') || '<p style="color:var(--ink-3);font-size:13px">No missions yet.</p>'}
      </div>
    </div>
  `;
  $$('[data-run]').forEach(b => b.onclick = () => {
    const m = state.missions.find(x=>x.id===b.dataset.run);
    state.proposals.unshift({
      id:'p-'+Date.now(), cid:m.cid, sid:'', type:'research_synthesis',
      title:`Synthesis: ${m.title}`, target:'',
      confidence:'medium', status:'pending',
      reasoning:'Mock mission produced a synthesis proposal.',
      content:`# ${m.title}\n\n## Synthesis\n\nWould summarize collected sources here.\n\n## Next Questions\n\n- What source is missing?\n- Which claim needs evidence?`
    });
    state.activeTab='review';
    $$('.top-tab').forEach(x => x.classList.toggle('active', x.dataset.tab==='review'));
    save(); render();
  });
  $('#newMission').onclick = () => {
    const t = prompt('Mission title'); if (!t) return;
    const cid = state.activeCompartment==='all' ? state.compartments[0].id : state.activeCompartment;
    state.missions.unshift({ id:'m-'+Date.now(), cid, title:t, status:'draft', steps:['Collect sources','Ingest sources','Generate synthesis','Create proposals'] });
    save(); render();
  };
}

/* ============================================================
   SEARCH
============================================================ */
$('#search').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const q = e.target.value.trim().toLowerCase();
    if (!q) return;
    const hit = state.pages.find(p => p.title.toLowerCase().includes(q) || p.md.toLowerCase().includes(q));
    if (hit) {
      state.activeCompartment = hit.cid;
      state.selectedPageId = hit.id;
      state.activeTab = 'wiki';
      $$('.top-tab').forEach(x => x.classList.toggle('active', x.dataset.tab==='wiki'));
      e.target.value = '';
      render();
    } else toast('No match');
  }
});
window.addEventListener('keydown', e => {
  if ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k') { e.preventDefault(); $('#search').focus(); }
});

/* ============================================================
   RENDER ROOT
============================================================ */
function render(){
  if (state.activeTab !== 'graph') clearGraphTimers();
  renderRail();
  renderCrumb();
  if (state.activeTab==='graph')    renderGraph();
  if (state.activeTab==='wiki')     renderWiki();
  if (state.activeTab==='inbox')    renderInbox();
  if (state.activeTab==='review')   renderReview();
  if (state.activeTab==='research') renderResearch();
  save();
}
window.addEventListener('resize', () => { if (state.activeTab==='graph') renderGraph(); });
render();
</script>
</body>
</html>
