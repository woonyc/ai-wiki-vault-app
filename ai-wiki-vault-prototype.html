      missions: [
        {

          compartmentId: 'agents',

    const STORAGE_KEY = 'ai-wiki-vault-state-v1';
    let state = loadState();

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) return JSON.parse(saved);
      } catch (e) {
        console.warn('Could not load saved state', e);
      }
      return structuredClone(initialState);
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function currentCompartment() {
      return state.compartments.find(c => c.id === state.activeCompartment);
    }

    function currentPages() {
      return state.pages.filter(p => p.compartmentId === state.activeCompartment);
    }

    function currentSources() {
      return state.sources.filter(s => s.compartmentId === state.activeCompartment);
    }

    function currentProposals() {
      return state.proposals.filter(p => p.compartmentId === state.activeCompartment && p.status === 'pending');
    }

    function selectedPage() {
      return state.pages.find(p => p.id === state.selectedPageId) || currentPages()[0] || state.pages[0];
    }

    function htmlEscape(str = '') {
      return String(str)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function renderMarkdown(md = '') {
      const escaped = htmlEscape(md);
      return escaped
        .replace(/^# (.*)$/gm, '<h1>$1</h1>')
        .replace(/^## (.*)$/gm, '<h2>$1</h2>')
        .replace(/\[\[(.*?)\]\]/g, '<a href="#" data-wikilink="$1">[[$1]]</a>')
        .replace(/^- (.*)$/gm, '<li>$1</li>')
        .replace(/(<li>.*<\/li>)/gs, '<ul>$1</ul>')
        .replace(/\n\n/g, '<br/>')
        .replace(/`([^`]+)`/g, '<code>$1</code>');
    }

    function setTitle(title, crumbText) {
      document.getElementById('mainTitle').textContent = title;
      document.getElementById('crumb').textContent = crumbText || `${currentCompartment().name} · ${capitalize(state.activeTab)}`;
    }

    function capitalize(s) {
      return s.charAt(0).toUpperCase() + s.slice(1);
    }

    function render() {
      renderCompartments();
      renderTabs();
      renderPageList();

      if (state.activeTab === 'inbox') renderInbox();
      if (state.activeTab === 'wiki') renderWiki();
      if (state.activeTab === 'graph') renderGraph();
      if (state.activeTab === 'research') renderResearch();
      if (state.activeTab === 'review') renderReviewQueue();

      saveState();
    }

    function renderCompartments() {
      const wrap = document.getElementById('compartmentList');
      wrap.innerHTML = state.compartments.map(c => {
        const active = c.id === state.activeCompartment;
        return `
          <button data-compartment="${c.id}" class="compartment-btn w-full text-left p-3 rounded-2xl soft-border transition ${active ? 'bg-violet-400/15 border-violet-300/30' : 'bg-white/[0.03] hover:bg-white/[0.06]'}">
            <div class="flex items-center gap-3">
              <span class="text-lg">${c.icon}</span>
              <div class="min-w-0">
                <div class="text-sm font-semibold truncate">${c.name}</div>
                <div class="text-[11px] text-slate-400 truncate">${c.description}</div>
              </div>
            </div>
          </button>
        `;
      }).join('');

      document.querySelectorAll('.compartment-btn').forEach(btn => {
        btn.onclick = () => {
          state.activeCompartment = btn.dataset.compartment;
          const firstPage = currentPages()[0];
          if (firstPage) state.selectedPageId = firstPage.id;
          render();
        };
      });
    }

    function renderTabs() {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('tab-active', btn.dataset.tab === state.activeTab);
        btn.onclick = () => {
          state.activeTab = btn.dataset.tab;
          render();
        };
      });
    }

    function renderPageList() {
      const wrap = document.getElementById('pageList');
      const pages = currentPages();
      wrap.innerHTML = pages.map(p => `
        <button data-page="${p.id}" class="page-btn w-full text-left px-3 py-2 rounded-xl text-sm ${p.id === state.selectedPageId ? 'bg-white/10 text-violet-100' : 'text-slate-300 hover:bg-white/5'}">
          <div class="truncate">${p.title}</div>
          <div class="text-[10px] text-slate-500 truncate">${p.type} · ${p.confidence}</div>
        </button>
      `).join('') || `<p class="text-sm text-slate-500">No pages yet.</p>`;

      document.querySelectorAll('.page-btn').forEach(btn => {
        btn.onclick = () => {
          state.selectedPageId = btn.dataset.page;
          state.activeTab = 'wiki';
          render();
        };
      });

      document.getElementById('newPageBtn').onclick = () => {
        const title = prompt('New page title');
        if (!title) return;
        const id = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') + '-' + Date.now().toString().slice(-4);
        state.pages.push({
          id,
          compartmentId: state.activeCompartment,
          title,
          type: 'note',
          confidence: 'draft',
          sources: [],
          links: [],
          markdown: `# ${title}\n\n## Summary\n\nStart writing here.\n\n## Related Pages\n\n`
        });
        state.selectedPageId = id;
        state.activeTab = 'wiki';
        render();
      };
    }

    function renderInbox() {
      setTitle('Source Inbox', `${currentCompartment().name} · Inbox`);
      document.getElementById('viewActions').innerHTML = `
        <button id="mockVideoBtn" class="text-xs px-3 py-2 rounded-xl bg-white/5 hover:bg-white/10 soft-border">Add video note</button>
      `;

      document.getElementById('mainContent').innerHTML = `
        <div class="grid xl:grid-cols-2 gap-4">
          <section class="glass rounded-3xl p-4 md:p-5">
            <div class="flex items-start justify-between gap-4 mb-4">
              <div>
                <h3 class="font-bold text-lg">Add a source</h3>
                <p class="text-sm text-slate-400 mt-1">Paste a URL, transcript, article, or rough note. AI creates proposals, not direct edits.</p>
              </div>
              <span class="text-xs text-violet-300 bg-violet-400/10 px-2 py-1 rounded-full soft-border">Phase 1</span>
            </div>

            <form id="sourceForm" class="space-y-3">
              <input id="sourceTitle" class="w-full bg-white/5 soft-border rounded-2xl px-4 py-3 text-sm outline-none focus:border-violet-400/60" placeholder="Source title" required>
              <input id="sourceUrl" class="w-full bg-white/5 soft-border rounded-2xl px-4 py-3 text-sm outline-none focus:border-violet-400/60" placeholder="URL, YouTube link, or leave blank">
              <select id="sourceType" class="w-full bg-white/5 soft-border rounded-2xl px-4 py-3 text-sm outline-none focus:border-violet-400/60">
                <option>URL</option>
                <option>YouTube / Video Transcript</option>
                <option>PDF</option>
                <option>Manual Note</option>
                <option>Trading Report</option>

    function addSource(withProposals) {
      const title = document.getElementById('sourceTitle').value.trim();
      const url = document.getElementById('sourceUrl').value.trim();
      const type = document.getElementById('sourceType').value;
      const text = document.getElementById('sourceText').value.trim();
      if (!title) return;

      const id = 'src-' + Date.now();
      state.sources.unshift({
        id,
        compartmentId: state.activeCompartment,
        type,
        title,
        url,
        status: withProposals ? 'processed' : 'raw',
        summary: text ? text.slice(0, 150) + (text.length > 150 ? '...' : '') : 'No body text provided yet.'
      });

      if (withProposals) {
        const pageTitle = inferPageTitle(title);
        state.proposals.unshift({
          id: 'prop-' + Date.now(),
          compartmentId: state.activeCompartment,
          sourceId: id,
          type: 'create_page',
          title: `Create page: ${pageTitle}`,
          targetPageId: '',
          confidence: 'medium',
          status: 'pending',
          reasoning: `This source appears relevant to ${currentCompartment().name}. The AI librarian suggests making it a structured wiki page first, then linking it after review.`,
          suggestedContent: `# ${pageTitle}\n\n## Summary\n\n${text ? text.slice(0, 280) : 'Summarize this source after full extraction.'}\n\n## Key Ideas\n\n- Extract main idea\n- Add source-backed claims\n- Suggest related pages\n\n## Related Pages\n\n`
        });

        state.proposals.unshift({
          id: 'prop-' + (Date.now() + 1),
          compartmentId: state.activeCompartment,
          sourceId: id,
          type: 'add_backlink',
          title: `Suggest backlinks from ${pageTitle}`,
          targetPageId: state.selectedPageId,
          confidence: 'low',
          status: 'pending',
          reasoning: 'Possible relation detected, but user should verify before linking.',
          suggestedContent: `Review whether this source should link to [[${selectedPage().title}]].`
        });
      }

      state.activeTab = withProposals ? 'review' : 'inbox';
      render();
    }

          if (page) {
            state.selectedPageId = page.id;
            renderContextForNode(page);

    function buildGraphNodes() {
      const pages = state.pages.filter(p => p.compartmentId === state.activeCompartment);
      const comp = currentCompartment();
      const center = { id: comp.id, label: comp.name, type: 'compartment', x: 450, y: 300, r: 52, color: comp.accent };
      const radius = 210;
      const pageNodes = pages.map((p, i) => {
        const angle = (Math.PI * 2 * i) / Math.max(pages.length, 1) - Math.PI / 2;
        return {
          id: p.id,
          label: p.title,
          type: p.type,
          x: 450 + Math.cos(angle) * radius,
          y: 300 + Math.sin(angle) * radius,
          r: p.confidence === 'high' ? 34 : 29,
          color: p.compartmentId === 'trading' ? '#a78bfa' : p.compartmentId === 'design' ? '#f472b6' : p.compartmentId === 'agents' ? '#22d3ee' : '#34d399'
        };
      });
      return [center, ...pageNodes];
    }

    function buildGraphEdges(nodes) {
      const edges = [];
      const nodeMap = Object.fromEntries(nodes.map(n => [n.id, n]));
      nodes.slice(1).forEach(n => edges.push({ from: nodeMap[state.activeCompartment], to: n, type: 'belongs_to' }));
      state.pages.filter(p => p.compartmentId === state.activeCompartment).forEach(p => {
        (p.links || []).forEach(linkId => {
          if (nodeMap[p.id] && nodeMap[linkId]) edges.push({ from: nodeMap[p.id], to: nodeMap[linkId], type: 'related_to' });
        });
      });
      return edges;
    }

    function approveProposal(id, shouldRender = true) {
      const p = state.proposals.find(x => x.id === id);
      if (!p) return;
      p.status = 'approved';

      if (p.type === 'create_page' || p.type === 'research_synthesis') {
        const title = p.title.replace(/^Create page:\s*/i, '').replace(/^Create synthesis from mission:\s*/i, '');
        const newId = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') + '-' + Date.now().toString().slice(-4);
        state.pages.push({
          id: newId,
          compartmentId: p.compartmentId,
          title,
          type: p.type === 'research_synthesis' ? 'synthesis' : 'source-note',
          confidence: p.confidence,
          sources: p.sourceId ? [p.sourceId] : [],
          links: [],
          markdown: p.suggestedContent
        });
        state.selectedPageId = newId;
      } else if (p.targetPageId) {
        const page = state.pages.find(pg => pg.id === p.targetPageId);
        if (page) {
          page.markdown += `\n\n## AI Approved Update\n\n${p.suggestedContent}\n`;
        }
      }

      if (shouldRender) render();
    }

      const p = state.proposals.find(x => x.id === id);
      if (!p) return;
      p.status = 'rejected';

          <section>
            <h4 class="text-xs uppercase tracking-[.18em] text-slate-500 mb-2">AI Suggestions</h4>
            <div class="bg-violet-400/10 soft-border rounded-2xl p-3 text-sm text-violet-100">Add claims and source notes to make this page more auditable.</div>
          </section>
        </div>
      `;
      document.querySelectorAll('.related-page').forEach(btn => {
        btn.onclick = () => {
          state.selectedPageId = btn.dataset.related;
          render();
        };
      });
    }

    function renderContextForNode(page) {
      document.getElementById('contextTitle').textContent = page ? page.title : 'Graph Node';
      document.getElementById('contextSubtitle').textContent = page ? `${page.type} · ${page.confidence}` : 'Select a node';
      document.getElementById('contextContent').innerHTML = page ? `
        <div class="space-y-3">
          <div class="bg-white/[0.04] soft-border rounded-2xl p-3">
            <h4 class="font-semibold text-sm">Node Summary</h4>
            <p class="text-sm text-slate-400 mt-1">${htmlEscape(page.markdown.replace(/[#\-\[\]]/g, '').slice(0, 220))}...</p>
          </div>
          <button id="openNodePage" class="w-full rounded-2xl bg-violet-500 hover:bg-violet-400 px-4 py-3 text-sm font-semibold">Open page</button>
          <div class="bg-white/[0.04] soft-border rounded-2xl p-3">
            <h4 class="font-semibold text-sm">Links</h4>
            <p class="text-sm text-slate-400 mt-1">${(page.links || []).length} outgoing links</p>
          </div>
        </div>
      ` : `<p class="text-sm text-slate-500">Click a node to inspect it.</p>`;

      const btn = document.getElementById('openNodePage');
      if (btn && page) {
        btn.onclick = () => {
          state.selectedPageId = page.id;
          state.activeTab = 'wiki';
          render();
        };
      }
    }

    function renderContextForResearch() {
      document.getElementById('contextTitle').textContent = 'Research Agent';
      document.getElementById('contextSubtitle').textContent = 'Autoresearch-inspired, but review-gated.';
      document.getElementById('contextContent').innerHTML = `
        <div class="space-y-3">
          <div class="bg-white/[0.04] soft-border rounded-2xl p-3">
            <h4 class="font-semibold text-sm">Safe default</h4>
            <p class="text-sm text-slate-400 mt-1">Missions should create proposals, not overwrite pages.</p>
          </div>
          <div class="bg-white/[0.04] soft-border rounded-2xl p-3">
            <h4 class="font-semibold text-sm">Later upgrade</h4>
            <p class="text-sm text-slate-400 mt-1">Add source search, citation extraction, and synthesis reports.</p>
          </div>
        </div>
      `;
    }

    function renderContextForReview(pending) {
      document.getElementById('contextTitle').textContent = 'AI Review Control';
      document.getElementById('contextSubtitle').textContent = `${pending.length} pending proposal${pending.length === 1 ? '' : 's'}`;
      document.getElementById('contextContent').innerHTML = `
        <div class="space-y-3">
          <div class="bg-white/[0.04] soft-border rounded-2xl p-3">
            <h4 class="font-semibold text-sm">Why this matters</h4>
            <p class="text-sm text-slate-400 mt-1">The review queue is the anti-slop layer. It keeps the wiki useful and auditable.</p>
          </div>
          <div class="bg-white/[0.04] soft-border rounded-2xl p-3">
            <h4 class="font-semibold text-sm">Approval rule</h4>
            <p class="text-sm text-slate-400 mt-1">Approve high-confidence factual updates. Manually inspect interpretation, cross-links, and trading-related claims.</p>
          </div>
        </div>
      `;
    }

    document.getElementById('exportBtn').onclick = () => {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'ai-wiki-vault-export.json';
      a.click();
      URL.revokeObjectURL(url);
    };

    document.getElementById('globalSearch').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      if (!q) return renderPageList();
      const wrap = document.getElementById('pageList');
      const results = state.pages.filter(p =>
        p.title.toLowerCase().includes(q) ||
        p.markdown.toLowerCase().includes(q)
      );
      wrap.innerHTML = results.map(p => `
        <button data-page="${p.id}" class="page-btn w-full text-left px-3 py-2 rounded-xl text-sm text-slate-300 hover:bg-white/5">
          <div class="truncate">${p.title}</div>
          <div class="text-[10px] text-slate-500 truncate">${state.compartments.find(c => c.id === p.compartmentId)?.name || ''}</div>
        </button>
      `).join('') || '<p class="text-sm text-slate-500">No results.</p>';
      document.querySelectorAll('.page-btn').forEach(btn => {
        btn.onclick = () => {
          const page = state.pages.find(p => p.id === btn.dataset.page);
          if (page) {
            state.activeCompartment = page.compartmentId;
            state.selectedPageId = page.id;
            state.activeTab = 'wiki';
            e.target.value = '';
            render();
          }
        };
      });
    });

    window.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        document.getElementById('globalSearch').focus();
      }
    });

    render();
  </script>
</body>
</html>
